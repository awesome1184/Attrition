<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attrition - Prototype</title>
<style>
:root{--bg:#0c1117;--panel:#141c25;--panel2:#1b2632;--line:#2b3a49;--text:#e9eef3;--muted:#9dacbb;--accent:#70b7ff;--good:#75d99b;--warn:#f3c86b;--bad:#ee7f7f}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0a0f14,#101923);color:var(--text);font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;background:#22303e;border:1px solid #3a4d60;border-radius:7px;padding:8px 11px;cursor:pointer}button:hover{background:#2a3c4d}button:disabled{opacity:.45;cursor:not-allowed}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.topbar{display:flex;align-items:center;gap:18px;padding:10px 16px;background:#101822;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{font-size:19px;font-weight:800;letter-spacing:.08em}.subtitle{color:var(--muted);font-size:12px}.resources{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}.res{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:92px}.res span:first-child{display:block;color:var(--muted);font-size:11px}.res span:last-child{font-weight:700}.layout{display:grid;grid-template-columns:250px minmax(500px,1fr) 330px;min-height:0}.left,.right{background:rgba(20,28,37,.96);padding:12px;overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.section{margin-bottom:18px}.section h3{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.nav button{width:100%;text-align:left;margin-bottom:6px}.nav button.active{border-color:var(--accent);background:#1f3447}.content{padding:14px;overflow:auto}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:12px}.hero h1{margin:0 0 4px;font-size:25px}.hero p{margin:0;color:var(--muted)}.tag{display:inline-block;padding:4px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:11px}.grid{display:grid;gap:10px}.grid.cards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px}.card h4{margin:0 0 5px}.card .desc{color:var(--muted);font-size:12px}.cost{font-size:12px;color:var(--warn);margin:7px 0}.small{font-size:12px;color:var(--muted)}.stack{display:flex;flex-direction:column;gap:7px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.meter{height:8px;background:#0b1015;border:1px solid var(--line);border-radius:99px;overflow:hidden}.meter>i{display:block;height:100%;background:var(--accent)}.notice{padding:9px 10px;background:#18222d;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}.notice.good{border-color:#315941}.notice.warn{border-color:#63512c}.notice.bad{border-color:#5b3030}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:900px;margin:auto}.tile{aspect-ratio:1.1;border:1px solid #415261;border-radius:9px;background:#17212b;position:relative;padding:8px;text-align:left;overflow:hidden}.tile .name{font-weight:700;font-size:12px}.tile .owner{font-size:10px;color:var(--muted);margin-top:2px}.tile .strength{position:absolute;bottom:7px;left:8px;right:8px;font-size:10px}.tile.friendly{background:#17291f;border-color:#3a6848}.tile.hostile{background:#2b191d;border-color:#6b3e47}.tile.locked{opacity:.5}.tile.current{outline:2px solid var(--accent)}.portalHead{background:linear-gradient(120deg,#24173f,#152b3c);border:1px solid #4d3c68;border-radius:10px;padding:12px;margin-bottom:12px}.log{max-height:185px;overflow:auto;background:#0a0f14;border:1px solid var(--line);border-radius:7px;padding:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.log div{padding:2px 0;color:#afbdca}.debug{position:fixed;right:14px;bottom:14px;width:340px;max-height:70vh;overflow:auto;background:#0b1016;z-index:20;border:1px solid #617b96;border-radius:10px;box-shadow:0 15px 40px #0008;padding:12px;display:none}.debug.open{display:block}.debug h3{margin:0 0 8px}.debug .row{margin:6px 0}.debug input{width:90px;background:#111923;color:var(--text);border:1px solid var(--line);padding:5px;border-radius:5px}.kbd{font-family:ui-monospace,monospace;background:#222b35;border:1px solid #3b4752;border-radius:4px;padding:1px 4px;font-size:11px}.pill{padding:3px 6px;border-radius:5px;background:#1e2934;color:var(--muted);font-size:11px}.unitrow{display:grid;grid-template-columns:1fr 55px 75px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #20303c}.unitrow:last-child{border-bottom:0}.right h2{font-size:16px;margin:0 0 10px}.building{padding:8px;background:#18222b;border:1px solid var(--line);border-radius:7px;margin-bottom:6px}.building b{display:block}.progress{margin-top:6px}.footerhint{margin-top:12px;color:var(--muted);font-size:11px;text-align:center}@media(max-width:1000px){.layout{grid-template-columns:210px 1fr}.right{display:none}}@media(max-width:700px){.topbar{align-items:flex-start;flex-direction:column}.resources{margin-left:0}.layout{grid-template-columns:1fr}.left{display:none}.map{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div><div class="brand">ATTRITION</div><div class="subtitle">Strategy sandbox / vertical slice</div></div><div class="resources" id="resources"></div><button id="debugBtn">Debug <span class="kbd">`</span></button></header>
<div class="layout">
<aside class="left">
  <div class="section"><h3>Command</h3><div class="nav" id="nav"></div></div>
  <div class="section"><h3>Quick Stats</h3><div id="stats" class="stack"></div></div>
  <div class="section"><h3>Controls</h3><div class="small">This prototype autosaves locally. Use the debug console for rapid testing, because apparently humans would like to test a strategy game without waiting three days for a farm to grow.</div></div>
</aside>
<main class="content" id="content"></main>
<aside class="right" id="rightPanel"></aside>
</div>
</div>
<div class="debug" id="debugPanel"></div>
<script>
const BUILDINGS={
 town:{name:'Town Center',cost:{wood:500,stone:300},time:10,desc:'Administrative core. Raises settlement level and unlocks stronger buildings.'},
 house:{name:'House',cost:{wood:120},time:4,desc:'Adds 50 population capacity.'},
 farm:{name:'Farm',cost:{wood:150},time:5,desc:'Produces Food. Each level increases food income.'},
 lumber:{name:'Lumber Mill',cost:{wood:220,stone:40},time:6,desc:'Produces Wood from nearby forests.'},
 quarry:{name:'Quarry',cost:{wood:180,stone:80},time:7,desc:'Produces Stone.'},
 iron:{name:'Iron Mine',cost:{wood:260,stone:120},time:8,desc:'Produces Iron from an ore deposit.'},
 oil:{name:'Oil Well',cost:{wood:500,stone:250,iron:150},time:15,desc:'Produces Oil. Unlocks advanced industrial warfare.'},
 mana:{name:'Mana Crystal Mine',cost:{wood:600,stone:350,iron:200},time:18,desc:'Produces rare Mana Crystals used by magical systems.'},
 warehouse:{name:'Warehouse',cost:{wood:280,stone:100},time:7,desc:'Raises resource storage capacity.'},
 market:{name:'Market',cost:{wood:400,stone:160},time:10,desc:'Enables resource exchange and future diplomacy.'},
 barracks:{name:'Barracks',cost:{wood:350,stone:120,iron:50},time:9,desc:'Trains infantry units.'},
 range:{name:'Archery Range',cost:{wood:420,stone:80,iron:40},time:9,desc:'Trains ranged units.'},
 stable:{name:'Stable',cost:{wood:550,stone:150,iron:100},time:12,desc:'Trains cavalry and improves army mobility.'},
 workshop:{name:'Workshop',cost:{wood:650,stone:300,iron:180},time:15,desc:'Builds siege machinery and later vehicles.'},
 hospital:{name:'Hospital',cost:{wood:500,stone:350,iron:120},time:13,desc:'Turns a share of casualties into wounded troops and increases recovery.'},
 wall:{name:'Wall',cost:{wood:300,stone:700},time:14,desc:'Defensive structure that absorbs siege damage and buys defenders time.'},
 tower:{name:'Watchtower',cost:{wood:250,stone:450},time:10,desc:'Provides early warning and better intelligence.'},
 rally:{name:'Rally Point',cost:{wood:380,stone:220,iron:60},time:9,desc:'Improves reinforcement speed and army coordination.'},
 command:{name:'Command Center',cost:{wood:700,stone:500,iron:300},time:18,desc:'Increases command capacity and unlocks advanced army controls.'},
 refinery:{name:'Refinery',cost:{wood:700,stone:500,iron:500,oil:150},time:24,desc:'Processes Oil for industrial systems.'},
 reactor:{name:'Mana Reactor',cost:{wood:800,stone:500,iron:250,mana:50},time:24,desc:'Converts Mana Crystals into magical energy.'},
 academy:{name:'Arcane Academy',cost:{wood:900,stone:700,iron:300,mana:100},time:30,desc:'Researches spells and battlefield influence abilities.'}
};
const UNITS={
 militia:{name:'Militia',building:'barracks',cost:{food:15,wood:5},time:15,upkeep:.5,hp:60,atk:8,def:7},
 spearman:{name:'Spearman',building:'barracks',cost:{food:25,wood:15},time:30,upkeep:1,hp:90,atk:12,def:14},
 swordsman:{name:'Swordsman',building:'barracks',cost:{food:50,wood:30,iron:10},time:75,upkeep:2,hp:150,atk:24,def:24},
 archer:{name:'Archer',building:'range',cost:{food:20,wood:20},time:35,upkeep:1,hp:55,atk:18,def:6},
 crossbow:{name:'Crossbowman',building:'range',cost:{food:40,wood:35,iron:15},time:90,upkeep:2,hp:70,atk:32,def:8},
 cavalry:{name:'Cavalry',building:'stable',cost:{food:70,wood:20,iron:25},time:120,upkeep:3,hp:180,atk:35,def:18}
};
const MAP=[
 {id:0,name:'Portal Landing',kind:'base',owner:'player',strength:0,x:0,y:0,reward:0},
 {id:1,name:'Fallen Hamlet',kind:'village',owner:'enemy',strength:1800,x:1,y:0,reward:400},
 {id:2,name:'Iron Hills',kind:'resource',owner:'enemy',strength:3200,x:2,y:0,reward:650,bonus:'iron'},
 {id:3,name:'Bleak Forest',kind:'resource',owner:'enemy',strength:2800,x:0,y:1,reward:600,bonus:'wood'},
 {id:4,name:'Crossroads',kind:'fort',owner:'enemy',strength:4200,x:1,y:1,reward:800,bonus:'speed'},
 {id:5,name:'Mana Marsh',kind:'magic',owner:'enemy',strength:4500,x:2,y:1,reward:1000,bonus:'mana'},
 {id:6,name:'Old Quarry',kind:'resource',owner:'enemy',strength:3800,x:3,y:0,reward:700,bonus:'stone'},
 {id:7,name:'Ashen Camp',kind:'camp',owner:'enemy',strength:5200,x:3,y:1,reward:900},
 {id:8,name:'Crumbling Gate',kind:'fort',owner:'enemy',strength:6800,x:4,y:1,reward:1200},
 {id:9,name:'Warden Keep',kind:'boss',owner:'enemy',strength:9500,x:4,y:0,reward:2500},
 {id:10,name:'Hidden Shrine',kind:'magic',owner:'locked',strength:5200,x:0,y:2,reward:1200,bonus:'mana'},
 {id:11,name:'Blackstone Mine',kind:'resource',owner:'locked',strength:5000,x:1,y:2,reward:1100,bonus:'iron'},
 {id:12,name:'Sunken Road',kind:'road',owner:'locked',strength:4700,x:2,y:2,reward:900},
 {id:13,name:'War Engine Yard',kind:'industrial',owner:'locked',strength:7200,x:3,y:2,reward:1500,bonus:'oil'},
 {id:14,name:'Rift Citadel',kind:'boss',owner:'locked',strength:12000,x:4,y:2,reward:4000}
];
const defaultState={resources:{food:5000,wood:3500,stone:2200,iron:900,oil:200,mana:80,gold:800},cap:{food:10000,wood:10000,stone:8000,iron:5000,oil:2000,mana:500,gold:3000},population:420,popCap:500,buildings:{town:1,farm:3,lumber:2,quarry:1,iron:1,warehouse:1,barracks:1,range:1},army:{militia:120,spearman:80,swordsman:30,archer:70,crossbow:20,cavalry:10},wounded:40,screen:'settlement',portal:null,log:[]};
let state=load();
function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){try{const x=JSON.parse(localStorage.getItem('attrition-demo'));return x?Object.assign(clone(defaultState),x):clone(defaultState)}catch{return clone(defaultState)}}
function save(){localStorage.setItem('attrition-demo',JSON.stringify(state))}
function fmt(n){return Math.floor(n).toLocaleString()}
function resourceIcon(k){return ({food:'🍞',wood:'🪵',stone:'🪨',iron:'⚙️',oil:'🛢️',mana:'🔮',gold:'🪙'})[k]||''}
function costText(c){return Object.entries(c).map(([k,v])=>`${resourceIcon(k)} ${fmt(v)}`).join(' · ')}
function hasCost(c){return Object.entries(c).every(([k,v])=>(state.resources[k]||0)>=v)}
function spend(c){for(const [k,v] of Object.entries(c))state.resources[k]-=v}
function log(msg){state.log.unshift(`[${new Date().toLocaleTimeString()}] ${msg}`);state.log=state.log.slice(0,80)}
function totalArmy(){return Object.values(state.army).reduce((a,b)=>a+b,0)}
function armyPower(){return Object.entries(state.army).reduce((p,[k,n])=>p+(UNITS[k]?.atk||8)*n*1.6+(UNITS[k]?.def||8)*n,0)}
function income(){let b=state.buildings;return {food:70+35*(b.farm||0),wood:60+32*(b.lumber||0),stone:40+30*(b.quarry||0),iron:18+24*(b.iron||0),oil:8*(b.oil||0),mana:2*(b.mana||0),gold:6};}
function tick(hours=1){const inc=income();const upkeep=Object.entries(state.army).reduce((s,[k,n])=>s+(UNITS[k]?.upkeep||0)*n,s=0);inc.food-=upkeep;inc.mana+=state.portal?.modifier==='wild'?.5:0;for(const [k,v] of Object.entries(inc))state.resources[k]=Math.min(state.cap[k],Math.max(0,state.resources[k]+v*hours));state.population=Math.min(state.popCap,state.population+(state.buildings.house||0)*2*hours);if(state.wounded>0)state.wounded=Math.max(0,state.wounded-Math.floor((2+(state.buildings.hospital||0))*hours));save();render()}
function buildingLevel(k){return state.buildings[k]||0}
function build(k){const b=BUILDINGS[k];if(!b||!hasCost(b.cost))return toast('Not enough resources.');spend(b.cost);state.buildings[k]=(state.buildings[k]||0)+1;if(k==='house')state.popCap+=50;if(k==='warehouse'){for(const r of Object.keys(state.cap))state.cap[r]+=k==='warehouse'?2500:0}log(`Built ${b.name} Lv.${state.buildings[k]}.`);save();render()}
function train(k,n=1){const u=UNITS[k];if(!u||(state.buildings[u.building]||0)<1)return toast('You need the required military building.');const total={};for(const [r,v] of Object.entries(u.cost))total[r]=v*n;if(!hasCost(total))return toast('Not enough resources.');if(state.population+totalArmy()+n>state.popCap)return toast('Population capacity reached.');spend(total);state.army[k]=(state.army[k]||0)+n;state.population+=n;log(`Trained ${n} ${u.name}${n===1?'':'s'}.`);save();render()}
function retreatLoss(loss=.08){for(const k of Object.keys(state.army)){const n=Math.floor(state.army[k]*loss);state.army[k]-=n;state.wounded+=Math.floor(n*.55);}}
function portalOpen(){if(state.portal)return;state.portal={name:'The Shattered Realm',tier:2,modifier:'wild',start:Date.now(),territories:MAP.map(x=>x.owner),kills:0,rewards:0};MAP.forEach((m,i)=>m.owner=i===0?'player':i<10?'enemy':'locked');log('A portal has opened: The Shattered Realm.');save();render()}
function adjacent(id){const t=MAP[id];return MAP.filter(m=>m.owner==='player').some(p=>Math.abs(p.x-t.x)+Math.abs(p.y-t.y)<=1)}
function attackTerritory(id){const t=MAP[id];if(!state.portal||t.owner!=='enemy'||!adjacent(id))return toast('That territory is not currently accessible.');const p=armyPower();const ratio=p/Math.max(1,t.strength);let loss=ratio>=1.35?.06:ratio>=1?.14:ratio>=.75?.28:.55;if(state.portal.modifier==='wild'&&Math.random()<.22){const swing=Math.random()<.5?1.3:.7;ratio*=swing;loss*=swing;log(`Wild Mana destabilized the battlefield (${swing>1?'surge':'disruption'}).`)}const survives=Math.max(0,Math.floor(totalArmy()*Math.max(.25,1-loss)));retreatLoss(1-survives/Math.max(1,totalArmy()));if(ratio>=1){t.owner='player';state.portal.territories[id]='player';state.portal.kills+=Math.floor(t.strength*.7);state.portal.rewards+=t.reward;state.resources.gold+=t.reward;unlockNeighbors();log(`Conquered ${t.name}. Losses were ${Math.floor(loss*100)}%.`);if(t.id===14)completePortal()}else{retreatLoss(.12);log(`Attack on ${t.name} failed. The army withdrew with heavy losses.`)}save();render()}
function unlockNeighbors(){MAP.forEach(t=>{if(t.owner==='locked'&&adjacent(t.id))t.owner='enemy';})}
function completePortal(){if(!state.portal)return;state.resources.mana+=80+state.portal.tier*40;state.resources.gold+=1200+state.portal.tier*700;log('Portal conquered! Expedition rewards granted.');state.portal.completed=true}
function resetPortal(){state.portal=null;MAP.forEach((m,i)=>m.owner=i===0?'player':i<10?'enemy':'locked');save();render()}
function toast(msg){const d=document.createElement('div');d.textContent=msg;Object.assign(d.style,{position:'fixed',left:'50%',top:'18%',transform:'translate(-50%,-50%)',padding:'10px 15px',background:'#101821',border:'1px solid #49647d',borderRadius:'8px',zIndex:50,boxShadow:'0 10px 30px #0008'});document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}
function renderResources(){document.getElementById('resources').innerHTML=Object.entries(state.resources).map(([k,v])=>`<div class="res"><span>${resourceIcon(k)} ${k.toUpperCase()}</span><span>${fmt(v)} / ${fmt(state.cap[k])}</span></div>`).join('')}
function renderNav(){const nav=document.getElementById('nav');const items=[['settlement','Settlement'],['army','Army'],['portal','Portal Expedition']];nav.innerHTML=items.map(([id,label])=>`<button class="${state.screen===id?'active':''}" onclick="state.screen='${id}';render()">${label}</button>`).join('')}
function renderStats(){document.getElementById('stats').innerHTML=`<div class="row"><span>Population</span><b>${fmt(state.population)} / ${fmt(state.popCap)}</b></div><div class="row"><span>Army</span><b>${fmt(totalArmy())}</b></div><div class="row"><span>Army Power</span><b>${fmt(armyPower())}</b></div><div class="row"><span>Wounded</span><b>${fmt(state.wounded)}</b></div><div class="row"><span>Portal</span><b>${state.portal?.completed?'Cleared':' '+(state.portal?'Active':'None')}</b></div>`}
function renderSettlement(){const buildings=[...Object.keys(BUILDINGS)];return `<div class="hero"><div><h1>Settlement</h1><p>Build the economy that makes sustained warfare possible.</p></div><span class="tag">Demo Economy</span></div>${state.buildQueue?`<div class="notice">Building ${BUILDINGS[state.buildQueue.key].name}... <div class="meter progress"><i style="width:${Math.min(100,state.buildQueue.progress)}%"></i></div></div>`:''}<div class="grid cards">${buildings.map(k=>{const b=BUILDINGS[k],lv=buildingLevel(k);return `<div class="card"><h4>${b.name} <span class="pill">Lv ${lv}</span></h4><div class="desc">${b.desc}</div><div class="cost">${costText(b.cost)}</div><button ${hasCost(b.cost)?'':'disabled'} onclick="build('${k}')">Build Level ${lv+1}</button></div>`}).join('')}</div>`}
function renderArmy(){return `<div class="hero"><div><h1>Army</h1><p>Train a mixed force. The prototype uses simplified combat math, not a PhD thesis.</p></div><span class="tag">${fmt(totalArmy())} troops</span></div><div class="grid cards"><div class="card"><h4>Current Army</h4><div class="small">Power: ${fmt(armyPower())}</div>${Object.entries(state.army).map(([k,n])=>`<div class="unitrow"><span>${UNITS[k].name}</span><b>${fmt(n)}</b><span class="small">${UNITS[k].atk} ATK / ${UNITS[k].def} DEF</span></div>`).join('')}<div class="small" style="margin-top:7px">Wounded: ${fmt(state.wounded)}</div></div><div class="card"><h4>Train Units</h4>${Object.entries(UNITS).map(([k,u])=>`<div class="unitrow"><span><b>${u.name}</b><br><span class="small">${u.time}s · ${u.upkeep}/h</span></span><span class="small">${costText(u.cost)}</span><button ${hasCost(u.cost)?'':'disabled'} onclick="train('${k}',10)">+10</button></div>`).join('')}</div></div>`}
function renderPortal(){if(!state.portal)return `<div class="hero"><div><h1>Portal Expeditions</h1><p>Cooperative PvE campaigns in pocket dimensions. Conquer every territory for the full reward.</p></div><span class="tag">PvE</span></div><div class="portalHead"><h2>Portal Generator</h2><p>Open a Tier II test portal with 14 territories and a Wild Mana modifier.</p><button onclick="portalOpen()">Open Test Portal</button></div><div class="grid cards"><div class="card"><h4>How it works</h4><div class="desc">Conquer connected territories, capture resource bonuses, and reach the Rift Citadel. Battles consume troops and wounded units recover over time.</div></div><div class="card"><h4>Group play</h4><div class="desc">The demo uses one shared expedition state. A later multiplayer layer can let several players contribute armies to the same territory.</div></div></div>`;const conquered=MAP.filter(m=>m.owner==='player').length,total=MAP.length;return `<div class="hero"><div><h1>The Shattered Realm</h1><p>Tier ${state.portal.tier} · ${state.portal.modifier==='wild'?'Wild Mana':'Stable Magic'}</p></div><div><span class="tag">${conquered} / ${total} territories</span></div></div><div class="portalHead"><div class="row"><div><h2>${state.portal.completed?'Expedition Complete':'Conquer the Realm'}</h2><div class="small">Gold earned: ${fmt(state.portal.rewards)} · Battlefield events: ${fmt(state.portal.kills)}</div></div><button onclick="resetPortal()">Reset Portal</button></div></div><div class="map">${MAP.map(t=>{const can=state.portal&&!state.portal.completed&&t.owner==='enemy'&&adjacent(t.id);return `<button class="tile ${t.owner==='player'?'friendly':t.owner==='enemy'?'hostile':'locked'} ${t.owner==='player'&&t.id===0?'current':''}" ${can?'':'disabled'} onclick="attackTerritory(${t.id})"><div class="name">${t.name}</div><div class="owner">${t.owner==='player'?'Controlled':t.owner==='enemy'?'Enemy':'Locked'}</div><div class="strength">${t.strength?`Power ${fmt(t.strength)}`:'Expedition entry'}${t.reward?` · +${fmt(t.reward)}g`:''}</div></button>`}).join('')}</div><div style="margin-top:12px" class="notice"><b>Portal modifiers</b><br><span class="small">Wild Mana: battles have a 22% chance to surge or disrupt, changing combat swing and losses.</span></div>`}
function renderRight(){document.getElementById('rightPanel').innerHTML=`<h2>Production</h2>${Object.entries(income()).map(([k,v])=>`<div class="row"><span>${resourceIcon(k)} ${k}</span><b>${v>=0?'+':''}${v.toFixed(1)}/hr</b></div>`).join('')}<h2 style="margin-top:16px">Buildings</h2>${Object.entries(state.buildings).map(([k,v])=>`<div class="building"><b>${BUILDINGS[k]?.name||k} <span class="pill">Lv ${v}</span></b><span class="small">${BUILDINGS[k]?.desc||''}</span></div>`).join('')}<h2 style="margin-top:16px">Event Log</h2><div class="log">${state.log.map(x=>`<div>${x}</div>`).join('')}</div><div class="footerhint">Time passes automatically every few seconds in the demo. One click = one hour of game time in Debug.</div>`}
function renderDebug(){const d=document.getElementById('debugPanel');d.innerHTML=`<h3>Debug Console</h3><div class="small">Press <span class="kbd">`+'`'+`</span> to toggle.</div><div class="row"><label>Amount</label><input id="dbgAmount" value="1000" type="number"></div><div class="grid" style="grid-template-columns:1fr 1fr"><button onclick="dbgResources()">+ Resources</button><button onclick="dbgArmy()">+ Army</button><button onclick="dbgWinPortal()">Conquer Portal</button><button onclick="dbgDamage()">Simulate Losses</button><button onclick="tick(1)">Advance 1h</button><button onclick="tick(8)">Advance 8h</button><button onclick="portalOpen()">Spawn Portal</button><button onclick="dbgUnlock()">Unlock Buildings</button><button onclick="debugReset()">Reset Save</button></div><div class="notice warn" style="margin-top:10px">Debug changes are intentionally permanent in local save until Reset Save is pressed.</div>`}
function dbgResources(){const n=Number(document.getElementById('dbgAmount').value)||1000;for(const k of Object.keys(state.resources))state.resources[k]=Math.min(state.cap[k],state.resources[k]+n);save();render()}
function dbgArmy(){const n=Math.max(1,Number(document.getElementById('dbgAmount').value)||100);for(const k of Object.keys(UNITS))state.army[k]=(state.army[k]||0)+n;state.population+=n*Object.keys(UNITS).length;save();render()}
function dbgDamage(){const n=Math.min(.5,Math.max(.01,(Number(document.getElementById('dbgAmount').value)||1000)/10000));retreatLoss(n);log(`Debug: simulated ${Math.round(n*100)}% army losses.`);save();render()}
function dbgWinPortal(){if(!state.portal)portalOpen();MAP.forEach(t=>t.owner='player');state.portal.completed=true;state.resources.gold+=5000;state.resources.mana+=300;log('Debug: portal fully conquered.');save();render()}
function dbgUnlock(){for(const k of Object.keys(BUILDINGS))state.buildings[k]=Math.max(1,state.buildings[k]||0);state.popCap=100000;for(const k of Object.keys(state.cap))state.cap[k]=999999;save();render()}
function debugReset(){localStorage.removeItem('attrition-demo');state=clone(defaultState);MAP.forEach((m,i)=>m.owner=i===0?'player':i<10?'enemy':'locked');render()}
function render(){renderResources();renderNav();renderStats();document.getElementById('content').innerHTML=state.screen==='army'?renderArmy():state.screen==='portal'?renderPortal():renderSettlement();renderRight();renderDebug();}
document.getElementById('debugBtn').onclick=()=>document.getElementById('debugPanel').classList.toggle('open');document.addEventListener('keydown',e=>{if(e.key==='`')document.getElementById('debugPanel').classList.toggle('open')});
setInterval(()=>tick(.05),3000);
if(!state.log.length){log('Demo initialized. Build economy, train troops, or open a portal.');save()}
render();
</script>
</body>
</html>
