<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Attrition</title>
<style>
:root{--bg:#08100d;--glass:rgba(8,15,12,.78);--glass2:rgba(13,24,19,.94);--line:rgba(222,232,221,.18);--text:#f1f4ef;--muted:#a6b2a8;--gold:#efd477;--accent:#8fd4eb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;backdrop-filter:blur(10px)}
button:hover{border-color:rgba(239,212,119,.6);background:#1c3025}
button:active{transform:translateY(1px)}
#game{position:fixed;inset:0;background:#101b15}
#map-viewport{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#38533e 0,#263b2d 52%,#15231b 100%);cursor:grab}
#map-viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:2200px;height:2200px;transform-origin:0 0;user-select:none;will-change:transform}
#world-inner{position:absolute;left:0;top:0;width:2200px;height:2200px;transform-origin:0 0;filter:drop-shadow(0 34px 28px rgba(0,0,0,.38));transition:none}
.tile{cursor:pointer;transition:filter .2s}.tile polygon{stroke:rgba(20,32,23,.55);stroke-width:4;vector-effect:non-scaling-stroke}.tile:hover polygon{filter:brightness(1.12)}.tile.you polygon{fill:rgba(55,135,172,.72);stroke:#8fcfe8}.tile.north polygon{fill:rgba(154,83,77,.66);stroke:#db9c94}.tile.south polygon{fill:rgba(116,83,151,.66);stroke:#cdb5e4}.tile.neutral polygon{fill:rgba(113,124,88,.56);stroke:#aab49d}
.terrain{opacity:.62;pointer-events:none}.tree{fill:#33573d}.tree2{fill:#456e48}.field{stroke:#c4b86e;stroke-width:5;opacity:.5}.hill{fill:#677854}.road{fill:none;stroke:#9b8860;stroke-width:12;opacity:.72;stroke-linecap:round}.river{fill:none;stroke:#4c8ca0;stroke-width:18;opacity:.88;stroke-linecap:round}
.settlement{pointer-events:none}.building{fill:#bba57d}.roof{fill:#74413a}.fort{fill:#858981;stroke:#6d776d;stroke-width:4}.flag-you{fill:#8fd4eb}.flag-enemy{fill:#e29a8f}
.resource{font-size:19px;pointer-events:none}.army{font-weight:800;font-size:12px;fill:white;paint-order:stroke;stroke:#17211b;stroke-width:4}
.name{font-size:16px;font-weight:750;fill:#eef3ea;paint-order:stroke;stroke:#152018;stroke-width:4;pointer-events:none}.owner{font-size:10px;fill:#d8e0d6;paint-order:stroke;stroke:#152018;stroke-width:3;pointer-events:none}
.selected polygon{stroke:#f0d47a;stroke-width:8;filter:drop-shadow(0 8px 4px rgba(0,0,0,.42))}
#selection-pulse{fill:none;stroke:rgba(255,236,142,.62);stroke-width:4;opacity:0;pointer-events:none}
#selection-pulse.active{animation:pulse .85s ease-out 1}@keyframes pulse{0%{opacity:.9;r:34}100%{opacity:0;r:100}}
#radial{position:fixed;inset:0;z-index:40;pointer-events:none;display:none}.radial-line{position:absolute;left:0;top:0;height:2px;transform-origin:0 50%;background:rgba(239,212,119,.5);pointer-events:none}.radial-btn{pointer-events:auto;position:absolute;transform:translate(-50%,-50%) scale(.2);width:70px;height:70px;border-radius:50%;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:rgba(12,20,16,.96);border:2px solid rgba(221,228,214,.55);box-shadow:0 10px 30px rgba(0,0,0,.38);opacity:0;color:#f1f4ef;transition:transform .45s cubic-bezier(.15,.85,.25,1),opacity .28s,background .2s,border-color .2s}.radial-btn span:first-child{font-size:20px;color:var(--gold)}.radial-btn span:last-child{font-size:10px;font-weight:700}.radial-btn:hover{background:#263b30;border-color:var(--gold);transform:translate(-50%,-50%) scale(1.08)}#radial.open{display:block}.radial-btn.show{transform:translate(-50%,-50%) scale(1);opacity:1}
#topbar{position:absolute;z-index:20;left:16px;right:16px;top:14px;display:flex;align-items:flex-start;gap:10px;justify-content:space-between;pointer-events:none}.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 12px 32px rgba(0,0,0,.28);border-radius:12px}
#brand{pointer-events:auto;padding:9px 12px}.brand{font-weight:900;letter-spacing:.16em;font-size:18px}.sub{font-size:10px;color:var(--muted)}
#resources{pointer-events:auto;display:flex;gap:6px;max-width:65vw;overflow:auto}.res{min-width:82px;padding:7px 9px;display:flex;justify-content:space-between;gap:8px;font-size:12px}.res small{color:var(--muted)}
#top-actions{pointer-events:auto;display:flex;gap:6px}.icon{min-width:40px}
#selection{position:absolute;z-index:20;left:16px;bottom:16px;padding:11px 13px;min-width:220px}.selection-name{font-weight:800}.selection-meta{font-size:11px;color:var(--muted);margin-top:3px}
#panel{position:absolute;z-index:30;left:50%;bottom:16px;transform:translateX(-50%);width:min(440px,calc(100vw - 32px));padding:14px;background:var(--glass2);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.48);backdrop-filter:blur(16px);display:none}.panel-open{display:block}.panel-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.panel-head h3{margin:0}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:10px;padding:10px}.kv b{display:block}.kv small{color:var(--muted)}.panel-actions{display:flex;gap:7px;margin-top:10px}.panel-actions button{flex:1}
#toast{position:absolute;z-index:50;top:78px;left:50%;transform:translate(-50%,-8px);opacity:0;padding:9px 13px;border-radius:10px;background:rgba(10,17,13,.94);border:1px solid rgba(239,212,119,.35);transition:.2s;pointer-events:none}#toast.open{opacity:1;transform:translate(-50%,0)}#tooltip{position:fixed;z-index:100;max-width:min(340px,calc(100vw - 24px));padding:11px 12px;border:1px solid rgba(239,212,119,.3);border-radius:12px;background:rgba(8,15,12,.97);box-shadow:0 18px 50px rgba(0,0,0,.5);backdrop-filter:blur(16px);pointer-events:none;opacity:0;transform:translateY(5px);transition:opacity .12s,transform .12s;line-height:1.35}#tooltip.open{opacity:1;transform:translateY(0)}.tip-title{font-weight:850;font-size:13px}.tip-type{margin-top:2px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}.tip-desc{margin-top:7px;color:var(--text);font-size:12px}.tip-details{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.tip-details div+div{margin-top:3px}.tip-key{color:#dfe7dc}.has-tooltip{}
@media(max-width:700px){#resources{position:absolute;top:56px;left:0;max-width:100vw;right:0}.res{min-width:74px}.icon{min-width:36px;padding:8px}.glass{border-radius:10px}}
</style>
</head>
<body>
<div id="game">
<div id="map-viewport">
<div id="world"><div id="world-inner">
<svg id="svg" viewBox="0 0 2200 2200" width="2200" height="2200" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d9366"/><stop offset=".55" stop-color="#70855b"/><stop offset="1" stop-color="#647951"/></linearGradient></defs>
<rect id="map-ground" x="0" y="0" width="2200" height="2200" rx="90" fill="url(#ground)"/>
<g id="tiles"></g><g id="features"></g><g id="fx"></g><circle id="map-selection" cx="0" cy="0" r="1" fill="none"/>
</svg></div></div>
<div id="radial"></div>
</div>
<div id="topbar"><div id="brand" class="glass"><div class="brand">ATTRITION</div><div class="sub" id="clock">YEAR 1 · DAY 1 · 00:00</div></div><div id="resources"></div><div id="top-actions"><button class="icon glass icon" onclick="openPanel('settlement')">⌂</button><button class="icon glass icon" onclick="openPanel('army')">⚑</button><button class="icon glass icon" onclick="openPanel('portal')">◈</button><button class="icon glass icon" onclick="openPanel('log')">≡</button><button class="icon glass icon" title="Reload and clear cache" onclick="reloadAndClearCache()">↻</button><button class="icon glass icon" onclick="openPanel('settings')">⚙</button></div></div>
<div id="selection" class="glass"><div class="selection-name" id="sel-name">Territory 10</div><div class="selection-meta" id="sel-meta">You · Gold · Select a territory</div></div>
<div id="panel"></div><div id="toast"></div><div id="tooltip" aria-hidden="true"></div>
</div>
<script src="map-generator.js"></script>
<script src="map-data.js"></script>
<script src="simulation.js"></script>
<script>
const MAPDATA=window.AttritionMapData;
const SIM=window.AttritionSimulation;
let DATA=SIM.mapView();
let selected=Math.max(0,DATA.findIndex(t=>t.owner==='you'&&t.settlement==='capital'));
let drag={active:false,sx:0,sy:0,cx:0,cz:0,moved:false};
const HALF_DIAG=MAPDATA.world.tileSize/Math.sqrt(2);
const GRID_CENTER={x:MAPDATA.world.width/2,y:MAPDATA.world.height/2};
let camera={x:GRID_CENTER.x,y:1.85,z:GRID_CENTER.y},zoom=1,radialOpen=false,openKind=null,activeResource=null;
const ROAD_SET=new Set((MAPDATA.roadLinks||[]).map(link=>link.slice().sort((a,b)=>a-b).join(':')));
const ICON={Food:'🍞',Wood:'🪵',Stone:'🪨',Iron:'⚙️',Oil:'🛢️',Mana:'🔮',Gold:'🪙'};
const TOOLTIP={
  resource:{
    Food:{desc:'Keeps your population and armies supplied.',type:'Resource'},
    Wood:{desc:'Used for basic construction.',type:'Resource'},
    Stone:{desc:'Used for major buildings and fortifications.',type:'Resource'},
    Iron:{desc:'Used for advanced buildings and military equipment.',type:'Resource'},
    Oil:{desc:'Used for advanced military and logistics systems.',type:'Resource'},
    Mana:{desc:'Used for special units and effects.',type:'Resource'},
    Gold:{desc:'Used for trade, diplomacy, and flexible spending.',type:'Resource'}
  },
  terrain:{
    plain:'Normal movement and defense.',
    field:'Open terrain with standard movement.',
    forest:'Harder to move through and useful for concealment.',
    hill:'Slower movement and stronger defensive position.',
    coast:'A coastal territory. Ports can interact with water systems.'
  },
  action:{
    details:{type:'Action',desc:'Open the territory information panel.'},
    build:{type:'Action',desc:'Open construction for this controlled territory.'},
    scout:{type:'Action',desc:'Request information about an unknown or enemy territory. Reports arrive after a delay.'},
    attack:{type:'Action',desc:'Order a nearby friendly army to attack this territory.'},
    move:{type:'Action',desc:'Choose a neighboring territory for a friendly army to move into.'},
    army:{type:'Action',desc:'Open army orders, recruitment, morale, supplies, and unit composition.'},
    claim:{type:'Action',desc:'Take an adjacent neutral territory for yourself.'},
    relations:{type:'Action',desc:'View and change your relationship with the territory owner.'},
    view:{type:'Action',desc:'Keep the map as the active view.'}
  }
};
function gridPoint(t){
 const xOffset=(t.col-t.row-((MAPDATA.world.cols-MAPDATA.world.rows)/2))*HALF_DIAG;
 const yOffset=(t.col+t.row-((MAPDATA.world.cols+MAPDATA.world.rows-2)/2))*HALF_DIAG;
 return{x:GRID_CENTER.x+xOffset,y:GRID_CENTER.y+yOffset};
}
function roadKey(a,b){return[a,b].sort((x,y)=>x-y).join(':')}
function roadExists(a,b){return ROAD_SET.has(roadKey(a,b))}
function renderMapFeatures(){
 const g=document.getElementById('features');
 if(!g)return;
 const paths=(MAPDATA.rivers||[]).map(points=>'<polyline class="river" points="'+points.map(p=>p.join(',')).join(' ')+'"/>').join('');
 g.innerHTML=paths;
}
function polygon(t){const p=gridPoint(t),d=HALF_DIAG;return[[p.x,p.y-d],[p.x+d,p.y],[p.x,p.y+d],[p.x-d,p.y]]}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function resourceLabel(k){return ICON[k]+' '+k}
function costText(cost){return Object.entries(cost||{}).map(([k,v])=>resourceLabel(k)+' '+v).join(' · ')}
function tipHtml(title,type,desc,details=[]){
 return '<div class="tip-title">'+esc(title)+'</div>'+
  (type?'<div class="tip-type">'+esc(type)+'</div>':'')+
  (desc?'<div class="tip-desc">'+esc(desc)+'</div>':'')+
  (details.length?'<div class="tip-details">'+details.map(x=>'<div>'+x+'</div>').join('')+'</div>':'');
}
let tipTarget=null,tipTimer=null;
function showTooltip(el,x,y){
 const tip=document.getElementById('tooltip');if(!tip)return;
 const data=el._tooltipData;if(!data)return;
 clearTimeout(tipTimer);tipTimer=setTimeout(()=>{
  tip.innerHTML=tipHtml(data.title,data.type,data.desc,data.details||[]);
  tip.classList.add('open');tip.setAttribute('aria-hidden','false');positionTooltip(x,y);
 },220);
}
function positionTooltip(x,y){
 const tip=document.getElementById('tooltip');if(!tip||!tip.classList.contains('open'))return;
 const pad=12,gap=14,rect=tip.getBoundingClientRect();
 let left=x+gap,top=y+gap;
 if(left+rect.width>window.innerWidth-pad)left=x-rect.width-gap;
 if(top+rect.height>window.innerHeight-pad)top=y-rect.height-gap;
 tip.style.left=Math.max(pad,left)+'px';tip.style.top=Math.max(pad,top)+'px';
}
function hideTooltip(){
 clearTimeout(tipTimer);tipTarget=null;
 const tip=document.getElementById('tooltip');
 if(tip){tip.classList.remove('open');tip.setAttribute('aria-hidden','true')}
}
function setTooltip(el,data){
 if(!el)return;
 el._tooltipData=data;el.classList.add('has-tooltip');
 if(el._tooltipBound)return;
 el._tooltipBound=true;
 el.addEventListener('pointerenter',e=>{tipTarget=el;showTooltip(el,e.clientX,e.clientY)});
 el.addEventListener('pointermove',e=>{if(tipTarget===el)positionTooltip(e.clientX,e.clientY)});
 el.addEventListener('pointerleave',hideTooltip);
 el.addEventListener('pointerdown',hideTooltip);
}

function makeSvg(){
 const g=document.getElementById('tiles');
 g.innerHTML=DATA.map((t,i)=>{
   const p=polygon(t),pts=p.map(x=>x.join(',')).join(' '),cc=gridPoint(t),fort=t.buildings&&t.buildings.Fort?1:0;
   return '<g class="tile '+esc(t.owner)+(t.status==='battle'?' battle-tile':'')+'" data-i="'+i+'" onclick="selectTile('+i+')" data-tooltip="'+i+'">'+
    '<defs><clipPath id="clip-'+i+'"><polygon points="'+pts+'"/></clipPath></defs><polygon points="'+pts+'"/>'+
    '<g clip-path="url(#clip-'+i+')" class="terrain">'+roadSvg(t,cc)+terrainSvg(t,cc)+'</g>'+
    '<g clip-path="url(#clip-'+i+')" class="settlement">'+settlementSvg(t,cc,fort)+'</g>'+
    '<text class="name" text-anchor="middle" x="'+cc.x+'" y="'+(cc.y-92)+'">'+esc(t.name)+'</text>'+
    '<text class="owner" text-anchor="middle" x="'+cc.x+'" y="'+(cc.y-74)+'">'+(t.owner==='you'?'YOU':t.owner.toUpperCase())+' · '+t.resource+'</text>'+
    (t.army?'<text class="army" text-anchor="middle" x="'+cc.x+'" y="'+(cc.y+105)+'">⚑ '+Number(t.army).toLocaleString()+'</text>':'')+
    '<text class="resource" text-anchor="middle" x="'+cc.x+'" y="'+(cc.y+60)+'">'+ICON[t.resource]+'</text></g>';
 }).join('');
 document.querySelectorAll('.tile[data-tooltip]').forEach(el=>{
   const t=DATA[Number(el.getAttribute('data-tooltip'))];
   if(!t)return;
   const income=SIM.getIncome(),localYield=(income[t.resource]||0);
   const visible=SIM.getVisibleArmy(t.id);
   const army=visible&&visible.hidden?'Army: unknown':visible&&visible.units?'Army: '+Object.values(visible.units).reduce((a,b)=>a+b,0).toLocaleString()+' units':'Army: none';
   setTooltip(el,{title:t.name,type:'Territory · '+(t.owner==='you'?'Controlled':t.owner==='neutral'?'Neutral':'Enemy'),
     desc:'A territory produces resources, houses population, and can contain buildings and armies.',
     details:[
       '<span class="tip-key">Owner:</span> '+esc(t.owner==='you'?'You':t.owner),
       '<span class="tip-key">Terrain:</span> '+esc(t.terrain)+' · '+esc(TOOLTIP.terrain[t.terrain]||''),
       '<span class="tip-key">Resource:</span> '+esc(t.resource)+' · +'+Math.round(localYield)+'/h',
       '<span class="tip-key">Population:</span> '+Math.round(t.population),
       '<span class="tip-key">Buildings:</span> '+Object.values(t.buildings||{}).reduce((a,b)=>a+b,0),
       '<span class="tip-key">'+army+'</span>'
     ]});
 });
}
function roadSvg(t,c){
 const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
 return dirs.map(([dc,dr])=>{
   const n=DATA.find(x=>x.col===t.col+dc&&x.row===t.row+dr);
   if(!n||!roadExists(t.id,n.id))return '';
   const p=gridPoint(n);
   return '<line class="road" x1="'+c.x+'" y1="'+c.y+'" x2="'+p.x+'" y2="'+p.y+'"/>';
 }).join('');
}
function terrainSvg(t,c){
 if(t.terrain==='forest')return Array.from({length:8},(_,i)=>'<circle class="tree" cx="'+(c.x-78+(i%4)*52)+'" cy="'+(c.y+8+Math.floor(i/4)*48)+'" r="'+(15+(i%3)*2)+'"/>').join('');
 if(t.terrain==='field')return Array.from({length:6},(_,i)=>'<path class="field" d="M'+(c.x-88)+' '+(c.y-34+i*27)+' L'+(c.x+88)+' '+(c.y-12+i*27)+'"/>').join('');
 if(t.terrain==='hill')return '<ellipse class="hill" cx="'+(c.x-24)+'" cy="'+(c.y+8)+'" rx="62" ry="31"/><ellipse class="hill" cx="'+(c.x+48)+'" cy="'+(c.y+34)+'" rx="55" ry="28"/>';
 if(t.terrain==='coast')return '<path d="M'+(c.x-90)+' '+(c.y+42)+' Q'+c.x+' '+(c.y-18)+' '+(c.x+92)+' '+(c.y+42)+'" fill="none" stroke="#4c8ca0" stroke-width="16" opacity=".8"/>';
 return '<ellipse cx="'+c.x+'" cy="'+(c.y+25)+'" rx="82" ry="38" fill="rgba(80,103,83,.22)"/>';
}
function settlementSvg(t,c,fort){
 if(!t.settlement)return '';
 if(t.settlement==='ruins')return '<rect x="'+(c.x-34)+'" y="'+(c.y+30)+'" width="68" height="34" class="fort"/>';
 let out='<rect x="'+(c.x-30)+'" y="'+(c.y+18)+'" width="60" height="35" class="building"/><path class="roof" d="M'+(c.x-38)+' '+(c.y+18)+' L'+c.x+' '+(c.y-10)+' L'+(c.x+38)+' '+(c.y+18)+'Z"/>';
 if(fort||t.settlement==='fort'||t.settlement==='capital')out+='<rect x="'+(c.x-56)+'" y="'+(c.y+8)+'" width="18" height="54" class="fort"/><rect x="'+(c.x+38)+'" y="'+(c.y+8)+'" width="18" height="54" class="fort"/>';
 if(t.settlement==='capital')out+='<rect x="'+(c.x-3)+'" y="'+(c.y-48)+'" width="6" height="38" class="flag-you"/>';
 if(t.settlement==='village')out+='<rect x="'+(c.x-70)+'" y="'+(c.y+27)+'" width="22" height="22" class="building"/><path class="roof" d="M'+(c.x-75)+' '+(c.y+27)+' L'+(c.x-59)+' '+(c.y+12)+' L'+(c.x-43)+' '+(c.y+27)+'Z"/><rect x="'+(c.x+48)+'" y="'+(c.y+31)+'" width="22" height="20" class="building"/>';
 return out;
}
function renderResources(){
 const s=SIM.getState(),income=SIM.getIncome();
 document.getElementById('resources').innerHTML=Object.keys(SIM.RESOURCE_INFO).map(k=>{
  const cap=SIM.RESOURCE_INFO[k].cap,v=Math.floor(s.resources[k]||0);
  return '<button class="res glass" onclick="openResource(\''+k+'\')"><span>'+ICON[k]+'</span><b>'+v.toLocaleString()+'</b><small>/'+cap.toLocaleString()+'</small></button>';
 }).join('');
 const buttons=document.querySelectorAll('#resources .res');
 buttons.forEach((el,i)=>{
   const k=Object.keys(SIM.RESOURCE_INFO)[i],s=SIM.getState(),income=SIM.getIncome();
   setTooltip(el,{title:k,type:TOOLTIP.resource[k].type,desc:TOOLTIP.resource[k].desc,details:[
     '<span class="tip-key">Stored:</span> '+Math.floor(s.resources[k]).toLocaleString()+' / '+SIM.RESOURCE_INFO[k].cap.toLocaleString(),
     '<span class="tip-key">Production:</span> +'+Math.round(income[k]||0)+'/h',
     ...(k==='Food'?['<span class="tip-key">Upkeep:</span> -'+Math.round(SIM.getFoodUpkeep())+'/h']:[])
   ]});
 });
}
function refreshGame(){
 DATA=SIM.mapView();renderResources();makeSvg();updateSelection();
 document.getElementById('clock').textContent=SIM.formatTime()+' · SEASON '+SIM.getState().season.number;
 if(openKind)openPanel(openKind);if(radialOpen)buildRadial();
}
function selectTile(i){selected=i;closePanel();radialOpen=true;updateSelection();pulse();buildRadial()}
function decorateTopActions(){
 const defs=[
  ['⌂','Settlement','Interface','Open settlement development and construction.'],
  ['⚑','Army','Interface','Open your armies and issue military orders.'],
  ['◈','Portal','Interface','Open or manage a temporary PvE portal.'],
  ['≡','Log','Interface','Review recent simulation events.'],
  ['↻','Reload','Utility','Reload the game and clear the site browser cache.'],
  ['⚙','Settings','Interface','Simulation controls and map settings.']
 ];
 [...document.querySelectorAll('#top-actions .icon')].forEach((el,i)=>{const d=defs[i];if(d)setTooltip(el,{title:d[1],type:d[2],desc:d[3]})});
}
function updateSelection(){
 const t=DATA[selected];if(!t)return;
 document.querySelectorAll('.tile.selected').forEach(e=>e.classList.remove('selected'));
 const el=document.querySelector('.tile[data-i="'+selected+'"]');if(el)el.classList.add('selected');
 document.getElementById('sel-name').textContent=t.name;
 document.getElementById('sel-meta').textContent=(t.owner==='you'?'You':t.owner==='neutral'?'Neutral':t.owner)+' · '+t.resource+(t.construction&&t.construction.length?' · Building':'');
}
function buildRadial(){
 const r=document.getElementById('radial');
 const tile=document.querySelector('.tile[data-i="'+selected+'"]');
 if(!r||!tile)return;
 r.classList.add('open');
 r.innerHTML='';
 const actions=actionsFor(DATA[selected]);
 actions.forEach(a=>{
   const b=document.createElement('button');
   b.className='radial-btn';
   b.innerHTML='<span>'+a.glyph+'</span><span>'+a.label+'</span>';
   b.type='button';
   setTooltip(b,{title:a.label,type:TOOLTIP.action[a.id]?.type||'Action',desc:TOOLTIP.action[a.id]?.desc||'Perform this action.'});
   b.onpointerdown=e=>{e.preventDefault();e.stopPropagation()};
   b.onclick=e=>{e.preventDefault();e.stopPropagation();doAction(a.id)};
   r.appendChild(b);
 });
 const bb=tile.getBoundingClientRect();
 const cx=bb.left+bb.width/2;
 const cy=bb.top+bb.height/2;
 const radius=Math.min(180,Math.max(120,Math.min(window.innerWidth,window.innerHeight)*.16));
 const buttons=[...r.querySelectorAll('.radial-btn')];
 const lines=[];
 buttons.forEach((b,i)=>{
   const angle=-Math.PI/2+i*(Math.PI*2/buttons.length);
   const x=cx+Math.cos(angle)*radius;
   const y=cy+Math.sin(angle)*radius;
   b.style.left=Math.round(x)+'px';
   b.style.top=Math.round(y)+'px';
   requestAnimationFrame(()=>b.classList.add('show'));
   const line=document.createElement('div');
   line.className='radial-line';
   line.style.left=Math.round(cx)+'px';
   line.style.top=Math.round(cy)+'px';
   line.style.width=Math.round(radius)+'px';
   line.style.transform='rotate('+(angle*180/Math.PI)+'deg)';
   r.appendChild(line);
   lines.push(line);
 });
}
function actionsFor(t){
 const enemy=!['you','neutral'].includes(t.owner);
 return[{id:'details',label:'Details',glyph:'i'},{id:t.owner==='you'?'build':'scout',label:t.owner==='you'?'Build':'Scout',glyph:t.owner==='you'?'+':'◎'},{id:enemy?'attack':'move',label:enemy?'Attack':'Move',glyph:enemy?'⚔':'↗'},{id:t.owner==='you'?'army':'claim',label:t.owner==='you'?'Army':'Claim',glyph:t.owner==='you'?'⚑':'◆'},{id:'relations',label:'Relations',glyph:'◌'},{id:'view',label:'View',glyph:'◉'}];
}
function doAction(id){
 if(id==='view'){toast('Map view');return}
 if(id==='claim'){const r=SIM.claim(selected);toast(r.message);if(r.ok)refreshGame();return}
 if(id==='scout'){const r=SIM.scout(selected);toast(r.message);refreshGame();return}
 if(id==='attack'){const r=SIM.attack(selected);toast(r.message);if(r.ok)refreshGame();return}
 if(id==='build'){openPanel('settlement');return}
 if(id==='move'||id==='army'){openPanel('army');return}
 if(id==='details'){openPanel('details');return}
 if(id==='relations'){openPanel('relations');return}
}
function pulse(){const p=document.getElementById('map-selection'),c=gridPoint(DATA[selected]);p.setAttribute('cx',c.x);p.setAttribute('cy',c.y);p.classList.remove('active');void p.offsetWidth;p.classList.add('active')}
function decoratePanelTooltips(kind){
 const p=document.getElementById('panel');if(!p)return;
 const labels={
  'Local resource':'The primary resource found in this territory.',
  'Settlement':'The settlement currently occupying this territory.',
  'Population':'Residents available for growth, work, and recruitment.',
  'Army information':'Army details depend on what information you currently have.',
  'Buildings':'Total buildings currently operating in this territory.',
  'Fort levels':'Fortification strength that improves defense.',
  'Morale':'Willingness of an army to keep fighting. Low morale reduces effective power.',
  'Supplies':'Operational supplies used by the army. Low supplies hurt morale and efficiency.',
  'Construction':'Buildings in this territory that are currently being built.',
  'Relation':'Your current relationship with this faction.',
  'Cost to improve':'Gold required to improve relations.',
  'Resource':'What this territory produces.',
  'Economy':'Stored amount, production rate, upkeep, and storage capacity.'
 };
 p.querySelectorAll('.kv').forEach(el=>{
  const label=el.querySelector('small')?.textContent?.trim()||'Information';
  const value=el.querySelector('b')?.textContent?.trim()||'';
  let desc=labels[label]||'A game value that describes the current state of this system.';
  if(label==='Construction')desc='Queued buildings consume resources immediately and finish after their build time.';
  if(kind==='settlement'&&value.match(/×/))desc='A completed building. Hover the value to inspect what this building changes.';
  if(kind==='army'&&label&&['Militia','Riflemen','FireMage','AntiTank'].includes(label))desc='A unit type in this army. Unit types differ in cost, power, speed, upkeep, and element.';
  setTooltip(el,{title:label,type:'State',desc,details:value?['<span class="tip-key">Current:</span> '+esc(value)]:[]});
 });
 p.querySelectorAll('.panel-actions button').forEach(el=>{
  const text=el.textContent.replace(/\s+/g,' ').trim();
  let desc='Perform this action on the current selection.';
  if(/Advance 1 hour/i.test(text))desc='Advance the simulation by one game hour for testing.';
  else if(/Move to/i.test(text))desc='Order the selected army to move to a neighboring territory.';
  else if(/\+\d+ (Militia|Riflemen|Fire Mages)/i.test(text))desc='Recruit units using population and the listed resources.';
  else if(/Improve/i.test(text))desc='Spend Gold to improve relations with the selected faction.';
  else if(/Build|Farm|Mill|Quarry|Mine|Oil|Mana|Market|Barracks|Workshop|Fort/i.test(text))desc='Queue this building. Resources are spent now and construction finishes over time.';
  else if(/Attack/i.test(text))desc='Commit a friendly army to a PvE attack in the selected portal territory.';
  setTooltip(el,{title:text,type:'Action',desc});
 });
}
function closePanel(){document.getElementById('panel').classList.remove('panel-open');openKind=null;radialOpen=false;document.getElementById('radial').classList.remove('open')}
function openPanel(kind){
 const t=DATA[selected],p=document.getElementById('panel');openKind=kind;let html='';
 if(kind==='details'){
  const visible=SIM.getVisibleArmy(t.id);let armyText='None';
  if(visible&&visible.hidden)armyText='Unknown · Scout required';else if(visible)armyText=Number(Object.values(visible.units||{}).reduce((a,b)=>a+b,0)).toLocaleString()+' units';
  html='<div class="panel-head"><div><h3>'+esc(t.name)+'</h3><div class="muted">'+resourceLabel(t.resource)+' · '+esc(t.owner)+'</div></div><button onclick="closePanel()">×</button></div><div class="grid">'+
   '<div class="kv"><b>'+resourceLabel(t.resource)+'</b><small>Local resource</small></div><div class="kv"><b>'+(t.settlement||'None')+'</b><small>Settlement</small></div>'+
   '<div class="kv"><b>'+Math.round(t.population)+'</b><small>Population</small></div><div class="kv"><b>'+armyText+'</b><small>Army information</small></div>'+
   '<div class="kv"><b>'+Object.values(t.buildings||{}).reduce((a,b)=>a+b,0)+'</b><small>Buildings</small></div><div class="kv"><b>'+(t.buildings?.Fort||0)+'</b><small>Fort levels</small></div></div>';
 } else if(kind==='settlement'){
  if(t.owner!=='you')html='<div class="panel-head"><div><h3>Settlement</h3><div class="muted">Only controlled territories can be developed.</div></div><button onclick="closePanel()">×</button></div>';
  else{
   const b=t.buildings||{},queue=(t.construction||[]).map(x=>x.building+' ('+x.remaining+'h)').join(', ')||'Empty';
   const rows=Object.entries(b).filter(([,n])=>n>0).map(([k,n])=>'<div class="kv"><b>'+esc(k)+' × '+n+'</b><small>'+esc(SIM.BUILDINGS[k]?.desc||'')+'</small></div>').join('');
   const options=Object.entries(SIM.BUILDINGS).map(([k,d])=>'<button onclick="buildAt(\''+k+'\')">'+esc(k)+'<br><small>'+costText(d.cost)+' · '+d.time+'h</small></button>').join('');
   html='<div class="panel-head"><div><h3>'+esc(t.name)+'</h3><div class="muted">'+Math.round(t.population)+' population · '+(t.construction.length?'construction active':'ready')+'</div></div><button onclick="closePanel()">×</button></div><div class="grid">'+rows+'</div><div class="kv" style="margin-top:8px"><b>Construction</b><small>'+esc(queue)+'</small></div><div class="panel-actions" style="flex-wrap:wrap">'+options+'</div>';
  }
 } else if(kind==='army'){
  const armies=SIM.getPlayerArmies(),current=armies.find(a=>a.territoryId===t.id);let body='';
  if(current){
   body='<div class="grid"><div class="kv"><b>'+Math.round(current.morale)+'</b><small>Morale</small></div><div class="kv"><b>'+Math.round(current.supplies)+'</b><small>Supplies</small></div>'+
    Object.entries(current.units).map(([k,v])=>'<div class="kv"><b>'+Number(v).toLocaleString()+'</b><small>'+esc(k)+'</small></div>').join('')+'</div>';
   body+='<div class="panel-actions">';SIM.getNeighbors(current.territoryId).filter(n=>n.owner==='you'||n.owner==='neutral').forEach(n=>body+='<button onclick="moveSelectedArmy(\''+current.id+'\','+n.id+')">Move to '+n.name.replace('Territory ','')+'</button>');body+='</div>';
   body+='<div class="panel-actions"><button onclick="recruitSelected(\'Militia\',10)">+10 Militia</button><button onclick="recruitSelected(\'Riflemen\',10)">+10 Riflemen</button><button onclick="recruitSelected(\'FireMage\',5)">+5 Fire Mages</button></div>';
  } else body='<div class="kv"><b>No army here</b><small>Select a territory with a friendly army to issue movement or recruitment orders.</small></div>';
  const list=armies.map(a=>{const at=DATA.find(x=>x.id===a.territoryId);return '<div class="kv" style="margin-top:6px"><b>'+esc(at?at.name:'Unknown')+'</b><small>'+Number(Object.values(a.units).reduce((x,y)=>x+y,0)).toLocaleString()+' units · '+Math.round(a.morale)+' morale</small></div>'}).join('');
  html='<div class="panel-head"><div><h3>Army</h3><div class="muted">Military orders resolve over time.</div></div><button onclick="closePanel()">×</button></div>'+body+'<div style="margin-top:10px" class="muted">Your armies</div>'+list;
 } else if(kind==='relations'){
  const faction=t.owner,relation=SIM.getState().relations[faction]??0;
  html='<div class="panel-head"><div><h3>Relations</h3><div class="muted">'+esc(faction)+' relationship</div></div><button onclick="closePanel()">×</button></div><div class="grid"><div class="kv"><b>'+relation+'</b><small>Relation</small></div><div class="kv"><b>20 Gold</b><small>Cost to improve</small></div></div><div class="panel-actions"><button onclick="changeRelation(5)">Improve +5</button><button onclick="changeRelation(-5)">Lower -5</button></div>';
 } else if(kind==='portal'){
  const pz=SIM.getPortal();
  if(!pz)html='<div class="panel-head"><div><h3>Portal</h3><div class="muted">Temporary PvE world</div></div><button onclick="closePanel()">×</button></div><div class="kv"><b>No open portal</b><small>Open one to create a temporary enemy territory network.</small></div><div class="panel-actions"><button onclick="openPortal()">Open Portal</button></div>';
  else html='<div class="panel-head"><div><h3>Portal</h3><div class="muted">'+pz.defeated+' cleared · '+(pz.territories.length-1-pz.defeated)+' remaining</div></div><button onclick="closePanel()">×</button></div>'+pz.territories.map((n,i)=>'<div class="kv" style="margin-top:6px"><b>'+esc(n.name)+' · '+(n.owner==='you'?'Cleared':'Enemy')+'</b><small>'+((n.army&&n.army.units)?'Enemy power '+Math.round(Object.values(n.army.units).reduce((a,b)=>a+b,0)):'Cleared')+'</small>'+(n.owner!=='you'?'<button style="margin-top:6px" onclick="portalAttack(\''+pz.id+'\','+i+')">Attack</button>':'')+'</div>').join('');
 } else if(kind==='log'){
  html='<div class="panel-head"><div><h3>Log</h3><div class="muted">World events</div></div><button onclick="closePanel()">×</button></div>'+SIM.getState().events.slice(0,10).map(e=>'<div class="kv" style="margin-top:6px"><b>Tick '+e.tick+'</b><small>'+esc(e.text)+'</small></div>').join('');
 } else if(kind==='resource'){ const k=activeResource||'Food'; const s=SIM.getState(); const income=SIM.getIncome(); const upkeep=k==='Food'?SIM.getFoodUpkeep():0; html='<div class="panel-head"><div><h3>'+resourceLabel(k)+'</h3><div class="muted">Economy</div></div><button onclick="closePanel()">×</button></div><div class="grid"><div class="kv"><b>'+Math.floor(s.resources[k]).toLocaleString()+'</b><small>Stored</small></div><div class="kv"><b>+'+Math.round(income[k]||0)+'/h</b><small>Production</small></div>'+(k==='Food'?'<div class="kv"><b>-'+Math.round(upkeep)+'/h</b><small>Population + army upkeep</small></div>':'')+'<div class="kv"><b>'+SIM.RESOURCE_INFO[k].cap.toLocaleString()+'</b><small>Storage cap</small></div></div>'; } else if(kind==='settings'){
  html='<div class="panel-head"><div><h3>Settings</h3><div class="muted">Simulation controls</div></div><button onclick="closePanel()">×</button></div><div class="panel-actions"><button onclick="advanceHour()">Advance 1 hour</button><button onclick="resetSeason()">Reset state</button></div><div class="kv" style="margin-top:8px"><b>20 real seconds = 1 game hour</b><small>Production, movement, combat, construction, morale, and information updates happen each tick.</small></div>';
 }
 p.innerHTML=html;decoratePanelTooltips(kind);p.classList.add('panel-open');radialOpen=false;document.getElementById('radial').classList.remove('open');
}
function buildAt(building){const r=SIM.queueBuilding(selected,building);toast(r.message);refreshGame()}
function moveSelectedArmy(armyId,targetId){const r=SIM.moveArmy(armyId,targetId);toast(r.message);refreshGame()}
function recruitSelected(unit,count){const r=SIM.recruit(selected,unit,count);toast(r.message);refreshGame()}
function changeRelation(amount){const t=DATA[selected];const r=SIM.improveRelation(t.owner,amount);toast(r.message);refreshGame()}
function openPortal(){const r=SIM.openPortal();toast(r.message);refreshGame()}

function newWorld(){
 const seed='world-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
 localStorage.setItem('attrition-map-seed',seed);
 location.replace(location.pathname+'?seed='+encodeURIComponent(seed));
}
function openResource(k){
 const s=SIM.getState(),income=SIM.getIncome(),upkeep=k==='Food'?SIM.getFoodUpkeep():0,p=document.getElementById('panel');activeResource=k;openKind='resource';
 p.innerHTML='<div class="panel-head"><div><h3>'+resourceLabel(k)+'</h3><div class="muted">Economy</div></div><button onclick="closePanel()">×</button></div><div class="grid"><div class="kv"><b>'+Math.floor(s.resources[k]).toLocaleString()+'</b><small>Stored</small></div><div class="kv"><b>+'+Math.round(income[k]||0)+'/h</b><small>Production</small></div>'+(k==='Food'?'<div class="kv"><b>-'+Math.round(upkeep)+'/h</b><small>Population + army upkeep</small></div>':'')+'<div class="kv"><b>'+SIM.RESOURCE_INFO[k].cap.toLocaleString()+'</b><small>Storage cap</small></div></div>';
 decoratePanelTooltips('resource');p.classList.add('panel-open');radialOpen=false;document.getElementById('radial').classList.remove('open');
}
function toast(s){const d=document.getElementById('toast');d.textContent=s;d.classList.add('open');clearTimeout(toast._t);toast._t=setTimeout(()=>d.classList.remove('open'),1800)}
function resetView(){camera.x=GRID_CENTER.x;camera.z=GRID_CENTER.y;zoom=1;applyView();if(radialOpen)buildRadial();toast('Map centered')}
function applyView(){
 const w=document.getElementById('world'),viewport=document.getElementById('map-viewport'),vw=viewport.clientWidth||window.innerWidth,vh=viewport.clientHeight||window.innerHeight,pitch=Math.cos(28*Math.PI/180);
 w.style.transform='matrix('+zoom+',0,0,'+(zoom*pitch)+','+(vw/2-zoom*camera.x)+','+(vh/2-zoom*pitch*camera.z)+')';
}
function tileFromPoint(clientX,clientY){const el=document.elementFromPoint(clientX,clientY),tile=el&&el.closest?el.closest('.tile'):null;return tile?Number(tile.getAttribute('data-i')):null}
function handleMapPointerDown(e){if(e.button!==0||(e.target.closest&&e.target.closest('.radial-btn')))return;drag={active:true,sx:e.clientX,sy:e.clientY,cx:camera.x,cz:camera.z,moved:false};document.getElementById('map-viewport').classList.add('dragging')}
function handleMapPointerMove(e){if(!drag.active)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.hypot(dx,dy)>5)drag.moved=true;const pitch=Math.cos(28*Math.PI/180);camera.x=drag.cx-dx/zoom;camera.z=drag.cz-dy/(zoom*pitch);applyView();if(radialOpen)buildRadial()}
function handleMapPointerUp(e){if(!drag.active)return;const moved=drag.moved;drag.active=false;document.getElementById('map-viewport').classList.remove('dragging');if(!moved){const hit=tileFromPoint(e.clientX,e.clientY);if(hit!==null)selectTile(hit)}}
function handleMapPointerCancel(){drag.active=false;document.getElementById('map-viewport').classList.remove('dragging')}
const vp=document.getElementById('map-viewport');
vp.addEventListener('pointerdown',handleMapPointerDown);vp.addEventListener('pointermove',handleMapPointerMove);vp.addEventListener('pointerup',handleMapPointerUp);vp.addEventListener('pointercancel',handleMapPointerCancel);
vp.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.72,Math.min(1.35,zoom*(e.deltaY<0?1.08:.93)));applyView();if(radialOpen)buildRadial()},{passive:false});
window.addEventListener('resize',()=>{applyView();if(radialOpen)buildRadial()});
document.addEventListener('pointerover',e=>{
  const el=e.target.closest&&e.target.closest('[data-tip-static]');
  if(!el||el.classList.contains('has-tooltip'))return;
  try{setTooltip(el,JSON.parse(el.getAttribute('data-tip-static')))}catch(_){}
});
renderMapFeatures();makeSvg();renderResources();decorateTopActions();updateSelection();applyView();
setInterval(()=>{SIM.tick();refreshGame()},20000);
