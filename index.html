<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attrition Prototype</title>
<style>
:root{--bg:#0b1117;--p:#141d27;--p2:#1a2631;--line:#2b3b4a;--text:#edf2f7;--muted:#9eafbe;--accent:#72b8ff;--good:#72d49b;--bad:#ea8585;--gold:#e4c16a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#14202b,#0b1117 60%);color:var(--text);font:14px system-ui,sans-serif}button{background:#21303f;color:inherit;border:1px solid #3a5062;border-radius:7px;padding:8px 11px;cursor:pointer}button:hover{background:#2b4052}button:disabled{opacity:.45;cursor:not-allowed}.top{display:flex;gap:16px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#101821;position:sticky;top:0;z-index:5}.brand{font-size:20px;font-weight:900;letter-spacing:.08em}.sub,.small{color:var(--muted);font-size:12px}.resources{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}.res{background:var(--p);border:1px solid var(--line);border-radius:7px;padding:5px 8px}.res b{font-size:12px}.layout{display:grid;grid-template-columns:220px minmax(520px,1fr) 300px;min-height:calc(100vh - 64px)}aside{padding:12px;background:#111922}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}main{padding:14px}.nav button{display:block;width:100%;text-align:left;margin-bottom:6px}.nav .active{border-color:var(--accent);background:#1d3447}.card{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:10px}.grid{display:grid;gap:10px}.cards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.hero{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}.hero h1{margin:0 0 4px;font-size:26px}.tag{border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);white-space:nowrap}.cost{color:var(--gold);font-size:12px;margin:8px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.building,.unit{padding:8px;background:var(--p2);border:1px solid var(--line);border-radius:7px;margin:6px 0}.map{display:grid;grid-template-columns:repeat(5,minmax(90px,1fr));gap:7px;max-width:800px}.tile{min-height:96px;text-align:left;background:#18222c;border:1px solid #3a4d5d;border-radius:8px;padding:8px;position:relative}.tile.friendly{background:#17271f;border-color:#3c6b4b}.tile.enemy{background:#2a1a1e;border-color:#6b4249}.tile.locked{opacity:.45}.tile .name{font-weight:700;font-size:12px}.tile .kind{font-size:10px;color:var(--muted)}.tile .power{position:absolute;left:8px;bottom:8px;font-size:10px}.log{font:11px ui-monospace,monospace;background:#0a0f14;border:1px solid var(--line);border-radius:7px;padding:7px;max-height:170px;overflow:auto}.debug{position:fixed;right:14px;bottom:14px;background:#0a1017;border:1px solid #57718a;border-radius:9px;padding:11px;width:330px;z-index:20;display:none;box-shadow:0 15px 40px #0008}.debug.open{display:block}.debug input{width:90px;background:#111923;border:1px solid var(--line);color:inherit;padding:5px;border-radius:5px}.pill{font-size:10px;background:#253441;padding:3px 5px;border-radius:4px;color:var(--muted)}.notice{padding:9px;background:#18232d;border:1px solid var(--line);border-radius:7px;margin:9px 0}.notice.good{border-color:#37624a}.notice.warn{border-color:#67562f}@media(max-width:1050px){.layout{grid-template-columns:190px 1fr}.right{display:none}}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.resources{margin-left:0}.layout{display:block}.left{display:none}.map{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">ATTRITION</div><div class="sub">Playable strategy prototype</div></div><div id="resources" class="resources"></div><button onclick="toggleDebug()">Debug `</button></header>
<div class="layout"><aside class="left"><div class="nav" id="nav"></div><div class="card"><b>Quick Stats</b><div id="stats" class="small" style="margin-top:8px"></div></div><div class="small">Autosaves locally in this browser. The prototype is intentionally lightweight so mechanics can be changed fast.</div></aside><main id="main"></main><aside class="right" id="right"></aside></div>
<div id="debug" class="debug"></div>
<script>
const B={
 town:['Town Center',{wood:500,stone:300},'Administration and settlement progression.'],house:['House',{wood:120},'Adds 50 population capacity.'],farm:['Farm',{wood:150},'Produces Food.'],lumber:['Lumber Mill',{wood:220,stone:40},'Produces Wood.'],quarry:['Quarry',{wood:180,stone:80},'Produces Stone.'],iron:['Iron Mine',{wood:260,stone:120},'Produces Iron.'],oil:['Oil Well',{wood:500,stone:250,iron:150},'Produces Oil for industry.'],mana:['Mana Crystal Mine',{wood:600,stone:350,iron:200},'Produces rare Mana Crystals.'],warehouse:['Warehouse',{wood:280,stone:100},'Raises storage capacity.'],market:['Market',{wood:400,stone:160},'Enables future trading and diplomacy.'],barracks:['Barracks',{wood:350,stone:120,iron:50},'Trains infantry.'],range:['Archery Range',{wood:420,stone:80,iron:40},'Trains ranged units.'],stable:['Stable',{wood:550,stone:150,iron:100},'Trains cavalry and improves mobility.'],workshop:['Workshop',{wood:650,stone:300,iron:180},'Builds siege and later vehicles.'],hospital:['Hospital',{wood:500,stone:350,iron:120},'Improves wounded recovery.'],wall:['Wall',{wood:300,stone:700},'Absorbs siege damage and buys time.'],tower:['Watchtower',{wood:250,stone:450},'Improves warning and intelligence.'],rally:['Rally Point',{wood:380,stone:220,iron:60},'Improves reinforcement and coordination.'],command:['Command Center',{wood:700,stone:500,iron:300},'Increases command capacity.'],refinery:['Refinery',{wood:700,stone:500,iron:500,oil:150},'Processes Oil for advanced systems.'],reactor:['Mana Reactor',{wood:800,stone:500,iron:250,mana:50},'Converts Mana Crystals into magical energy.'],academy:['Arcane Academy',{wood:900,stone:700,iron:300,mana:100},'Unlocks battlefield magic later.']};
const U={
 militia:['Militia','barracks',{food:15,wood:5},.5,8,7],spearman:['Spearman','barracks',{food:25,wood:15},1,12,14],swordsman:['Swordsman','barracks',{food:50,wood:30,iron:10},2,24,24],archer:['Archer','range',{food:20,wood:20},1,18,6],crossbow:['Crossbowman','range',{food:40,wood:35,iron:15},2,32,8],cavalry:['Cavalry','stable',{food:70,wood:20,iron:25},3,35,18]};
const map=[
{id:0,n:'Portal Landing',k:'base',o:'p',s:0,x:0,y:0,r:0},{id:1,n:'Fallen Hamlet',k:'village',o:'e',s:1800,x:1,y:0,r:400},{id:2,n:'Iron Hills',k:'iron',o:'e',s:3200,x:2,y:0,r:650},{id:3,n:'Bleak Forest',k:'wood',o:'e',s:2800,x:0,y:1,r:600},{id:4,n:'Crossroads',k:'fort',o:'e',s:4200,x:1,y:1,r:800},{id:5,n:'Mana Marsh',k:'mana',o:'e',s:4500,x:2,y:1,r:1000},{id:6,n:'Old Quarry',k:'stone',o:'e',s:3800,x:3,y:0,r:700},{id:7,n:'Ashen Camp',k:'camp',o:'e',s:5200,x:3,y:1,r:900},{id:8,n:'Crumbling Gate',k:'fort',o:'e',s:6800,x:4,y:1,r:1200},{id:9,n:'Warden Keep',k:'boss',o:'e',s:9500,x:4,y:0,r:2500},{id:10,n:'Hidden Shrine',k:'magic',o:'l',s:5200,x:0,y:2,r:1200},{id:11,n:'Blackstone Mine',k:'iron',o:'l',s:5000,x:1,y:2,r:1100},{id:12,n:'Sunken Road',k:'road',o:'l',s:4700,x:2,y:2,r:900},{id:13,n:'War Engine Yard',k:'oil',o:'l',s:7200,x:3,y:2,r:1500},{id:14,n:'Rift Citadel',k:'boss',o:'l',s:12000,x:4,y:2,r:4000}];
const D={res:{food:5000,wood:3500,stone:2200,iron:900,oil:200,mana:80,gold:800},cap:{food:10000,wood:10000,stone:8000,iron:5000,oil:2000,mana:500,gold:3000},pop:420,pcap:500,b:{town:1,farm:3,lumber:2,quarry:1,iron:1,warehouse:1,barracks:1,range:1},army:{militia:120,spearman:80,swordsman:30,archer:70,crossbow:20,cavalry:10},wounded:40,screen:'settlement',portal:null,log:[]};
let S=load();let debugOpen=false;
function c(o){return JSON.parse(JSON.stringify(o))}function load(){try{let x=JSON.parse(localStorage.getItem('attrition-demo'));return x?Object.assign(c(D),x):c(D)}catch(e){return c(D)}}function save(){localStorage.setItem('attrition-demo',JSON.stringify(S))}function f(n){return Math.floor(n).toLocaleString()}function icon(k){return {food:'🍞',wood:'🪵',stone:'🪨',iron:'⚙️',oil:'🛢️',mana:'🔮',gold:'🪙'}[k]||''}function cost(t){return Object.entries(t).map(([k,v])=>icon(k)+' '+f(v)).join(' · ')}function can(t){return Object.entries(t).every(([k,v])=>(S.res[k]||0)>=v)}function spend(t){Object.entries(t).forEach(([k,v])=>S.res[k]-=v)}function armySize(){return Object.values(S.army).reduce((a,b)=>a+b,0)}function power(){return Object.entries(S.army).reduce((p,[k,n])=>p+n*((U[k]?.[4]||8)*1.6+(U[k]?.[5]||8)),0)}function income(){let b=S.b;return{food:70+35*(b.farm||0),wood:60+32*(b.lumber||0),stone:40+30*(b.quarry||0),iron:18+24*(b.iron||0),oil:8*(b.oil||0),mana:2*(b.mana||0),gold:6}}function log(x){S.log.unshift(x);S.log=S.log.slice(0,60)}
function advance(h=.05){let inc=income();let upkeep=Object.entries(S.army).reduce((a,[k,n])=>a+n*(U[k]?.[3]||0),0);inc.food-=upkeep;inc.mana+=(S.portal&&S.portal.wild)?0.5:0;Object.entries(inc).forEach(([k,v])=>S.res[k]=Math.min(S.cap[k],Math.max(0,S.res[k]+v*h)));if(S.wounded>0)S.wounded=Math.max(0,S.wounded-(2+(S.b.hospital||0))*h);save();render()}
function build(k){let b=B[k];if(!can(b[1]))return note('Not enough resources.');spend(b[1]);S.b[k]=(S.b[k]||0)+1;if(k==='house')S.pcap+=50;if(k==='warehouse')Object.keys(S.cap).forEach(r=>S.cap[r]+=2500);log('Built '+b[0]+' Lv.'+S.b[k]);save();render()}
function train(k,n=10){let u=U[k];if((S.b[u[1]]||0)<1)return note('Build '+B[u[1]][0]+' first.');let t={};Object.entries(u[2]).forEach(([r,v])=>t[r]=v*n);if(!can(t))return note('Not enough resources.');if(S.pop+n>Infinity&&false)return;spend(t);S.army[k]=(S.army[k]||0)+n;S.pop+=n;log('Trained '+n+' '+u[0]);save();render()}
function adjacent(t){return map.filter(m=>m.o==='p').some(p=>Math.abs(p.x-t.x)+Math.abs(p.y-t.y)<=1)}
function openPortal(){if(S.portal)return;S.portal={tier:2,wild:true,reward:0,complete:false};map.forEach((m,i)=>m.o=i===0?'p':i<10?'e':'l');log('A portal opened: The Shattered Realm.');save();S.screen='portal';render()}
function unlock(){map.forEach(m=>{if(m.o==='l'&&adjacent(m))m.o='e'})}
function attack(id){let t=map[id];if(!S.portal||S.portal.complete||t.o!=='e'||!adjacent(t))return note('That territory is not accessible.');let ratio=power()/Math.max(1,t.s);if(S.portal.wild&&Math.random()<.22){ratio*=Math.random()<.5?1.3:.7;log('Wild Mana distorted the battle.')}let loss=ratio>=1.35?.06:ratio>=1?.14:ratio>=.75?.28:.5;let before=armySize();Object.keys(S.army).forEach(k=>S.army[k]=Math.max(0,Math.floor(S.army[k]*(1-loss))));S.wounded+=Math.floor(before*loss*.55);if(ratio>=1){t.o='p';S.res.gold+=t.r;S.portal.reward+=t.r;log('Conquered '+t.n+'; losses '+Math.round(loss*100)+'%.');unlock();if(id===14){S.portal.complete=true;S.res.mana+=200;S.res.gold+=5000;log('The Rift Citadel fell. Expedition complete!')}}else{Object.keys(S.army).forEach(k=>S.army[k]=Math.max(0,Math.floor(S.army[k]*.88)));log('Attack failed at '+t.n+'. Army withdrew.')}save();render()}
function note(x){let d=document.createElement('div');d.textContent=x;Object.assign(d.style,{position:'fixed',top:'18%',left:'50%',transform:'translateX(-50%)',padding:'10px 15px',background:'#101821',border:'1px solid #537087',borderRadius:'8px',zIndex:50});document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}
function toggleDebug(){debugOpen=!debugOpen;renderDebug()}function renderDebug(){let d=document.getElementById('debug');d.className='debug'+(debugOpen?' open':'');d.innerHTML='<b>Debug Console</b><div class="small">Press <b>`</b> to toggle.</div><div style="margin:8px 0">Amount <input id="amt" type="number" value="1000"></div><div class="grid" style="grid-template-columns:1fr 1fr"><button onclick="dbgRes()">+ Resources</button><button onclick="dbgArmy()">+ Army</button><button onclick="dbgUnlock()">Unlock Buildings</button><button onclick="dbgPortal()">Finish Portal</button><button onclick="dbgLoss()">Simulate 20% Loss</button><button onclick="advance(1)">Advance 1h</button><button onclick="advance(8)">Advance 8h</button><button onclick="reset()">Reset Save</button></div>'}
function n(){return Math.max(1,Number(document.getElementById('amt')?.value)||1000)}function dbgRes(){let x=n();Object.keys(S.res).forEach(k=>S.res[k]=Math.min(S.cap[k],S.res[k]+x));save();render()}function dbgArmy(){let x=n();Object.keys(U).forEach(k=>S.army[k]=(S.army[k]||0)+x);save();render()}function dbgUnlock(){Object.keys(B).forEach(k=>S.b[k]=Math.max(1,S.b[k]||0));S.pcap=999999;Object.keys(S.cap).forEach(k=>S.cap[k]=999999);save();render()}function dbgPortal(){if(!S.portal)openPortal();map.forEach(m=>m.o='p');S.portal.complete=true;S.res.gold+=5000;S.res.mana+=500;log('Debug: portal completed.');save();render()}function dbgLoss(){Object.keys(S.army).forEach(k=>S.army[k]=Math.floor(S.army[k]*.8));S.wounded+=Math.floor(armySize()*.1);log('Debug: 20% army loss simulated.');save();render()}function reset(){localStorage.removeItem('attrition-demo');S=c(D);map.forEach((m,i)=>m.o=i===0?'p':i<10?'e':'l');save();render()}
function render(){document.getElementById('resources').innerHTML=Object.entries(S.res).map(([k,v])=>`<div class="res"><span class="small">${icon(k)} ${k}</span> <b>${f(v)}</b><span class="small"> / ${f(S.cap[k])}</span></div>`).join('');document.getElementById('nav').innerHTML=[['settlement','Settlement'],['army','Army'],['portal','Portal Expedition']].map(([k,v])=>`<button class="${S.screen===k?'active':''}" onclick="S.screen='${k}';render()">${v}</button>`).join('');document.getElementById('stats').innerHTML=`Population: ${f(S.pop)} / ${f(S.pcap)}<br>Army: ${f(armySize())}<br>Power: ${f(power())}<br>Wounded: ${f(S.wounded)}<br>Portal: ${S.portal?(S.portal.complete?'Complete':'Active'):'None'}`;document.getElementById('main').innerHTML=S.screen==='army'?armyView():S.screen==='portal'?portalView():settlementView();document.getElementById('right').innerHTML=`<h3>Production</h3>${Object.entries(income()).map(([k,v])=>`<div class="row"><span>${icon(k)} ${k}</span><b>${v>=0?'+':''}${v.toFixed(1)}/hr</b></div>`).join('')}<h3 style="margin-top:18px">Buildings</h3>${Object.entries(S.b).map(([k,v])=>`<div class="building"><b>${B[k]?.[0]||k} <span class="pill">Lv ${v}</span></b><div class="small">${B[k]?.[2]||''}</div></div>`).join('')}<h3>Event Log</h3><div class="log">${S.log.map(x=>`<div>${x}</div>`).join('')}</div>`;renderDebug()}
function settlementView(){return `<div class="hero"><div><h1>Settlement</h1><div class="sub">Build infrastructure, sustain an army, and prepare for the next war.</div></div><span class="tag">7 Resources</span></div><div class="grid cards">${Object.keys(B).map(k=>{let b=B[k];return `<div class="card"><b>${b[0]}</b> <span class="pill">Lv ${S.b[k]||0}</span><div class="small" style="margin-top:4px">${b[2]}</div><div class="cost">${cost(b[1])}</div><button ${can(b[1])?'':'disabled'} onclick="build('${k}')">Build</button></div>`}).join('')}</div>`}
function armyView(){return `<div class="hero"><div><h1>Army</h1><div class="sub">A mixed force is more useful than one gigantic stack of the same unfortunate man.</div></div><span class="tag">${f(armySize())} troops</span></div><div class="grid cards"><div class="card"><b>Current Forces</b>${Object.entries(S.army).map(([k,n])=>`<div class="unit"><div class="row"><b>${U[k][0]}</b><span>${f(n)}</span></div><div class="small">${U[k][4]} ATK · ${U[k][5]} DEF · ${U[k][3]}/hr upkeep</div></div>`).join('')}<div class="small">Wounded: ${f(S.wounded)}</div></div><div class="card"><b>Train</b>${Object.entries(U).map(([k,u])=>`<div class="unit"><div class="row"><b>${u[0]}</b><button onclick="train('${k}',10)">+10</button></div><div class="small">${cost(u[2])} · ${u[3]}/hr upkeep</div></div>`).join('')}</div></div>`}
function portalView(){if(!S.portal)return `<div class="hero"><div><h1>Portal Expeditions</h1><div class="sub">Temporary pocket-dimension campaigns against bot armies.</div></div><span class="tag">Co-op PvE prototype</span></div><div class="card"><h2>The Shattered Realm</h2><div class="small">Tier II · 15 territories · Wild Mana modifier</div><p>Conquer connected territories, capture the Rift Citadel, and collect rewards. The shared-state version here is ready to become multiplayer later.</p><button onclick="openPortal()">Open Test Portal</button></div>`;let owned=map.filter(m=>m.o==='p').length;return `<div class="hero"><div><h1>The Shattered Realm</h1><div class="sub">Tier II · ${S.portal.complete?'Expedition complete':'Conquer the pocket dimension'}</div></div><span class="tag">${owned} / ${map.length}</span></div><div class="notice"><b>Wild Mana:</b> 22% of battles can be unpredictably amplified or disrupted.</div><div class="map">${map.map(t=>{let canAtk=t.o==='e'&&adjacent(t)&&!S.portal.complete;return `<button class="tile ${t.o==='p'?'friendly':t.o==='e'?'enemy':'locked'}" ${canAtk?'':'disabled'} onclick="attack(${t.id})"><div class="name">${t.n}</div><div class="kind">${t.k}</div><div class="power">${t.s?('Power '+f(t.s)): 'Entry'}${t.r?' · '+f(t.r)+'g':''}</div></button>`}).join('')}</div><div class="notice"><b>Campaign rule:</b> only territories connected to your current land can be attacked. This creates a simple supply-line foundation for the full PvE system.</div>`}
document.addEventListener('keydown',e=>{if(e.key==='`')toggleDebug()});setInterval(()=>advance(),3000);if(!S.log.length){log('Prototype initialized. Build, train, or open a portal.');save()}render();
</script>
</body></html>
