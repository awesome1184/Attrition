<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attrition</title>
<style>
:root{--bg:#091017;--p:#121b24;--p2:#18242e;--line:#2a3c4b;--text:#edf3f7;--muted:#95a7b6;--accent:#70b9ef;--good:#65c58c;--bad:#dc7777;--gold:#e1bf67;--you:#285878;--enemy:#5b353b;--neutral:#334149}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172935,#091017 65%);color:var(--text);font:14px system-ui,sans-serif}button{font:inherit;color:inherit;background:#20303d;border:1px solid #3b5263;border-radius:7px;padding:8px 11px;cursor:pointer}button:hover{background:#29404f}button:disabled{opacity:.45;cursor:not-allowed}.top{display:flex;align-items:center;gap:16px;padding:11px 14px;background:#0e171f;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{font-weight:900;letter-spacing:.09em;font-size:21px}.sub,.small{color:var(--muted);font-size:12px}.clock{margin-left:auto;background:var(--p);border:1px solid var(--line);border-radius:8px;padding:7px 10px}.resources{display:flex;gap:6px;flex-wrap:wrap}.res{background:var(--p);border:1px solid var(--line);border-radius:7px;padding:5px 8px}.res b{display:block}.layout{display:grid;grid-template-columns:210px minmax(520px,1fr) 300px;min-height:calc(100vh - 110px)}aside,main{padding:13px}aside{background:#101820}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.nav button{display:block;width:100%;text-align:left;margin-bottom:6px}.nav .active{background:#1f394d;border-color:var(--accent)}.card{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:10px}.grid{display:grid;gap:10px}.cards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.hero h1{margin:0 0 4px;font-size:27px}.tag{border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted)}.cost{color:var(--gold);font-size:12px;margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.building,.unit{padding:8px;background:var(--p2);border:1px solid var(--line);border-radius:7px;margin:6px 0}.notice{padding:9px;background:#17232d;border:1px solid var(--line);border-radius:8px;margin:10px 0}.map{display:grid;grid-template-columns:repeat(8,minmax(70px,1fr));gap:5px;background:#0c141b;padding:8px;border:1px solid var(--line);border-radius:10px}.prov{min-height:86px;text-align:left;padding:7px;background:var(--neutral);border:1px solid #465966;border-radius:7px;position:relative}.prov.you{background:var(--you);border-color:#4b86aa}.prov.enemy{background:var(--enemy);border-color:#784b53}.prov.selected{outline:2px solid var(--accent)}.prov .name{font-weight:750;font-size:11px}.prov .owner{font-size:9px;color:#c7d1d9;margin-top:2px}.prov .resource{font-size:9px;margin-top:8px;color:#d2dde4}.prov .garrison{position:absolute;left:7px;bottom:6px;font-size:9px;color:#d2dde4}.log{font:11px ui-monospace,monospace;background:#091017;border:1px solid var(--line);border-radius:7px;padding:7px;max-height:180px;overflow:auto}.debug{position:fixed;right:14px;bottom:14px;width:340px;background:#0b1218;border:1px solid #5b7891;border-radius:9px;padding:11px;display:none;z-index:30;box-shadow:0 15px 45px #0009}.debug.open{display:block}.debug input{width:90px;background:#101a22;border:1px solid var(--line);color:inherit;border-radius:5px;padding:5px}.pill{font-size:10px;background:#263641;padding:3px 6px;border-radius:4px;color:var(--muted)}@media(max-width:1050px){.layout{grid-template-columns:185px 1fr}.right{display:none}.map{grid-template-columns:repeat(6,1fr)}}@media(max-width:700px){.layout{display:block}.left{display:none}.top{align-items:flex-start;flex-wrap:wrap}.clock{margin-left:0}.map{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">ATTRITION</div><div class="sub">Persistent strategy prototype</div></div><div id="clock" class="clock">Year 1 · Day 1 · 08:00 · next tick 10:00</div><button onclick="toggleDebug()">Debug `</button></header>
<div id="resources" class="resources" style="padding:8px 14px;background:#0c151d;border-bottom:1px solid var(--line)"></div>
<div class="layout"><aside class="left"><div class="nav" id="nav"></div><div class="card"><b>Realm</b><div id="stats" class="small" style="margin-top:8px"></div></div><div class="card"><b>Simulation</b><div class="small">1 tick = 10 game minutes. The browser processes one tick every 10 real minutes.</div></div></aside><main id="main"></main><aside class="right" id="right"></aside></div><div id="debug" class="debug"></div>
<script>
const B={town:['Town Center',{wood:500,stone:300},'Administrative core and progression.'],house:['House',{wood:120},'Adds 50 population capacity.'],farm:['Farm',{wood:150},'Produces Food.'],lumber:['Lumber Mill',{wood:220,stone:40},'Produces Wood.'],quarry:['Quarry',{wood:180,stone:80},'Produces Stone.'],iron:['Iron Mine',{wood:260,stone:120},'Produces Iron.'],oil:['Oil Well',{wood:500,stone:250,iron:150},'Produces Oil.'],mana:['Mana Crystal Mine',{wood:600,stone:350,iron:200},'Produces Mana Crystals.'],warehouse:['Warehouse',{wood:280,stone:100},'Raises storage capacity.'],market:['Market',{wood:400,stone:160},'Enables trading.'],barracks:['Barracks',{wood:350,stone:120,iron:50},'Trains infantry.'],range:['Archery Range',{wood:420,stone:80,iron:40},'Trains ranged units.'],stable:['Stable',{wood:550,stone:150,iron:100},'Trains cavalry.'],workshop:['Workshop',{wood:650,stone:300,iron:180},'Builds siege.'],hospital:['Hospital',{wood:500,stone:350,iron:120},'Improves wounded recovery.'],wall:['Wall',{wood:300,stone:700},'Absorbs siege damage.'],tower:['Watchtower',{wood:250,stone:450},'Improves intelligence.'],rally:['Rally Point',{wood:380,stone:220,iron:60},'Improves reinforcement speed.'],command:['Command Center',{wood:700,stone:500,iron:300},'Increases command capacity.'],refinery:['Refinery',{wood:700,stone:500,iron:500,oil:150},'Supports industrial warfare.'],reactor:['Mana Reactor',{wood:800,stone:500,iron:250,mana:50},'Converts crystals into magical energy.'],academy:['Arcane Academy',{wood:900,stone:700,iron:300,mana:100},'Unlocks battlefield magic.']};
const U={militia:['Militia','barracks',{food:15,wood:5},.5,8,7],spearman:['Spearman','barracks',{food:25,wood:15},1,12,14],swordsman:['Swordsman','barracks',{food:50,wood:30,iron:10},2,24,24],archer:['Archer','range',{food:20,wood:20},1,18,6],crossbow:['Crossbowman','range',{food:40,wood:35,iron:15},2,32,8],cavalry:['Cavalry','stable',{food:70,wood:20,iron:25},3,35,18]};
const PROVINCES=[['Frostmarch','north','Iron'],['White Pines','north','Wood'],['Highvale','north','Food'],['Stonewatch','north','Stone'],['Crown Pass','north','Iron'],['Red River','north','Food'],['Ash Coast','neutral','Oil'],['North Sea','neutral','Food'],['Green Fields','neutral','Food'],['King\'s Road','you','Gold'],['Silverwood','you','Wood'],['Ashen Plains','you','Iron'],['Ember Coast','you','Oil'],['Moonfall','south','Mana'],['Duskmoor','south','Mana'],['Violet Reach','south','Food'],['Blackfen','south','Stone'],['Starfall','south','Mana'],['Sun Coast','neutral','Food'],['Glass Desert','neutral','Oil'],['Old Empire','neutral','Iron'],['Crystal Vale','neutral','Mana'],['Stormlands','neutral','Oil'],['Deepwild','neutral','Wood']];
const P0=[{id:0,n:'Portal Landing',o:'player',s:0,x:0,y:0,r:0},{id:1,n:'Fallen Hamlet',o:'enemy',s:1800,x:1,y:0,r:400},{id:2,n:'Iron Hills',o:'enemy',s:3200,x:2,y:0,r:650},{id:3,n:'Bleak Forest',o:'enemy',s:2800,x:0,y:1,r:600},{id:4,n:'Crossroads',o:'enemy',s:4200,x:1,y:1,r:800},{id:5,n:'Mana Marsh',o:'enemy',s:4500,x:2,y:1,r:1000},{id:6,n:'Old Quarry',o:'enemy',s:3800,x:3,y:0,r:700},{id:7,n:'Ashen Camp',o:'enemy',s:5200,x:3,y:1,r:900},{id:8,n:'Crumbling Gate',o:'enemy',s:6800,x:4,y:1,r:1200},{id:9,n:'Warden Keep',o:'enemy',s:9500,x:4,y:0,r:2500},{id:10,n:'Hidden Shrine',o:'locked',s:5200,x:0,y:2,r:1200},{id:11,n:'Blackstone Mine',o:'locked',s:5000,x:1,y:2,r:1100},{id:12,n:'Sunken Road',o:'locked',s:4700,x:2,y:2,r:900},{id:13,n:'War Engine Yard',o:'locked',s:7200,x:3,y:2,r:1500},{id:14,n:'Rift Citadel',o:'locked',s:12000,x:4,y:2,r:4000}];
const D={res:{food:5000,wood:3500,stone:2200,iron:900,oil:200,mana:80,gold:800},cap:{food:10000,wood:10000,stone:8000,iron:5000,oil:2000,mana:500,gold:3000},pop:420,pcap:500,buildings:{town:1,farm:3,lumber:2,quarry:1,iron:1,warehouse:1,barracks:1,range:1},army:{militia:120,spearman:80,swordsman:30,archer:70,crossbow:20,cavalry:10},wounded:40,screen:'settlement',worldTick:0,selectedProvince:9,portal:null,log:[]};let state=load();let debugOpen=false;let lastTick=Date.now();
function clone(o){return JSON.parse(JSON.stringify(o))}function load(){try{const x=JSON.parse(localStorage.getItem('attrition-demo'));return x?Object.assign(clone(D),x):clone(D)}catch{return clone(D)}}function save(){localStorage.setItem('attrition-demo',JSON.stringify(state))}function fmt(n){return Math.floor(n).toLocaleString()}function icon(k){return{food:'🍞',wood:'🪵',stone:'🪨',iron:'⚙️',oil:'🛢️',mana:'🔮',gold:'🪙'}[k]||''}function cost(c){return Object.entries(c).map(([k,v])=>`${icon(k)} ${fmt(v)}`).join(' · ')}function has(c){return Object.entries(c).every(([k,v])=>(state.res[k]||0)>=v)}function spend(c){for(const[k,v]of Object.entries(c))state.res[k]-=v}function armySize(){return Object.values(state.army).reduce((a,b)=>a+b,0)}function power(){return Object.entries(state.army).reduce((p,[k,n])=>p+n*((U[k]?.[4]||8)*1.6+(U[k]?.[5]||8)),0)}function income(){const b=state.buildings;return{food:70+35*(b.farm||0)-Object.entries(state.army).reduce((s,[k,n])=>s+(U[k]?.[3]||0)*n,0),wood:60+32*(b.lumber||0),stone:40+30*(b.quarry||0),iron:18+24*(b.iron||0),oil:8*(b.oil||0),mana:2*(b.mana||0)+(state.portal?.modifier==='wild'?.5:0),gold:6}}
function tick(){const inc=income();for(const[k,v]of Object.entries(inc))state.res[k]=Math.min(state.cap[k],Math.max(0,state.res[k]+v/6));if(state.buildings.house)state.pop=Math.min(state.pcap,state.pop+state.buildings.house/6);if(state.wounded>0)state.wounded=Math.max(0,state.wounded-(2+(state.buildings.hospital||0))/6);state.worldTick++;lastTick=Date.now();save();render()}
function build(k){const b=B[k];if(!has(b[1]))return toast('Not enough resources.');spend(b[1]);state.buildings[k]=(state.buildings[k]||0)+1;if(k==='house')state.pcap+=50;if(k==='warehouse')Object.keys(state.cap).forEach(r=>state.cap[r]+=2500);log(`Built ${b[0]} Lv.${state.buildings[k]}.`);save();render()}
function train(k,n=10){const u=U[k];if(!state.buildings[u[1]])return toast('Build the required military structure first.');const c={};Object.entries(u[2]).forEach(([r,v])=>c[r]=v*n);if(!has(c))return toast('Not enough resources.');if(state.pop+n>state.pcap)return toast('Population capacity reached.');spend(c);state.army[k]=(state.army[k]||0)+n;state.pop+=n;log(`Trained ${n} ${u[0]}${n===1?'':'s'}.`);save();render()}
function adjacentWorld(i){const cols=8,r=Math.floor(i/cols),c=i%cols;return PROVINCES.some((p,j)=>j!==i&&p[1]==='you'&&Math.abs(Math.floor(j/cols)-r)+Math.abs((j%cols)-c)<=1)}function claimWorld(i){const p=PROVINCES[i];if(p[1]==='you')return;if(p[1]!=='neutral')return toast('That province is controlled by a major faction.');if(!adjacentWorld(i))return toast('Province is not adjacent to your realm.');p[1]='you';state.guildClaims=(state.guildClaims||3)+1;log(`Claimed ${p[0]}.`);save();render()}
function portalOpen(){if(state.portal)return;state.portal={tier:2,modifier:'wild',reward:0,complete:false};P0.forEach((m,i)=>m.o=i===0?'player':i<10?'enemy':'locked');state.screen='portal';log('The Shattered Realm opened.');save();render()}function portalAdjacent(t){return P0.some(p=>p.o==='player'&&Math.abs(p.x-t.x)+Math.abs(p.y-t.y)<=1)}function unlockPortal(){P0.forEach(t=>{if(t.o==='locked'&&portalAdjacent(t))t.o='enemy'})}function attackPortal(id){const t=P0[id];if(!state.portal||state.portal.complete||t.o!=='enemy'||!portalAdjacent(t))return toast('That territory is not accessible.');let ratio=power()/Math.max(1,t.s);if(state.portal.modifier==='wild'&&Math.random()<.22){const m=Math.random()<.5?1.3:.7;ratio*=m;log(`Wild Mana caused a ${m>1?'surge':'disruption'}.`)}const loss=ratio>=1.35?.06:ratio>=1?.14:ratio>=.75?.28:.5;const before=armySize();Object.keys(state.army).forEach(k=>state.army[k]=Math.max(0,Math.floor(state.army[k]*(1-loss))));state.wounded+=Math.floor(before*loss*.55);if(ratio>=1){t.o='player';state.res.gold+=t.r;state.portal.reward+=t.r;unlockPortal();log(`Conquered ${t.n}. Losses: ${Math.round(loss*100)}%.`);if(id===14){state.portal.complete=true;state.res.gold+=5000;state.res.mana+=200;log('Rift Citadel conquered. Expedition complete!')}}else log(`Attack failed at ${t.n}.`);save();render()}
function resetPortal(){state.portal=null;P0.forEach((m,i)=>m.o=i===0?'player':i<10?'enemy':'locked');save();render()}function selectProvince(i){state.selectedProvince=i;render()}function log(x){state.log.unshift(x);state.log=state.log.slice(0,60)}function toast(x){const d=document.createElement('div');d.textContent=x;Object.assign(d.style,{position:'fixed',left:'50%',top:'18%',transform:'translate(-50%,-50%)',padding:'10px 15px',background:'#101821',border:'1px solid #54718a',borderRadius:'8px',zIndex:50});document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}
function render(){document.getElementById('resources').innerHTML=Object.entries(state.res).map(([k,v])=>`<div class="res"><span class="small">${icon(k)} ${k.toUpperCase()}</span><b>${fmt(v)}</b><span class="small">/ ${fmt(state.cap[k])}</span></div>`).join('');document.getElementById('nav').innerHTML=[['settlement','Settlement'],['army','Army'],['world','World Map'],['portal','Portal PvE']].map(([k,v])=>`<button class="${state.screen===k?'active':''}" onclick="state.screen='${k}';render()">${v}</button>`).join('');document.getElementById('stats').innerHTML=`Population: ${fmt(state.pop)} / ${fmt(state.pcap)}<br>Army: ${fmt(armySize())}<br>Power: ${fmt(power())}<br>Wounded: ${fmt(state.wounded)}<br>World tick: ${fmt(state.worldTick)}`;document.getElementById('main').innerHTML=state.screen==='army'?armyView():state.screen==='world'?worldView():state.screen==='portal'?portalView():settlementView();const inc=income();document.getElementById('right').innerHTML=`<h3 style="margin-top:0">Production / hour</h3>${Object.entries(inc).map(([k,v])=>`<div class="row"><span>${icon(k)} ${k}</span><b>${v>=0?'+':''}${v.toFixed(1)}</b></div>`).join('')}<h3>Event Log</h3><div class="log">${state.log.map(x=>`<div>${x}</div>`).join('')}</div>`;renderDebug();renderClock()}
function settlementView(){return `<div class="hero"><div><h1>Settlement</h1><div class="sub">Develop the economy that sustains your armies.</div></div><span class="tag">7 resources</span></div><div class="grid cards">${Object.keys(B).map(k=>{const b=B[k],lv=state.buildings[k]||0;return `<div class="card"><b>${b[0]}</b> <span class="pill">Lv ${lv}</span><div class="small" style="margin-top:4px">${b[2]}</div><div class="cost">${cost(b[1])}</div><button ${has(b[1])?'':'disabled'} onclick="build('${k}')">Build Level ${lv+1}</button></div>`}).join('')}</div>`}function armyView(){return `<div class="hero"><div><h1>Army</h1><div class="sub">Train units, absorb losses, and prepare for campaigns.</div></div><span class="tag">${fmt(armySize())} troops</span></div><div class="grid cards"><div class="card"><h3 style="margin-top:0">Current Army</h3>${Object.entries(state.army).map(([k,n])=>`<div class="unit"><div class="row"><b>${U[k][0]}</b><span>${fmt(n)}</span></div><div class="small">${U[k][4]} ATK · ${U[k][5]} DEF · ${U[k][3]}/hr upkeep</div></div>`).join('')}</div><div class="card"><h3 style="margin-top:0">Train 10</h3>${Object.entries(U).map(([k,u])=>`<div class="unit"><div class="row"><b>${u[0]}</b><button onclick="train('${k}',10)">+10</button></div><div class="small">${cost(u[2])} · ${u[3]}/hr upkeep</div></div>`).join('')}</div></div>`}
function worldView(){return `<div class="hero"><div><h1>World Map</h1><div class="sub">Astraea · persistent territorial layer</div></div><span class="tag">${PROVINCES.length} provinces</span></div><div class="notice"><b>Your realm:</b> House of Ash. Click a province to inspect it. Neutral provinces connected to your borders can be claimed.</div><div class="map">${PROVINCES.map((p,i)=>{const g=p[1]==='neutral'?500+((i*137)%1200):p[1]==='you'?0:1800+((i*211)%2800);return `<button class="prov ${p[1]==='you'?'you':p[1]==='neutral'?'':'enemy'} ${state.selectedProvince===i?'selected':''}" onclick="selectProvince(${i})"><div class="name">${p[0]}</div><div class="owner">${p[1]==='you'?'House of Ash':p[1]==='north'?'Northland Dominion':p[1]==='south'?'Violet League':'Unclaimed'}</div><div class="resource">${icon(p[2].toLowerCase())} ${p[2]}</div><div class="garrison">${g?fmt(g)+' troops':'Your province'}</div></button>`}).join('')}</div><div class="card" style="margin-top:10px">${worldDetails()}</div>`}function worldDetails(){const p=PROVINCES[state.selectedProvince],i=state.selectedProvince,g=p[1]==='neutral'?500+((i*137)%1200):p[1]==='you'?0:1800+((i*211)%2800);return `<div class="row"><div><h3 style="margin:0">${p[0]}</h3><div class="small">${p[1]==='you'?'Friendly':p[1]==='neutral'?'Unclaimed':'Hostile'} · ${icon(p[2].toLowerCase())} ${p[2]} · Garrison ${fmt(g)}</div></div>${p[1]==='neutral'&&adjacentWorld(i)?`<button onclick="claimWorld(${i})">Claim Province</button>`:''}</div>`}
function portalView(){if(!state.portal)return `<div class="hero"><div><h1>Portal PvE</h1><div class="sub">Cooperative pocket-dimension campaigns.</div></div><span class="tag">Tier II</span></div><div class="card"><h3 style="margin-top:0">The Shattered Realm</h3><p>Conquer connected territories, capture rewards, and reach the Rift Citadel. Wild Mana can unpredictably change battles.</p><button onclick="portalOpen()">Open Test Portal</button></div>`;return `<div class="hero"><div><h1>The Shattered Realm</h1><div class="sub">Tier ${state.portal.tier} · Wild Mana</div></div><span class="tag">${P0.filter(x=>x.o==='player').length} / ${P0.length}</span></div><div class="map">${P0.map(t=>{const can=t.o==='enemy'&&portalAdjacent(t)&&!state.portal.complete;return `<button class="prov ${t.o==='player'?'you':t.o==='enemy'?'enemy':''}" ${can?'':'disabled'} onclick="attackPortal(${t.id})"><div class="name">${t.n}</div><div class="owner">${t.o==='player'?'Controlled':t.o==='enemy'?'Enemy':'Locked'}</div><div class="resource">Power ${fmt(t.s)} · +${fmt(t.r)}g</div></button>`}).join('')}</div><div class="notice"><b>Campaign rule:</b> only connected territories can be attacked. <button style="float:right" onclick="resetPortal()">Reset Portal</button></div>`}
function renderClock(){const mins=state.worldTick*10,day=Math.floor(mins/1440)+1,rem=mins%1440,h=String(Math.floor(rem/60)).padStart(2,'0'),m=String(rem%60).padStart(2,'0'),left=Math.max(0,600000-(Date.now()-lastTick)),lm=Math.floor(left/60000),ls=Math.floor(left/1000)%60;document.getElementById('clock').textContent=`Year 1 · Day ${day} · ${h}:${m} · next tick ${String(lm).padStart(2,'0')}:${String(ls).padStart(2,'0')}`}function toggleDebug(){debugOpen=!debugOpen;renderDebug()}function renderDebug(){const d=document.getElementById('debug');d.className='debug'+(debugOpen?' open':'');d.innerHTML=`<b>Debug Tools</b><div class="small">1 tick = 10 game minutes.</div><div class="row" style="margin:8px 0"><span>Amount</span><input id="amt" type="number" value="1000"></div><div class="grid" style="grid-template-columns:1fr 1fr"><button onclick="dbgRes()">+ Resources</button><button onclick="dbgArmy()">+ Army</button><button onclick="tick()">+1 Tick</button><button onclick="dbgTicks(6)">+1 Hour</button><button onclick="dbgTicks(48)">+8 Hours</button><button onclick="dbgClaims()">+5 Claims</button><button onclick="dbgPortal()">Complete Portal</button><button onclick="dbgUnlock()">Unlock Everything</button><button onclick="debugReset()">Reset Save</button></div>`}function amount(){return Math.max(1,Number(document.getElementById('amt')?.value)||1000)}function dbgRes(){for(const k of Object.keys(state.res))state.res[k]=Math.min(state.cap[k],state.res[k]+amount());save();render()}function dbgArmy(){for(const k of Object.keys(U))state.army[k]=(state.army[k]||0)+amount();state.pop+=amount()*Object.keys(U).length;save();render()}function dbgTicks(n){for(let i=0;i<n;i++)tick()}function dbgClaims(){for(let x=0;x<5;x++){const idx=PROVINCES.findIndex((p,i)=>p[1]==='neutral'&&adjacentWorld(i));if(idx<0)break;PROVINCES[idx][1]='you'}save();render()}function dbgPortal(){if(!state.portal)portalOpen();P0.forEach(t=>t.o='player');state.portal.complete=true;state.res.gold+=5000;state.res.mana+=300;log('Debug: portal completed.');save();render()}function dbgUnlock(){for(const k of Object.keys(B))state.buildings[k]=Math.max(1,state.buildings[k]||0);state.pcap=100000;Object.keys(state.cap).forEach(k=>state.cap[k]=999999);save();render()}function debugReset(){localStorage.removeItem('attrition-demo');state=clone(D);P0.forEach((m,i)=>m.o=i===0?'player':i<10?'enemy':'locked');lastTick=Date.now();render()}
document.addEventListener('keydown',e=>{if(e.key==='`')toggleDebug()});setInterval(()=>{tick()},600000);setInterval(renderClock,1000);if(!state.log.length){log('Simulation initialized.');save()}render();
</script></body></html>
