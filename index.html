<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Attrition</title>
<style>
:root{--bg:#080d0d;--glass:rgba(10,16,15,.72);--glass2:rgba(15,24,21,.88);--line:rgba(194,211,194,.18);--text:#eff4ee;--muted:#aab7ad;--gold:#efd477;--good:#7bc997;--bad:#e18d84;--accent:#8fcfe8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;backdrop-filter:blur(10px);box-shadow:0 8px 28px rgba(0,0,0,.24)}
button:hover{border-color:rgba(239,212,119,.55);background:rgba(31,43,36,.92)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#game{position:fixed;inset:0;background:#0b110f}
#map{position:absolute;inset:0;overflow:hidden;cursor:grab;background:#1a241e}
#map.dragging{cursor:grabbing}
#map:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 44%,rgba(0,0,0,.28) 100%)}
#topbar{position:absolute;z-index:10;left:18px;right:18px;top:16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;pointer-events:none}
#brand{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);background:var(--glass);border-radius:12px;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.28)}
#brand b{letter-spacing:.16em;font-size:18px}#brand .sub{font-size:10px;color:var(--muted);letter-spacing:.06em}
#resources{pointer-events:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:62vw}
.res{min-width:84px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;font-size:12px}
.res span{font-size:15px}.res small{font-size:10px;color:var(--muted)}
#top-actions{pointer-events:auto;display:flex;gap:7px}
.icon-btn{min-width:42px;padding:9px 10px;font-weight:700}
#bottom-left,#bottom-right{position:absolute;z-index:10;bottom:18px;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
#bottom-left{left:18px}#bottom-right{right:18px}
#selection-chip{pointer-events:auto;min-width:210px;padding:11px 13px;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 12px 36px rgba(0,0,0,.28)}
#selection-chip b{display:block;font-size:14px}#selection-chip small{color:var(--muted);display:block;margin-top:3px}
.action-btn{pointer-events:auto}
#panel{position:absolute;z-index:11;left:50%;bottom:18px;transform:translateX(-50%);width:min(430px,calc(100vw - 36px));padding:14px;background:var(--glass2);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(16px);box-shadow:0 18px 60px rgba(0,0,0,.48);display:none}
#panel.open{display:block}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}.panel-head h3{margin:0;font-size:16px}.panel-head small{display:block;color:var(--muted);margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv{padding:10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03)}.kv b{display:block;font-size:13px}.kv small{color:var(--muted)}
.panel-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.panel-actions button{flex:1;min-width:120px}
#toast{position:absolute;z-index:30;left:50%;top:82px;transform:translateX(-50%) translateY(-8px);padding:9px 13px;border-radius:10px;background:rgba(13,19,18,.92);border:1px solid rgba(239,212,119,.35);box-shadow:0 12px 40px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}.toast-open{opacity:1!important;transform:translateX(-50%) translateY(0)!important}
#help{position:absolute;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 16px;border:1px solid rgba(233,240,231,.15);border-radius:12px;background:rgba(8,13,12,.46);color:rgba(239,244,238,.7);backdrop-filter:blur(10px);pointer-events:none;transition:opacity .45s}.hidden{opacity:0}
@media(max-width:900px){#resources{max-width:54vw}.res{min-width:72px}.res small{display:none}#brand .sub{display:none}}
@media(max-width:640px){#topbar{left:10px;right:10px;top:10px;gap:7px}#resources{position:absolute;top:54px;left:0;right:0;max-width:none;justify-content:flex-start;overflow:auto;flex-wrap:nowrap;padding-bottom:4px}.res{min-width:76px}#bottom-left{left:10px;bottom:10px}#bottom-right{right:10px;bottom:10px}.action-btn{display:none}}
</style>
</head>
<body>
<div id="game">
  <div id="map"></div>
  <div id="topbar">
    <div id="brand"><div><b>ATTRITION</b><div class="sub">WORLD 01 · YEAR 1</div></div></div>
    <div id="resources"></div>
    <div id="top-actions"><button class="icon-btn" title="Settlement" onclick="openPanel('settlement')">⌂</button><button class="icon-btn" title="Army" onclick="openPanel('army')">⚑</button><button class="icon-btn" title="Portal" onclick="openPanel('portal')">◈</button><button class="icon-btn" title="Log" onclick="openPanel('log')">≡</button><button class="icon-btn" title="Settings" onclick="openPanel('settings')">⚙</button></div>
  </div>
  <div id="bottom-left"><div id="selection-chip"><b id="selection-name">Territory</b><small id="selection-meta">Select a territory</small></div></div>
  <div id="bottom-right"><button class="action-btn" onclick="centerHome()">Home</button><button class="action-btn" onclick="zoomMap(1.15)">+</button><button class="action-btn" onclick="zoomMap(.87)">−</button></div>
  <div id="panel"></div>
  <div id="toast"></div>
  <div id="help">Select a territory. Actions will unfold around it.</div>
</div>
<script src="map-data.js"></script>
<script src="world-map.js"></script>
<script>
const ICON={Food:'🍞',Wood:'🪵',Stone:'🪨',Iron:'⚙️',Oil:'🛢️',Mana:'🔮',Gold:'🪙'};
const RESOURCE_KEYS=['food','wood','stone','iron','oil','mana','gold'];
const INITIAL={res:{food:5000,wood:3500,stone:2200,iron:900,oil:200,mana:80,gold:800},cap:{food:10000,wood:10000,stone:8000,iron:5000,oil:2000,mana:500,gold:3000},pop:420,pcap:500,buildings:{farm:3,lumber:2,quarry:1,iron:1,warehouse:1,barracks:1,range:1},army:{militia:120,spearman:80,swordsman:30,archer:70,crossbow:20,cavalry:10},wounded:40,selected:9,world:{},worldArmies:[],log:[],worldTick:0,worldDate:0};
let state=loadState();let activePanel=null;let toastTimer=0;let lastTick=Date.now();let attritionWorldMapInstance=null;
function clone(o){return JSON.parse(JSON.stringify(o))}
function loadState(){try{const raw=JSON.parse(localStorage.getItem('attrition-map-ui-v3')||'null');if(!raw)return clone(INITIAL);const s=Object.assign(clone(INITIAL),raw);s.res=Object.assign(clone(INITIAL.res),raw.res||{});s.cap=Object.assign(clone(INITIAL.cap),raw.cap||{});s.buildings=Object.assign(clone(INITIAL.buildings),raw.buildings||{});s.army=Object.assign(clone(INITIAL.army),raw.army||{});s.world=Object.assign({},raw.world||{});s.worldArmies=raw.worldArmies||[];s.log=raw.log||[];return s}catch{return clone(INITIAL)}}
function save(){localStorage.setItem('attrition-map-ui-v3',JSON.stringify(state))}
function fmt(n){return Math.floor(n).toLocaleString()}
function owner(i){const t=AttritionMapData.territories[i];return state.world[i]?.owner||t.owner}
function selectedTerritory(){return AttritionMapData.territories[state.selected]||AttritionMapData.territories[0]}
function settlement(i){const t=AttritionMapData.territories[i];return state.world[i]?.settlement===false?null:(state.world[i]?.settlement||t.settlement||null)}
function adjacent(i){const p=AttritionMapData.territories[i];return AttritionMapData.territories.some((q,j)=>j!==i&&owner(j)==='you'&&Math.abs(q.col-p.col)+Math.abs(q.row-p.row)===1)}
function armyAt(i){return state.worldArmies.find(a=>a.province===i)||AttritionMapData.territories[i]?.army||null}
function armySize(){return Object.values(state.army).reduce((a,b)=>a+b,0)}
function income(){const b=state.buildings;const upkeep=Object.entries(state.army).reduce((s,[k,n])=>s+n*((k==='militia'||k==='archer')?0.5:(k==='spearman'||k==='crossbow')?1:(k==='swordsman'||k==='cavalry')?2:0),0);return{food:70+35*(b.farm||0)-upkeep,wood:60+32*(b.lumber||0),stone:40+30*(b.quarry||0),iron:18+24*(b.iron||0),oil:8*(b.oil||0),mana:2*(b.mana||0),gold:6}}
function tick(){const inc=income();for(const[k,v]of Object.entries(inc))state.res[k]=Math.min(state.cap[k],Math.max(0,state.res[k]+v/6));if(state.buildings.house)state.pop=Math.min(state.pcap,state.pop+state.buildings.house/6);if(state.wounded>0)state.wounded=Math.max(0,state.wounded-(2+(state.buildings.hospital||0))/6);state.worldTick++;state.worldDate+=10;lastTick=Date.now();save();render()}
function spend(c){for(const[k,v]of Object.entries(c))state.res[k]=(state.res[k]||0)-v}
function has(c){return Object.entries(c).every(([k,v])=>(state.res[k]||0)>=v)}
function log(message){state.log.unshift(message);state.log=state.log.slice(0,30);save()}
function toast(message){clearTimeout(toastTimer);const d=document.getElementById('toast');d.textContent=message;d.classList.add('toast-open');toastTimer=setTimeout(()=>d.classList.remove('toast-open'),1500)}
function selectProvince(i){state.selected=i;activePanel=null;document.getElementById('help').classList.add('hidden');render();save()}
function openPanel(kind){activePanel=kind;render()}
function claim(i){if(owner(i)==='you')return toast('Already controlled.');if(owner(i)!=='neutral')return toast('Enemy territory.');if(!adjacent(i))return toast('Not adjacent.');state.world[i]={owner:'you'};log(`Claimed ${selectedTerritory().name}.`);save();render();attritionWorldMapInstance?.refresh()}
function buildSelected(){const i=state.selected;if(owner(i)!=='you')return toast('Build only in your territory.');const cost={wood:120,stone:80};if(!has(cost))return toast('Not enough resources.');spend(cost);state.buildings.house=(state.buildings.house||0)+1;state.pcap+=50;log(`Built a House in ${selectedTerritory().name}.`);save();toast('House built.');render();attritionWorldMapInstance?.refresh()}
function handleMapAction(action,i){state.selected=i;activePanel=null;const name=selectedTerritory().name;switch(action){case'details':activePanel='details';break;case'build':buildSelected();return;case'scout':log(`Scouted ${name}.`);activePanel='details';toast('Scout report ready.');break;case'attack':log(`Attack prepared against ${name}.`);activePanel='army';toast('Army action prepared.');break;case'move':activePanel='army';break;case'army':activePanel='army';break;case'claim':claim(i);return;case'diplomacy':activePanel='relations';break;case'view':break}render()}
function resourceTray(){return RESOURCE_KEYS.map(k=>{const label=k[0].toUpperCase()+k.slice(1);return `<button class="res" title="${label}" onclick="openResource('${k}')"><span>${ICON[label]||''}</span><b>${fmt(state.res[k])}</b><small>/${fmt(state.cap[k])}</small></button>`}).join('')}
function openResource(k){activePanel='resource:'+k;render()}
function panelContent(){if(!activePanel)return '';if(activePanel.startsWith('resource:')){const k=activePanel.split(':')[1];const inc=income()[k]||0;return `<div class="panel-head"><div><h3>${k[0].toUpperCase()+k.slice(1)}</h3><small>Current stock and hourly change</small></div><button onclick="activePanel=null;render()">×</button></div><div class="grid"><div class="kv"><b>${fmt(state.res[k])}</b><small>Stored</small></div><div class="kv"><b>${inc>=0?'+':''}${fmt(inc)}</b><small>Per hour</small></div></div>`}
const t=selectedTerritory(),o=owner(state.selected),a=armyAt(state.selected);if(activePanel==='details')return `<div class="panel-head"><div><h3>${t.name}</h3><small>${o==='you'?'You control this territory':o==='neutral'?'Neutral territory':o} · ${t.resource}</small></div><button onclick="activePanel=null;render()">×</button></div><div class="grid"><div class="kv"><b>${t.resource}</b><small>Resource</small></div><div class="kv"><b>${settlement(state.selected)?'Settlement':'Open land'}</b><small>Development</small></div><div class="kv"><b>${a?fmt(a.size):'None'}</b><small>Army</small></div><div class="kv"><b>${adjacent(state.selected)?'Adjacent':'Not adjacent'}</b><small>Expansion</small></div></div>`;
if(activePanel==='settlement')return `<div class="panel-head"><div><h3>Settlement</h3><small>Territory development remains on the map.</small></div><button onclick="activePanel=null;render()">×</button></div><div class="grid"><div class="kv"><b>${fmt(state.pop)} / ${fmt(state.pcap)}</b><small>Population</small></div><div class="kv"><b>${state.buildings.farm||0}</b><small>Farms</small></div><div class="kv"><b>${state.buildings.lumber||0}</b><small>Lumber Mills</small></div><div class="kv"><b>${state.buildings.quarry||0}</b><small>Quarries</small></div></div><div class="panel-actions"><button onclick="activePanel='details';render()">Selected Tile</button><button onclick="buildSelected()">Build House</button></div>`;
if(activePanel==='army')return `<div class="panel-head"><div><h3>Army</h3><small>${fmt(armySize())} units · ${fmt(state.wounded)} wounded</small></div><button onclick="activePanel=null;render()">×</button></div><div class="grid">${Object.entries(state.army).slice(0,4).map(([k,v])=>`<div class="kv"><b>${fmt(v)}</b><small>${k}</small></div>`).join('')}</div><div class="panel-actions"><button onclick="activePanel='details';render()">Selected Tile</button><button onclick="toast('Training controls are next to the map.');">Train</button></div>`;
if(activePanel==='portal')return `<div class="panel-head"><div><h3>Portal</h3><small>PvE territory outside the main world.</small></div><button onclick="activePanel=null;render()">×</button></div><div class="kv"><b>Closed</b><small>Open a portal to start a multi-player encounter.</small></div><div class="panel-actions"><button onclick="toast('Portal opened.');log('Opened a PvE portal.');">Open Portal</button></div>`;
if(activePanel==='log')return `<div class="panel-head"><div><h3>Log</h3><small>Recent world events.</small></div><button onclick="activePanel=null;render()">×</button></div><div style="max-height:180px;overflow:auto">${state.log.slice(0,12).map(x=>`<div class="kv" style="margin-bottom:6px"><small>${x}</small></div>`).join('')||'<div class="kv"><small>No events yet.</small></div>'}</div>`;
if(activePanel==='settings')return `<div class="panel-head"><div><h3>Settings</h3><small>Map controls.</small></div><button onclick="activePanel=null;render()">×</button></div><div class="panel-actions"><button onclick="centerHome()">Center Map</button><button onclick="resetSave()">Reset Demo</button></div>`;
if(activePanel==='relations')return `<div class="panel-head"><div><h3>Relations</h3><small>Diplomacy is handled from the territory.</small></div><button onclick="activePanel=null;render()">×</button></div><div class="grid"><div class="kv"><b>${o==='neutral'?'Neutral':'Known'}</b><small>Current relation</small></div><div class="kv"><b>${t.owner==='you'?'Your territory':'Foreign territory'}</b><small>Control</small></div></div>`;return ''}
function render(){document.getElementById('resources').innerHTML=resourceTray();const t=selectedTerritory(),o=owner(state.selected);document.getElementById('selection-name').textContent=t.name;document.getElementById('selection-meta').textContent=`${o==='you'?'You':o==='neutral'?'Neutral':o} · ${t.resource}`;const p=document.getElementById('panel');p.innerHTML=panelContent();p.classList.toggle('open',!!activePanel);document.getElementById('help').classList.toggle('hidden',!!state.selected)}
function updateClock(){const mins=state.worldDate;const day=Math.floor(mins/1440)+1;const hour=String(Math.floor((mins%1440)/60)).padStart(2,'0');const m=String(mins%60).padStart(2,'0');document.querySelector('#brand .sub').textContent=`YEAR 1 · DAY ${day} · ${hour}:${m} · NEXT TICK ${Math.ceil(Math.max(0,600000-(Date.now()-lastTick))/60000)}M`}
function worldCanvas(){const wrap=document.getElementById('map');if(attritionWorldMapInstance){attritionWorldMapInstance.refresh();return}attritionWorldMapInstance=new AttritionWorldMap({container:wrap,data:AttritionMapData,getState:()=>state,onSelect:selectProvince,onAction:handleMapAction});}
function centerHome(){attritionWorldMapInstance?.home()}
function zoomMap(f){attritionWorldMapInstance?.zoomBy(f)}
function resetSave(){localStorage.removeItem('attrition-map-ui-v3');location.reload()}
worldCanvas();render();updateClock();setInterval(()=>{tick()},600000);setInterval(updateClock,1000);
</script>
</body>
</html>
