<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Attrition</title>
<style>
:root{--bg:#08100d;--glass:rgba(8,15,12,.78);--glass2:rgba(13,24,19,.94);--line:rgba(222,232,221,.18);--text:#f1f4ef;--muted:#a6b2a8;--gold:#efd477;--accent:#8fd4eb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;backdrop-filter:blur(10px)}
button:hover{border-color:rgba(239,212,119,.6);background:#1c3025}
button:active{transform:translateY(1px)}
#game{position:fixed;inset:0;background:#101b15}
#map-viewport{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#38533e 0,#263b2d 52%,#15231b 100%);cursor:grab}
#map-viewport.dragging{cursor:grabbing}
#world{position:absolute;left:50%;top:50%;width:2200px;height:1350px;transform-origin:50% 50%;transform-style:preserve-3d;perspective:1200px;user-select:none}
#world-inner{position:absolute;inset:0;transform-origin:50% 50%;transform:rotateX(54deg) rotateZ(-14deg) scale(.82);filter:drop-shadow(0 42px 32px rgba(0,0,0,.42));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tile{cursor:pointer;transition:filter .2s}.tile polygon{stroke:rgba(20,32,23,.55);stroke-width:4;vector-effect:non-scaling-stroke}.tile:hover polygon{filter:brightness(1.12)}.tile.you polygon{fill:rgba(55,135,172,.72);stroke:#8fcfe8}.tile.north polygon{fill:rgba(154,83,77,.66);stroke:#db9c94}.tile.south polygon{fill:rgba(116,83,151,.66);stroke:#cdb5e4}.tile.neutral polygon{fill:rgba(113,124,88,.56);stroke:#aab49d}
.terrain{opacity:.62;pointer-events:none}.tree{fill:#33573d}.tree2{fill:#456e48}.field{stroke:#c4b86e;stroke-width:5;opacity:.5}.hill{fill:#677854}.road{fill:none;stroke:#9b8860;stroke-width:12;opacity:.72;stroke-linecap:round}.river{fill:none;stroke:#4c8ca0;stroke-width:18;opacity:.88;stroke-linecap:round}
.settlement{pointer-events:none}.building{fill:#bba57d}.roof{fill:#74413a}.fort{fill:#858981;stroke:#6d776d;stroke-width:4}.flag-you{fill:#8fd4eb}.flag-enemy{fill:#e29a8f}
.resource{font-size:19px;pointer-events:none}.army{font-weight:800;font-size:12px;fill:white;paint-order:stroke;stroke:#17211b;stroke-width:4}
.name{font-size:16px;font-weight:750;fill:#eef3ea;paint-order:stroke;stroke:#152018;stroke-width:4;pointer-events:none}.owner{font-size:10px;fill:#d8e0d6;paint-order:stroke;stroke:#152018;stroke-width:3;pointer-events:none}
.selected polygon{stroke:#f0d47a;stroke-width:8;filter:drop-shadow(0 8px 4px rgba(0,0,0,.42))}
#selection-pulse{fill:none;stroke:rgba(255,236,142,.62);stroke-width:4;opacity:0;pointer-events:none}
#selection-pulse.active{animation:pulse .85s ease-out 1}@keyframes pulse{0%{opacity:.9;r:34}100%{opacity:0;r:100}}
#radial{position:absolute;inset:0;pointer-events:none;display:none}.radial-line{position:absolute;left:0;top:0;height:2px;transform-origin:0 50%;background:rgba(239,212,119,.5)}.radial-btn{position:absolute;transform:translate(-50%,-50%) scale(.2);width:70px;height:70px;border-radius:50%;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:rgba(12,20,16,.96);border:2px solid rgba(221,228,214,.55);box-shadow:0 10px 30px rgba(0,0,0,.38);opacity:0;color:#f1f4ef;transition:transform .45s cubic-bezier(.15,.85,.25,1),opacity .28s,background .2s,border-color .2s}.radial-btn span:first-child{font-size:20px;color:var(--gold)}.radial-btn span:last-child{font-size:10px;font-weight:700}.radial-btn:hover{background:#263b30;border-color:var(--gold);transform:translate(-50%,-50%) scale(1.08)}#radial.open{display:block}.radial-btn.show{transform:translate(-50%,-50%) scale(1);opacity:1}
#topbar{position:absolute;z-index:20;left:16px;right:16px;top:14px;display:flex;align-items:flex-start;gap:10px;justify-content:space-between;pointer-events:none}.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 12px 32px rgba(0,0,0,.28);border-radius:12px}
#brand{pointer-events:auto;padding:9px 12px}.brand{font-weight:900;letter-spacing:.16em;font-size:18px}.sub{font-size:10px;color:var(--muted)}
#resources{pointer-events:auto;display:flex;gap:6px;max-width:65vw;overflow:auto}.res{min-width:82px;padding:7px 9px;display:flex;justify-content:space-between;gap:8px;font-size:12px}.res small{color:var(--muted)}
#top-actions{pointer-events:auto;display:flex;gap:6px}.icon{min-width:40px}
#selection{position:absolute;z-index:20;left:16px;bottom:16px;padding:11px 13px;min-width:220px}.selection-name{font-weight:800}.selection-meta{font-size:11px;color:var(--muted);margin-top:3px}
#panel{position:absolute;z-index:30;left:50%;bottom:16px;transform:translateX(-50%);width:min(440px,calc(100vw - 32px));padding:14px;background:var(--glass2);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.48);backdrop-filter:blur(16px);display:none}.panel-open{display:block}.panel-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.panel-head h3{margin:0}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:10px;padding:10px}.kv b{display:block}.kv small{color:var(--muted)}.panel-actions{display:flex;gap:7px;margin-top:10px}.panel-actions button{flex:1}
#toast{position:absolute;z-index:50;top:78px;left:50%;transform:translate(-50%,-8px);opacity:0;padding:9px 13px;border-radius:10px;background:rgba(10,17,13,.94);border:1px solid rgba(239,212,119,.35);transition:.2s;pointer-events:none}#toast.open{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){#resources{position:absolute;top:56px;left:0;max-width:100vw;right:0}.res{min-width:74px}.icon{min-width:36px;padding:8px}.glass{border-radius:10px}#world-inner{transform:rotateX(54deg) rotateZ(-14deg) scale(.58)}}
</style>
</head>
<body>
<div id="game">
<div id="map-viewport">
<div id="world"><div id="world-inner">
<svg id="svg" viewBox="0 0 2200 1350" width="2200" height="1350" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d9366"/><stop offset=".55" stop-color="#70855b"/><stop offset="1" stop-color="#647951"/></linearGradient></defs>
<rect x="0" y="0" width="2200" height="1350" rx="90" fill="url(#ground)"/>
<path class="river" d="M120 0 C210 250 120 380 270 600 S160 980 290 1350 M2110 0 C1960 210 2070 420 1930 630 S2060 1040 1900 1350"/>
<path class="road" d="M110 720 Q500 620 780 720 T1500 690 T2110 610 M550 70 Q620 300 585 510 T620 850 T560 1280"/>
<g id="tiles"></g><g id="fx"></g><circle id="map-selection" cx="0" cy="0" r="1" fill="none"/>
</svg></div></div>
<div id="radial"></div>
</div>
<div id="topbar"><div id="brand" class="glass"><div class="brand">ATTRITION</div><div class="sub" id="clock">YEAR 1 · DAY 1 · 00:00</div></div><div id="resources"></div><div id="top-actions"><button class="icon glass icon" onclick="openPanel('settlement')">⌂</button><button class="icon glass icon" onclick="openPanel('army')">⚑</button><button class="icon glass icon" onclick="openPanel('portal')">◈</button><button class="icon glass icon" onclick="openPanel('log')">≡</button><button class="icon glass icon" onclick="openPanel('settings')">⚙</button></div></div>
<div id="selection" class="glass"><div class="selection-name" id="sel-name">Territory 10</div><div class="selection-meta" id="sel-meta">You · Gold · Select a territory</div></div>
<div id="panel"></div><div id="toast"></div>
</div>
<script>
const DATA=(function(){
 const resources=['Iron','Wood','Food','Stone','Iron','Food','Oil','Food','Food','Gold','Wood','Iron','Oil','Mana','Mana','Food','Stone','Mana','Food','Oil','Iron','Mana','Oil','Wood','Stone','Wood','Food','Iron','Oil','Gold','Mana','Stone'];
 const owners=['north','north','north','north','north','north','neutral','neutral','neutral','you','you','you','you','south','south','south','south','south','neutral','neutral','neutral','neutral','neutral','neutral','neutral','neutral','neutral','neutral','neutral','neutral','south','south'];
 const terrain=['forest','forest','field','hill','hill','field','field','coast','forest','plain','field','plain','plain','hill','forest','coast','hill','forest','field','plain','hill','plain','forest','forest','plain','forest','field','plain','plain','hill','forest','coast'];
 return Array.from({length:32},(_,i)=>({id:i, name:'Territory '+(i+1), col:i%8,row:Math.floor(i/8), resource:resources[i], owner:owners[i], terrain:terrain[i], army:{3:2600,9:330,12:80,14:2100,20:1200}[i]||0, settlement:{9:'village',10:'capital',11:'town',12:'fort',13:'port',14:'town',15:'fort',16:'town',17:'village',18:'town',19:'port',21:'ruins',22:'town',23:'fort',24:'forest',25:'village',26:'village',27:'town',28:'town',29:'port',30:'ruins',31:'fort'}[i]||null}));
})();
const COLORS={you:'#3b8bb2',north:'#9d5a53',south:'#765b96',neutral:'#727d58'};
const ICON={Food:'🍞',Wood:'🪵',Stone:'🪨',Iron:'⚙️',Oil:'🛢️',Mana:'🔮',Gold:'🪙'};
let selected=9,drag={active:false,sx:0,sy:0,px:0,pz:0},camera={x:0,y:1.85,z:0},zoom=1,radialOpen=false,worldDays=0;
function gridPoint(t){const x=90+t.col*250,y=90+t.row*290;return{x,y}}
function polygon(t){const p=gridPoint(t);return[[p.x,p.y+18],[p.x+236,p.y],[p.x+250,p.y+272],[p.x+12,p.y+290]]}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function makeSvg(){const g=document.getElementById('tiles');g.innerHTML=DATA.map((t,i)=>{const p=polygon(t),pts=p.map(x=>x.join(',')).join(' '),c=gridPoint(t);return `<g class="tile ${t.owner}" data-i="${i}" onclick="selectTile(${i})"><polygon points="${pts}"></polygon><g class="terrain">${terrainSvg(t,c)}</g><g class="settlement">${settlementSvg(t,c)}</g><text class="name" x="${c.x+14}" y="${c.y+34}">${esc(t.name)}</text><text class="owner" x="${c.x+14}" y="${c.y+51}">${t.owner==='you'?'YOU':t.owner.toUpperCase()} · ${t.resource}</text>${t.army?`<text class="army" x="${c.x+204}" y="${c.y+50}">⚑ ${t.army.toLocaleString()}</text>`:''}<text class="resource" x="${c.x+192}" y="${c.y+92}">${ICON[t.resource]}</text></g>`}).join('')}
function terrainSvg(t,c){if(t.terrain==='forest'){return Array.from({length:7},(_,i)=>`<circle class="tree" cx="${c.x+38+(i%4)*42}" cy="${c.y+112+Math.floor(i/4)*32}" r="${18+(i%3)*3}"/>`).join('')};if(t.terrain==='field'){return Array.from({length:5},(_,i)=>`<path class="field" d="M${c.x+28} ${c.y+105+i*27} L${c.x+180} ${c.y+119+i*27}"/>`).join('')};if(t.terrain==='hill'){return '<ellipse class="hill" cx="'+(c.x+120)+'" cy="'+(c.y+125)+'" rx="94" ry="40"/><ellipse class="hill" cx="'+(c.x+62)+'" cy="'+(c.y+155)+'" rx="70" ry="30"/>'};return '<rect x="'+(c.x+30)+'" y="'+(c.y+100)+'" width="175" height="85" rx="20" fill="rgba(80,103,83,.24)"/>'}
function settlementSvg(t,c){if(!t.settlement)return '';let s=t.settlement;if(s==='ruins')return '<rect x="'+(c.x+86)+'" y="'+(c.y+183)+'" width="80" height="42" class="fort"/>';let out='<rect x="'+(c.x+84)+'" y="'+(c.y+184)+'" width="72" height="38" class="building"/><path class="roof" d="M'+(c.x+76)+' '+(c.y+184)+' L'+(c.x+120)+' '+(c.y+150)+' L'+(c.x+164)+' '+(c.y+184)+'Z"/>';if(s==='fort'||s==='capital')out+='<rect x="'+(c.x+54)+'" y="'+(c.y+170)+'" width="22" height="58" class="fort"/><rect x="'+(c.x+164)+'" y="'+(c.y+170)+'" width="22" height="58" class="fort"/>';if(s==='capital')out+='<rect x="'+(c.x+116)+'" y="'+(c.y+117)+'" width="8" height="42" class="flag-you"/>';return out}
function renderResources(){const vals={Food:5000,Wood:3500,Stone:2200,Iron:900,Oil:200,Mana:80,Gold:800};document.getElementById('resources').innerHTML=Object.entries(vals).map(([k,v])=>`<button class="res glass" onclick="openResource('${k}')"><span>${ICON[k]}</span><b>${v.toLocaleString()}</b><small>/${k==='Gold'?'3000':k==='Mana'?'500':k==='Oil'?'2000':k==='Stone'?'8000':'10000'}</small></button>`).join('')}
function selectTile(i){selected=i;closePanel();radialOpen=true;updateSelection();pulse();buildRadial();document.getElementById('map-selection').classList.remove('active');void document.getElementById('map-selection').offsetWidth;document.getElementById('map-selection').classList.add('active')}
function updateSelection(){const t=DATA[selected],c=gridPoint(t);document.querySelectorAll('.tile.selected').forEach(e=>e.classList.remove('selected'));const el=document.querySelector('.tile[data-i="'+selected+'"]');if(el)el.classList.add('selected');document.getElementById('sel-name').textContent=t.name;document.getElementById('sel-meta').textContent=(t.owner==='you'?'You':t.owner==='neutral'?'Neutral':t.owner)+' · '+t.resource}
function buildRadial(){const r=document.getElementById('radial');r.innerHTML='';const actions=actionsFor(DATA[selected]);actions.forEach((a,i)=>{const b=document.createElement('button');b.className='radial-btn';b.innerHTML='<span>'+a.glyph+'</span><span>'+a.label+'</span>';b.type='button';b.onpointerdown=e=>e.stopPropagation();b.onclick=e=>{e.stopPropagation();doAction(a.id)};r.appendChild(b)});const vp=document.getElementById('map-viewport').getBoundingClientRect(),el=document.querySelector('.tile[data-i="'+selected+'"] polygon');if(!el)return;const bb=el.getBoundingClientRect(),cx=bb.left-vp.left+bb.width/2,cy=bb.top-vp.top+bb.height/2;const radius=Math.min(165,Math.max(115,Math.min(vp.width,vp.height)*.16));[...r.children].forEach((b,i)=>{const angle=-Math.PI/2+i*(Math.PI*2/r.children.length);const x=cx+Math.cos(angle)*radius,y=cy+Math.sin(angle)*radius;b.style.left=x+'px';b.style.top=y+'px';requestAnimationFrame(()=>b.classList.add('show'));const line=document.createElement('div');line.className='radial-line';line.style.left=cx+'px';line.style.top=cy+'px';line.style.width=radius+'px';line.style.transform='rotate('+angle+'rad)';r.appendChild(line);setTimeout(()=>line.style.opacity='.65',40)});r.classList.add('open')}
function actionsFor(t){const enemy=!['you','neutral'].includes(t.owner);return[{id:'details',label:'Details',glyph:'i'},{id:t.owner==='you'?'build':'scout',label:t.owner==='you'?'Build':'Scout',glyph:t.owner==='you'?'+':'◎'},{id:enemy?'attack':'move',label:enemy?'Attack':'Move',glyph:enemy?'⚔':'↗'},{id:t.owner==='you'?'army':'claim',label:t.owner==='you'?'Army':'Claim',glyph:t.owner==='you'?'⚑':'◆'},{id:'relations',label:'Relations',glyph:'◌'},{id:'view',label:'View',glyph:'◉'}]}
function doAction(id){const t=DATA[selected];if(id==='view'){toast('Map view');return}if(id==='claim'){if(t.owner==='neutral'){t.owner='you';toast('Territory claimed');makeSvg();updateSelection();buildRadial()}else toast('Cannot claim this territory');return}if(id==='scout'){toast('Scout report ready');openPanel('details');return}if(id==='attack'){toast('Army action prepared');openPanel('army');return}if(id==='build'){toast('Build controls opened');openPanel('settlement');return}if(id==='details'){openPanel('details');return}if(id==='army'){openPanel('army');return}if(id==='relations'){openPanel('relations')}}
function pulse(){const p=document.getElementById('map-selection');const c=gridPoint(DATA[selected]);p.setAttribute('cx',c.x+125);p.setAttribute('cy',c.y+145);p.classList.remove('active');void p.offsetWidth;p.classList.add('active')}
function closePanel(){const p=document.getElementById('panel');p.classList.remove('panel-open');radialOpen=false;document.getElementById('radial').classList.remove('open')}
function openPanel(kind){const t=DATA[selected],p=document.getElementById('panel');let html='';if(kind==='details')html='<div class="panel-head"><div><h3>'+t.name+'</h3><div class="muted">'+t.resource+' · '+(t.owner==='you'?'You':t.owner==='neutral'?'Neutral':t.owner)+'</div></div><button onclick="closePanel()">×</button></div><div class="grid"><div class="kv"><b>'+t.resource+'</b><small>Resource</small></div><div class="kv"><b>'+(t.settlement||'None')+'</b><small>Settlement</small></div><div class="kv"><b>'+(t.army?t.army.toLocaleString():'None')+'</b><small>Army</small></div><div class="kv"><b>'+(((t.col>0||t.row>0))?'Connected':'Edge')+'</b><small>Position</small></div></div>';else if(kind==='settlement')html='<div class="panel-head"><div><h3>Settlement</h3><div class="muted">Development stays visible on the world.</div></div><button onclick="closePanel()">×</button></div><div class="grid"><div class="kv"><b>420 / 500</b><small>Population</small></div><div class="kv"><b>3</b><small>Farms</small></div><div class="kv"><b>2</b><small>Lumber Mills</small></div><div class="kv"><b>1</b><small>Quarry</small></div></div><div class="panel-actions"><button onclick="doAction(\'build\')">Build House</button></div>';else if(kind==='army')html='<div class="panel-head"><div><h3>Army</h3><div class="muted">1,?00 total units · 40 wounded</div></div><button onclick="closePanel()">×</button></div><div class="grid"><div class="kv"><b>120</b><small>Militia</small></div><div class="kv"><b>80</b><small>Spearmen</small></div><div class="kv"><b>70</b><small>Archers</small></div><div class="kv"><b>40</b><small>Other</small></div></div>';else if(kind==='portal')html='<div class="panel-head"><div><h3>Portal</h3><div class="muted">PvE encounter</div></div><button onclick="closePanel()">×</button></div><div class="kv"><b>Closed</b><small>Open a portal to fight outside the main world.</small></div><div class="panel-actions"><button onclick="toast(\'Portal opened\')">Open Portal</button></div>';else if(kind==='log')html='<div class="panel-head"><div><h3>Log</h3><div class="muted">Recent world events</div></div><button onclick="closePanel()">×</button></div><div class="kv"><small>No recent events.</small></div>';else if(kind==='settings')html='<div class="panel-head"><div><h3>Settings</h3><div class="muted">Map controls</div></div><button onclick="closePanel()">×</button></div><div class="panel-actions"><button onclick="resetView()">Center Map</button></div>';else if(kind==='relations')html='<div class="panel-head"><div><h3>Relations</h3><div class="muted">Diplomacy for '+t.name+'</div></div><button onclick="closePanel()">×</button></div><div class="grid"><div class="kv"><b>'+(t.owner==='neutral'?'Neutral':'Known')+'</b><small>Current relation</small></div><div class="kv"><b>'+t.owner.toUpperCase()+'</b><small>Control</small></div></div>';p.innerHTML=html;p.classList.add('panel-open');radialOpen=false;document.getElementById('radial').classList.remove('open')}
function openResource(k){toast(k+' selected')}
function toast(s){const d=document.getElementById('toast');d.textContent=s;d.classList.add('open');clearTimeout(toast._t);toast._t=setTimeout(()=>d.classList.remove('open'),1400)}
function resetView(){camera.x=0;camera.z=0;zoom=1;applyView();buildRadial();toast('Map centered')}
function applyView(){const w=document.getElementById('world');w.style.transform='translate3d(calc(-50% + '+camera.x+'px),calc(-50% + '+camera.z+'px),0) scale('+zoom+')'}
const vp=document.getElementById('map-viewport');vp.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.radial-btn'))return;drag={active:true,sx:e.clientX,sy:e.clientY,px:camera.x,pz:camera.z};vp.classList.add('dragging');vp.setPointerCapture(e.pointerId)});
vp.addEventListener('pointermove',e=>{if(!drag.active)return;camera.x=drag.px+e.clientX-drag.sx;camera.z=drag.pz+e.clientY-drag.sy;applyView();if(radialOpen)buildRadial()});
vp.addEventListener('pointerup',e=>{if(!drag.active)return;drag.active=false;vp.classList.remove('dragging');try{vp.releasePointerCapture(e.pointerId)}catch(_){}});vp.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.72,Math.min(1.35,zoom*(e.deltaY<0?1.08:.93)));applyView()},{passive:false});
makeSvg();renderResources();updateSelection();applyView();setInterval(()=>{worldDays=(worldDays+10)%1440;const h=String(Math.floor(worldDays/60)).padStart(2,'0'),m=String(worldDays%60).padStart(2,'0');document.getElementById('clock').textContent='YEAR 1 · DAY 1 · '+h+':'+m},600000);
</script>
</body></html>
