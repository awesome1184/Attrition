<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attrition</title>
<style>
:root{--bg:#0a0e12;--panel:#111820;--panel2:#18212a;--line:#2a3640;--text:#edf2f5;--muted:#91a0aa;--accent:#75b9e8;--gold:#e1bd62;--good:#67c992;--bad:#d97878}*{box-sizing:border-box}body{margin:0;background:#0a0e12;color:var(--text);font:14px system-ui,sans-serif}button{font:inherit;color:inherit;background:#1d2a34;border:1px solid #3a4d5a;border-radius:6px;padding:7px 10px;cursor:pointer}button:hover{background:#293b47}button:disabled{opacity:.45;cursor:not-allowed}.top{height:56px;display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:#0d1319;position:sticky;top:0;z-index:20}.brand{font-weight:900;letter-spacing:.12em;font-size:20px}.sub{font-size:11px;color:var(--muted)}.clock{margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 10px;font-size:12px}.resources{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;background:#0c1217;border-bottom:1px solid var(--line)}.res{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}.res b{font-size:12px}.layout{display:grid;grid-template-columns:190px minmax(560px,1fr) 290px;height:calc(100vh - 96px)}aside{background:#10161c;padding:12px;overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}main{min-width:0;display:flex;flex-direction:column;overflow:hidden}.nav button{width:100%;display:block;text-align:left;margin-bottom:6px}.nav .active{border-color:var(--accent);background:#1c3344}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:9px}.small{font-size:12px;color:var(--muted)}.grid{display:grid;gap:8px}.cards{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.hero{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}.hero h1{margin:0 0 3px;font-size:24px}.building,.unit{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px}.cost{font-size:11px;color:var(--gold);margin:5px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:7px}.log{font:11px ui-monospace,monospace;background:#090d11;border:1px solid var(--line);border-radius:6px;padding:7px;max-height:160px;overflow:auto}.debug{position:fixed;right:14px;bottom:14px;width:330px;background:#0b1116;border:1px solid #55728a;border-radius:8px;padding:10px;display:none;z-index:50;box-shadow:0 15px 40px #0009}.debug.open{display:block}.debug input{width:84px;background:#121b23;color:inherit;border:1px solid var(--line);border-radius:5px;padding:5px}.pill{font-size:10px;background:#25323c;border-radius:4px;padding:3px 6px;color:#b6c2ca}.world-head{padding:9px 11px;border-bottom:1px solid var(--line);background:#0f161c}.world-head .row{flex-wrap:wrap}.map-wrap{position:relative;flex:1;min-height:0;background:#6c815e;overflow:hidden;cursor:grab}.map-wrap.dragging{cursor:grabbing}.map-canvas{position:absolute;left:0;top:0;width:2400px;height:1600px;transform-origin:0 0}.map-hint{position:absolute;left:10px;bottom:10px;background:#101820cc;border:1px solid #526673;border-radius:6px;padding:6px 8px;color:#d5dde2;font-size:11px;pointer-events:none}.zoom{position:absolute;right:10px;top:10px;display:flex;gap:5px;z-index:2}.zoom button{width:34px;padding:6px}.map-info{font-size:12px;color:#c4cfd6}.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:10px;color:#bdc8cf;margin-top:6px}.legend span{display:flex;align-items:center;gap:4px}.dot{width:10px;height:10px;border-radius:3px;display:inline-block}.notice{padding:8px;border:1px solid var(--line);border-radius:7px;background:#16212a}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:8px 12px;background:#111920;border:1px solid #4b6475;border-radius:7px;z-index:80;box-shadow:0 8px 30px #0008}
@media(max-width:1050px){.layout{grid-template-columns:175px 1fr}.right{display:none}}@media(max-width:700px){.layout{display:block;height:auto}.left{display:none}main{height:calc(100vh - 96px)}.clock{margin-left:0}.top{flex-wrap:wrap;height:auto}.map-canvas{width:1800px;height:1200px}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">ATTRITION</div><div class="sub">Strategy prototype</div></div><div id="clock" class="clock"></div><button onclick="toggleDebug()">Debug</button></header>
<div id="resources" class="resources"></div>
<div class="layout"><aside class="left"><div id="nav" class="nav"></div><div class="card"><b>Realm</b><div id="stats" class="small" style="margin-top:7px"></div></div><div class="card"><b>Tick</b><div class="small">10 minutes</div></div></aside><main id="main"></main><aside class="right" id="right"></aside></div><div id="debug" class="debug"></div>
<script>
const B={town:['Town Center',{wood:500,stone:300}],house:['House',{wood:120}],farm:['Farm',{wood:150}],lumber:['Lumber Mill',{wood:220,stone:40}],quarry:['Quarry',{wood:180,stone:80}],iron:['Iron Mine',{wood:260,stone:120}],oil:['Oil Well',{wood:500,stone:250,iron:150}],mana:['Mana Crystal Mine',{wood:600,stone:350,iron:200}],warehouse:['Warehouse',{wood:280,stone:100}],market:['Market',{wood:400,stone:160}],barracks:['Barracks',{wood:350,stone:120,iron:50}],range:['Archery Range',{wood:420,stone:80,iron:40}],stable:['Stable',{wood:550,stone:150,iron:100}],workshop:['Workshop',{wood:650,stone:300,iron:180}],hospital:['Hospital',{wood:500,stone:350,iron:120}],wall:['Wall',{wood:300,stone:700}],tower:['Watchtower',{wood:250,stone:450}],rally:['Rally Point',{wood:380,stone:220,iron:60}],command:['Command Center',{wood:700,stone:500,iron:300}],refinery:['Refinery',{wood:700,stone:500,iron:500,oil:150}],reactor:['Mana Reactor',{wood:800,stone:500,iron:250,mana:50}],academy:['Arcane Academy',{wood:900,stone:700,iron:300,mana:100}]};
const U={militia:['Militia','barracks',{food:15,wood:5},.5,8,7],spearman:['Spearman','barracks',{food:25,wood:15},1,12,14],swordsman:['Swordsman','barracks',{food:50,wood:30,iron:10},2,24,24],archer:['Archer','range',{food:20,wood:20},1,18,6],crossbow:['Crossbowman','range',{food:40,wood:35,iron:15},2,32,8],cavalry:['Cavalry','stable',{food:70,wood:20,iron:25},3,35,18]};
const DEF={res:{food:5000,wood:3500,stone:2200,iron:900,oil:200,mana:80,gold:800},cap:{food:10000,wood:10000,stone:8000,iron:5000,oil:2000,mana:500,gold:3000},pop:420,pcap:500,buildings:{town:1,farm:3,lumber:2,quarry:1,iron:1,warehouse:1,barracks:1,range:1},army:{militia:120,spearman:80,swordsman:30,archer:70,crossbow:20,cavalry:10},wounded:40,screen:'world',worldTick:0,worldDate:0,selected:9,claims:3,world:{},worldArmies:[],log:[]};
const REGIONS=[
['Frostmarch','north','Iron',0,0],['White Pines','north','Wood',1,0],['Highvale','north','Food',2,0],['Stonewatch','north','Stone',3,0],['Crown Pass','north','Iron',4,0],['Red River','north','Food',5,0],['Ash Coast','neutral','Oil',6,0],['North Sea','neutral','Food',7,0],
['Green Fields','neutral','Food',0,1],['Kings Road','you','Gold',1,1],['Silverwood','you','Wood',2,1],['Ashen Plains','you','Iron',3,1],['Ember Coast','you','Oil',4,1],['Moonfall','south','Mana',5,1],['Duskmoor','south','Mana',6,1],['Violet Reach','south','Food',7,1],
['Blackfen','south','Stone',0,2],['Starfall','south','Mana',1,2],['Sun Coast','neutral','Food',2,2],['Glass Desert','neutral','Oil',3,2],['Old Empire','neutral','Iron',4,2],['Crystal Vale','neutral','Mana',5,2],['Stormlands','neutral','Oil',6,2],['Deepwild','neutral','Wood',7,2],
['Westmarch','neutral','Stone',0,3],['Pine Ridge','neutral','Wood',1,3],['Long Meadow','neutral','Food',2,3],['Ironwood','neutral','Iron',3,3],['Salt Coast','neutral','Oil',4,3],['Ruins of Arda','neutral','Gold',5,3],['Darkfen','south','Mana',6,3],['High Road','south','Stone',7,3]
];
const W=2400,H=1600,CW=300,CH=300;
let state=load();let lastTick=Date.now();let map={x:-260,y:-180,z:.75,drag:false,sx:0,sy:0,ox:0,oy:0};let toastTimer;
function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){try{const raw=JSON.parse(localStorage.getItem('attrition-demo-v2')||localStorage.getItem('attrition-demo'));const s=Object.assign(clone(DEF),raw||{});s.res=Object.assign(clone(DEF.res),raw?.res||raw?.resources||{});s.cap=Object.assign(clone(DEF.cap),raw?.cap||{});s.buildings=Object.assign(clone(DEF.buildings),raw?.buildings||raw?.b||{});s.army=Object.assign(clone(DEF.army),raw?.army||{});s.world=Object.assign({},raw?.world||{});s.worldArmies=raw?.worldArmies||[];return s}catch{return clone(DEF)}}
function save(){localStorage.setItem('attrition-demo-v2',JSON.stringify(state))}function fmt(n){return Math.floor(n).toLocaleString()}function icon(k){return{food:'🍞',wood:'🪵',stone:'🪨',iron:'⚙️',oil:'🛢️',mana:'🔮',gold:'🪙'}[k]||''}function cost(c){return Object.entries(c).map(([k,v])=>`${icon(k)} ${fmt(v)}`).join(' · ')}function has(c){return Object.entries(c).every(([k,v])=>(state.res[k]||0)>=v)}function spend(c){Object.entries(c).forEach(([k,v])=>state.res[k]-=v)}function armySize(){return Object.values(state.army).reduce((a,b)=>a+b,0)}function power(){return Object.entries(state.army).reduce((p,[k,n])=>p+n*((U[k]?.[4]||8)*1.6+(U[k]?.[5]||8)),0)}function income(){const b=state.buildings;return{food:70+35*(b.farm||0)-Object.entries(state.army).reduce((s,[k,n])=>s+(U[k]?.[3]||0)*n,0),wood:60+32*(b.lumber||0),stone:40+30*(b.quarry||0),iron:18+24*(b.iron||0),oil:8*(b.oil||0),mana:2*(b.mana||0),gold:6}}
function tick(){const inc=income();for(const[k,v]of Object.entries(inc))state.res[k]=Math.min(state.cap[k],Math.max(0,state.res[k]+v/6));if(state.buildings.house)state.pop=Math.min(state.pcap,state.pop+state.buildings.house/6);if(state.wounded>0)state.wounded=Math.max(0,state.wounded-(2+(state.buildings.hospital||0))/6);state.worldTick++;state.worldDate+=10;lastTick=Date.now();save();render()}
function build(k){const b=B[k];if(!has(b[1]))return toast('Not enough resources.');spend(b[1]);state.buildings[k]=(state.buildings[k]||0)+1;if(k==='house')state.pcap+=50;if(k==='warehouse')Object.keys(state.cap).forEach(r=>state.cap[r]+=2500);log(`Built ${b[0]}.`);save();render()}
function train(k,n=10){const u=U[k],c={};Object.entries(u[2]).forEach(([r,v])=>c[r]=v*n);if(!state.buildings[u[1]])return toast('Required building is missing.');if(!has(c))return toast('Not enough resources.');if(state.pop+n>state.pcap)return toast('Population capacity reached.');spend(c);state.army[k]=(state.army[k]||0)+n;state.pop+=n;log(`Trained ${n} ${u[0]}.`);save();render()}
function adjacent(i){const p=REGIONS[i];return REGIONS.some((q,j)=>j!==i&&owner(j)==='you'&&Math.abs(q[3]-p[3])+Math.abs(q[4]-p[4])===1)}
function owner(i){return state.world[i]?.owner||REGIONS[i][1]}
function claim(i){const p=REGIONS[i];if(owner(i)==='you')return;if(owner(i)!=='neutral')return toast('Enemy territory.');if(!adjacent(i))return toast('Not adjacent to your territory.');state.world[i]={owner:'you'};state.claims=Math.max(0,state.claims-1);log(`Claimed ${p[0]}.`);save();render()}
function provinceBuildingCount(i){const o=owner(i);if(o==='you'){return 5+(i%4)}if(o==='north'||o==='south')return 3+(i%3);return i%5===0?2:1}
function provinceSettlement(i){return owner(i)!=='neutral'||i===9||!!state.world[i]?.settled}
function buildingTypes(i){const base=['house','farm','lumber'];const r=REGIONS[i][2];if(r==='Iron')base.push('iron');if(r==='Oil')base.push('oil');if(r==='Mana')base.push('mana');if(owner(i)==='you')base.push(i%2?'barracks':'warehouse');return base}
function armyAt(i){return state.worldArmies.find(a=>a.province===i)}
function settle(i){if(owner(i)!=='you')return;if(provinceSettlement(i))return;state.world[i]={...(state.world[i]||{}),owner:'you',settled:true};log(`Settlement founded in ${REGIONS[i][0]}.`);save();render()}
function selectProvince(i){state.selected=i;render()}
function worldCanvas(){const wrap=document.querySelector('.map-wrap');if(!wrap)return;const old=document.querySelector('.map-canvas');if(old)old.remove();const c=document.createElement('canvas');c.width=W;c.height=H;c.className='map-canvas';c.style.transform=`translate(${map.x}px,${map.y}px) scale(${map.z})`;wrap.appendChild(c);const ctx=c.getContext('2d');drawMap(ctx);c.onpointerdown=e=>{if(e.button!==0)return;map.drag=true;map.sx=e.clientX;map.sy=e.clientY;map.ox=map.x;map.oy=map.y;wrap.classList.add('dragging');c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!map.drag)return;map.x=map.ox+(e.clientX-map.sx);map.y=map.oy+(e.clientY-map.sy);c.style.transform=`translate(${map.x}px,${map.y}px) scale(${map.z})`};c.onpointerup=e=>{const moved=Math.abs(e.clientX-map.sx)+Math.abs(e.clientY-map.sy);map.drag=false;wrap.classList.remove('dragging');if(moved<6){const r=c.getBoundingClientRect();const wx=(e.clientX-r.left)/map.z,wy=(e.clientY-r.top)/map.z;const col=Math.floor(wx/CW),row=Math.floor(wy/CH);const i=REGIONS.findIndex(p=>p[3]===col&&p[4]===row);if(i>=0)selectProvince(i)}};wrap.onwheel=e=>{e.preventDefault();const oldz=map.z;map.z=Math.min(1.5,Math.max(.5,map.z*(e.deltaY<0?1.12:.89)));const rr=wrap.getBoundingClientRect();const mx=e.clientX-rr.left,my=e.clientY-rr.top;map.x=mx-(mx-map.x)*(map.z/oldz);map.y=my-(my-map.y)*(map.z/oldz);worldCanvas()};}
function drawMap(ctx){ctx.fillStyle='#6f865e';ctx.fillRect(0,0,W,H);drawTerrain(ctx);drawWater(ctx);drawRoads(ctx);REGIONS.forEach((p,i)=>drawProvince(ctx,p,i));drawWorldArmies(ctx)}
function drawTerrain(ctx){for(let y=0;y<H;y+=50){for(let x=0;x<W;x+=50){const n=Math.sin(x*.017)+Math.cos(y*.021)+Math.sin((x+y)*.009);ctx.fillStyle=n>.9?'#758e62':n<-.8?'#657953':'#6c825c';ctx.fillRect(x,y,50,50)}}}
function drawWater(ctx){ctx.fillStyle='#3f6881';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W,135);ctx.bezierCurveTo(2000,105,1850,180,1630,135);ctx.bezierCurveTo(1400,90,1250,190,1050,145);ctx.bezierCurveTo(800,80,620,175,420,125);ctx.bezierCurveTo(260,90,120,155,0,120);ctx.closePath();ctx.fill();ctx.fillStyle='#456f88';ctx.beginPath();ctx.moveTo(2150,1600);ctx.lineTo(W,1600);ctx.lineTo(W,1000);ctx.bezierCurveTo(2240,1120,2150,1200,2200,1330);ctx.bezierCurveTo(2270,1450,2200,1530,2150,1600);ctx.fill()}
function drawRoads(ctx){ctx.strokeStyle='#9e8f69';ctx.lineWidth=13;ctx.globalAlpha=.75;ctx.beginPath();ctx.moveTo(60,880);ctx.bezierCurveTo(450,790,650,930,980,830);ctx.bezierCurveTo(1290,730,1450,820,1800,700);ctx.bezierCurveTo(2010,630,2180,690,2360,610);ctx.stroke();ctx.beginPath();ctx.moveTo(880,40);ctx.bezierCurveTo(820,280,900,470,840,700);ctx.bezierCurveTo(760,940,850,1140,780,1510);ctx.stroke();ctx.globalAlpha=1}
function drawProvince(ctx,p,i){const x=p[3]*CW,y=p[4]*CH;const o=owner(i);const colors={you:'#356989',north:'#9a5652',south:'#76538f',neutral:'#74805f'};ctx.fillStyle=colors[o]||colors.neutral;ctx.globalAlpha=.18;ctx.fillRect(x+3,y+3,CW-6,CH-6);ctx.globalAlpha=1;ctx.strokeStyle='rgba(40,55,48,.65)';ctx.lineWidth=2;ctx.strokeRect(x+2,y+2,CW-4,CH-4);ctx.fillStyle='#eef2e9';ctx.font='600 16px system-ui';ctx.fillText(p[0],x+14,y+27);ctx.fillStyle='#d7e0d7';ctx.font='12px system-ui';ctx.fillText(p[2],x+14,y+47);if(o!=='neutral')ctx.fillText(o==='you'?'YOU':o.toUpperCase(),x+14,y+65);drawSettlement(ctx,i,x+CW/2,y+CH/2+15);if(state.selected===i){ctx.strokeStyle='#f4d576';ctx.lineWidth=5;ctx.strokeRect(x+6,y+6,CW-12,CH-12)}}
function drawSettlement(ctx,i,cx,cy){if(!provinceSettlement(i))return;const o=owner(i);ctx.fillStyle='#4a3423';ctx.fillRect(cx-34,cy+36,68,12);ctx.fillStyle='#6a4a2e';ctx.fillRect(cx-30,cy+18,60,18);ctx.fillStyle='#b8a07d';ctx.fillRect(cx-25,cy-2,18,19);ctx.fillRect(cx-2,cy-12,22,29);ctx.fillRect(cx+19,cy+4,17,13);ctx.fillStyle='#7e2e28';ctx.beginPath();ctx.moveTo(cx-29,cy-3);ctx.lineTo(cx-16,cy-19);ctx.lineTo(cx-2,cy-3);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(cx-3,cy-13);ctx.lineTo(cx+9,cy-28);ctx.lineTo(cx+22,cy-13);ctx.closePath();ctx.fill();ctx.fillStyle='#d6c7aa';ctx.fillRect(cx-1,cy-7,6,8);ctx.fillStyle='#7b5b38';ctx.fillRect(cx+23,cy+8,5,9);const types=buildingTypes(i);for(let k=0;k<Math.min(types.length,5);k++)drawBuilding(ctx,cx-44+(k%5)*22,cy+50+(k%2)*22,types[k],o)}
function drawBuilding(ctx,x,y,type,o){const fill={house:'#d2bd91',farm:'#91a75f',lumber:'#9d6f44',quarry:'#9ba1a3',iron:'#65707a',oil:'#26282b',mana:'#a78dcc',barracks:'#7c4e46',warehouse:'#80694a',town:'#9c8257'}[type]||'#aaa';ctx.fillStyle=fill;ctx.fillRect(x,y,16,16);ctx.strokeStyle=o==='you'?'#b9dcf2':'#273029';ctx.lineWidth=1.5;ctx.strokeRect(x,y,16,16)}
function drawWorldArmies(ctx){state.worldArmies.forEach(a=>{const p=REGIONS[a.province];if(!p)return;const x=p[3]*CW+CW-38,y=p[4]*CH+26;ctx.fillStyle=a.owner==='you'?'#9fd2f2':'#f29f9f';ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#10171d';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText(fmt(a.size),x,y+3);ctx.textAlign='left'})}
function zoom(delta){map.z=Math.min(1.5,Math.max(.5,map.z*delta));worldCanvas()}
function worldScreen(){const p=REGIONS[state.selected],o=owner(state.selected);return `<div class="world-head"><div class="row"><div><b>World</b><div class="small">Drag to pan · scroll to zoom · click territory</div></div><div style="display:flex;gap:5px"><button onclick="zoom(1.15)">+</button><button onclick="zoom(.87)">−</button><button onclick="centerHome()">Home</button></div></div></div><div class="map-wrap"><div class="zoom"><button onclick="zoom(1.15)">+</button><button onclick="zoom(.87)">−</button></div><div class="map-hint">${fmt(state.worldTick)} ticks</div></div>`}
function centerHome(){map={x:-260,y:-180,z:.75,drag:false,sx:0,sy:0,ox:0,oy:0};worldCanvas()}
function worldRight(){const i=state.selected,p=REGIONS[i],o=owner(i),bcount=provinceBuildingCount(i),army=armyAt(i);return `<div class="card"><b>${p[0]}</b><div class="small" style="margin-top:5px">Owner: ${o==='you'?'You':o==='neutral'?'Neutral':o}</div><div class="small">Resource: ${p[2]}</div></div><div class="card"><b>Settlement</b><div class="small" style="margin-top:6px">${provinceSettlement(i)?`${bcount} visible buildings`:'No settlement'}</div>${o==='you'&&!provinceSettlement(i)?`<button style="margin-top:8px" onclick="settle(${i})">Found Settlement</button>`:''}</div><div class="card"><b>Army</b><div class="small" style="margin-top:6px">${army?`${fmt(army.size)} units`:'None'}</div></div><div class="card"><b>Control</b>${o==='neutral'?`<button style="margin-top:8px" onclick="claim(${i})">Claim</button>`:'<div class="small" style="margin-top:6px">No action</div>'}</div><div class="card"><b>Legend</b><div class="legend"><span><i class="dot" style="background:#356989"></i>You</span><span><i class="dot" style="background:#9a5652"></i>North</span><span><i class="dot" style="background:#76538f"></i>South</span><span><i class="dot" style="background:#74805f"></i>Neutral</span></div></div>`}
function settlementScreen(){const b=state.buildings;return `<main style="overflow:auto"><div class="hero"><div><h1>Settlement</h1><div class="small">Population ${fmt(state.pop)} / ${fmt(state.pcap)}</div></div></div><div class="grid cards">${Object.entries(B).map(([k,v])=>`<div class="building"><div class="row"><b>${v[0]}</b><span class="pill">Lv.${b[k]||0}</span></div><div class="cost">${cost(v[1])}</div><button onclick="build('${k}')">Build</button></div>`).join('')}</div></main>`}
function armyScreen(){return `<main style="overflow:auto"><div class="hero"><div><h1>Army</h1><div class="small">${fmt(armySize())} units · ${fmt(power())} power · ${fmt(state.wounded)} wounded</div></div></div><div class="grid cards">${Object.entries(U).map(([k,u])=>`<div class="unit"><div class="row"><b>${u[0]}</b><span class="pill">${fmt(state.army[k]||0)}</span></div><div class="cost">${cost(Object.fromEntries(Object.entries(u[2]).map(([r,v])=>[r,v*10])))}</div><button onclick="train('${k}',10)">Train 10</button></div>`).join('')}</div></main>`}
function portalScreen(){return `<main style="overflow:auto"><div class="hero"><div><h1>Portal</h1><div class="small">Cooperative PvE map</div></div>${state.portal?'<span class="pill">ACTIVE</span>':'<button onclick="openPortal()">Open Portal</button>'}</div><div class="notice">${state.portal?'Portal state is active.':'No active portal.'}</div></main>`}
function openPortal(){state.portal={active:true};log('Portal opened.');save();render()}
function navScreen(){return `<main style="overflow:auto"><div class="hero"><div><h1>${state.screen==='world'?'World':state.screen[0].toUpperCase()+state.screen.slice(1)}</h1></div></div></main>`}
function render(){document.getElementById('resources').innerHTML=Object.entries(state.res).map(([k,v])=>`<div class="res">${icon(k)} <b>${fmt(v)}</b><span class="small"> / ${fmt(state.cap[k])}</span></div>`).join('');document.getElementById('nav').innerHTML=['world','settlement','army','portal'].map(s=>`<button class="${state.screen===s?'active':''}" onclick="state.screen='${s}';render()">${s==='world'?'World Map':s[0].toUpperCase()+s.slice(1)}</button>`).join('');document.getElementById('stats').innerHTML=`${fmt(state.pop)} / ${fmt(state.pcap)} pop<br>${fmt(armySize())} units<br>${fmt(power())} power<br>${fmt(Object.values(state.world).filter(x=>x?.owner==='you').length+8)} provinces`;const main=document.getElementById('main'),right=document.getElementById('right');if(state.screen==='world'){main.innerHTML=worldScreen();right.innerHTML=worldRight();setTimeout(worldCanvas,0)}else if(state.screen==='settlement'){main.innerHTML=settlementScreen();right.innerHTML='<div class="card"><b>Production</b><div class="small" style="margin-top:7px">'+Object.entries(income()).map(([k,v])=>`${icon(k)} ${fmt(v)}/hr`).join('<br>')+'</div></div>'}else if(state.screen==='army'){main.innerHTML=armyScreen();right.innerHTML='<div class="card"><b>Army</b><div class="small" style="margin-top:7px">Upkeep is paid through Food production.</div></div>'}else{main.innerHTML=portalScreen();right.innerHTML='<div class="card"><b>Portal</b><div class="small" style="margin-top:7px">Portal battles are separate from the world map.</div></div>'}updateClock();debugRender()}
function updateClock(){const mins=state.worldDate;const day=Math.floor(mins/1440)+1;const hour=Math.floor((mins%1440)/60).toString().padStart(2,'0'),m=(mins%60).toString().padStart(2,'0');const left=Math.max(0,60000-(Date.now()-lastTick));document.getElementById('clock').textContent=`Year 1 · Day ${day} · ${hour}:${m} · next tick ${Math.ceil(left/60000)}m`}
function log(s){state.log.unshift(s);state.log=state.log.slice(0,30)}function toast(s){clearTimeout(toastTimer);let d=document.querySelector('.toast');if(!d){d=document.createElement('div');d.className='toast';document.body.appendChild(d)}d.textContent=s;toastTimer=setTimeout(()=>d.remove(),1700)}
function toggleDebug(){debugOpen=!debugOpen;debugRender()}function debugRender(){const d=document.getElementById('debug');d.className='debug'+(debugOpen?' open':'');if(!debugOpen)return;d.innerHTML=`<b>Debug</b><div style="margin:8px 0;display:flex;gap:5px;flex-wrap:wrap"><input id="amt" value="1000"><button onclick="cheatRes()">+ Resources</button><button onclick="cheatArmy()">+ Army</button><button onclick="tick();render()">+ Tick</button><button onclick="advance(60)">+ Hour</button><button onclick="advance(480)">+ 8 Hours</button><button onclick="resetSave()">Reset</button></div><div class="small">World claims and settlements persist locally.</div><div class="log" style="margin-top:8px">${state.log.map(x=>`<div>${x}</div>`).join('')}</div>`}
function cheatRes(){const n=Number(document.getElementById('amt').value)||0;Object.keys(state.res).forEach(k=>state.res[k]=Math.min(state.cap[k],state.res[k]+n));save();render()}function cheatArmy(){const n=Number(document.getElementById('amt').value)||0;state.army.militia+=n;state.pop=Math.min(state.pcap,state.pop+n);save();render()}function advance(mins){for(let i=0;i<Math.ceil(mins/10);i++)tick()}function resetSave(){localStorage.removeItem('attrition-demo');localStorage.removeItem('attrition-demo-v2');location.reload()}
setInterval(()=>{tick()},600000);setInterval(updateClock,1000);render();
</script>
</body>
</html>
