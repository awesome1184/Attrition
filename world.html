<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attrition — World Map</title><style>:root{--bg:#0a0f0d;--panel:#121914;--line:#344138;--text:#e8eee8;--muted:#99a69c;--you:#62afd2;--north:#b7655b;--south:#9271b7;--neutral:#6d795d;--gold:#e3c56d}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}button{font:inherit;color:inherit;background:#1b251e;border:1px solid #415044;border-radius:7px;padding:8px 11px;cursor:pointer}button:hover{background:#26322a}.top{height:58px;display:flex;align-items:center;gap:14px;padding:8px 14px;background:#0b110d;border-bottom:1px solid var(--line);position:relative;z-index:8}.brand{font-size:20px;font-weight:900;letter-spacing:.12em}.muted{font-size:12px;color:var(--muted)}.clock{margin-left:auto;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#141b16}.layout{height:calc(100% - 58px);display:grid;grid-template-columns:190px 1fr 300px}.side{background:#111813;padding:12px;overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.nav button{width:100%;display:block;text-align:left;margin-bottom:6px}.active{background:#213c49;border-color:#73b8d9}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:10px}.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #28322b}.legend{display:grid;gap:6px;margin-top:7px}.legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:#bbc5bb}.dot{width:10px;height:10px;border-radius:3px}.map{position:relative;overflow:hidden;background:#45654d;cursor:grab}.map.dragging{cursor:grabbing}.map canvas{position:absolute;left:0;top:0;transform-origin:0 0}.tools{position:absolute;right:14px;top:14px;z-index:4;display:flex;gap:6px}.tools button{width:38px;padding:7px}.help{position:absolute;left:14px;bottom:14px;background:#111813dd;border:1px solid #536157;border-radius:8px;padding:7px 9px;font-size:11px;z-index:4;pointer-events:none}.selection{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);min-width:300px;max-width:440px;background:#111813ec;border:1px solid #566257;border-radius:10px;padding:10px 12px;z-index:5;box-shadow:0 15px 45px #0008}.selection b{font-size:13px}.event{padding:7px 0;border-bottom:1px solid #28322b;font-size:12px}.pill{font-size:10px;background:#273129;border-radius:4px;padding:3px 6px}.action{width:100%;margin-top:9px}.debug{display:none;position:fixed;right:20px;bottom:20px;width:290px;background:#0d140f;border:1px solid #5d6c60;border-radius:9px;padding:12px;z-index:20;box-shadow:0 20px 50px #0009}@media(max-width:950px){.layout{grid-template-columns:170px 1fr}.right{display:none}}@media(max-width:650px){.layout{display:block}.left{display:none}.top{height:auto;min-height:58px;flex-wrap:wrap}.clock{margin-left:0}.map{height:calc(100vh - 58px)}.selection{min-width:230px}}
</style></head><body><header class="top"><div><div class="brand">ATTRITION</div><div class="muted">World Map</div></div><div id="clock" class="clock"></div><button onclick="location.href='index.html'">Settlement</button><button onclick="toggleDebug()">Debug</button></header><div class="layout"><aside class="side left"><div class="nav"><button class="active">World Map</button><button onclick="location.href='index.html'">Settlement</button></div><div class="card"><b>Your Realm</b><div id="realm" class="muted" style="margin-top:7px"></div></div><div class="card"><b>View</b><div class="muted" style="margin-top:7px">Zoom <span id="zoom">70%</span></div><button class="action" onclick="home()">Center on capital</button></div><div class="card"><b>Owners</b><div class="legend"><span><i class="dot" style="background:var(--you)"></i>You</span><span><i class="dot" style="background:var(--north)"></i>North</span><span><i class="dot" style="background:var(--south)"></i>South</span><span><i class="dot" style="background:var(--neutral)"></i>Neutral</span></div></div></aside><main id="map" class="map"><div class="tools"><button onclick="zoomAt(.88)">−</button><button onclick="zoomAt(1.15)">+</button><button onclick="home()">⌂</button></div><div class="help">Drag to pan · scroll to zoom · click a territory</div><div id="selection" class="selection"></div></main><aside class="side right"><div class="card"><b id="selName">World</b><div id="selInfo" class="muted" style="margin-top:7px"></div><div id="selAction"></div></div><div class="card"><b>World</b><div class="stat"><span>Owned provinces</span><b id="owned">0</b></div><div class="stat"><span>Settlements</span><b id="settled">0</b></div><div class="stat"><span>Armies</span><b id="armies">0</b></div><div class="stat"><span>Claims</span><b id="claims">0</b></div></div><div class="card"><b>Recent Events</b><div id="events"></div></div></aside></div><div id="debug" class="debug"></div><script>
const P=[['Frostmarch','north','Iron',0,0,'town'],['White Pines','north','Wood',1,0,'town'],['Highvale','north','Food',2,0,'town'],['Stonewatch','north','Stone',3,0,'fort'],['Crown Pass','north','Iron',4,0,'fort'],['Red River','north','Food',5,0,'town'],['Ash Coast','neutral','Oil',6,0,'port'],['North Sea','neutral','Food',7,0,''],['Green Fields','neutral','Food',0,1,'village'],['Kings Road','you','Gold',1,1,'capital'],['Silverwood','you','Wood',2,1,'town'],['Ashen Plains','you','Iron',3,1,'fort'],['Ember Coast','you','Oil',4,1,'port'],['Moonfall','south','Mana',5,1,'town'],['Duskmoor','south','Mana',6,1,'fort'],['Violet Reach','south','Food',7,1,'town'],['Blackfen','south','Stone',0,2,'village'],['Starfall','south','Mana',1,2,'town'],['Sun Coast','neutral','Food',2,2,'port'],['Glass Desert','neutral','Oil',3,2,''],['Old Empire','neutral','Iron',4,2,'ruins'],['Crystal Vale','neutral','Mana',5,2,'town'],['Stormlands','neutral','Oil',6,2,'fort'],['Deepwild','neutral','Wood',7,2,'forest'],['Westmarch','neutral','Stone',0,3,'village'],['Pine Ridge','neutral','Wood',1,3,'village'],['Long Meadow','neutral','Food',2,3,'town'],['Ironwood','neutral','Iron',3,3,'town'],['Salt Coast','neutral','Oil',4,3,'port'],['Arda Ruins','neutral','Gold',5,3,'ruins'],['Darkfen','south','Mana',6,3,'fort'],['High Road','south','Stone',7,3,'town']];
const S={tick:0,mins:0,selected:9,claims:3,world:{},armies:[{province:9,size:330,owner:'you'},{province:12,size:80,owner:'you'},{province:3,size:2600,owner:'north'},{province:20,size:1200,owner:'neutral'},{province:14,size:2100,owner:'south'}],events:['World initialized.','Border survey completed.']};
const TW=150,TH=78,OX=1220,OY=80,COLS=4,ROWS=4;let cam={x:-560,y:-80,z:.70,drag:false,sx:0,sy:0,ox:0,oy:0};let selected=9;
function load(){try{const q=JSON.parse(localStorage.getItem('attrition-world-isometric'));if(q)Object.assign(S,q)}catch(e){}}function save(){localStorage.setItem('attrition-world-isometric',JSON.stringify(S))}function owner(i){return S.world[i]?.owner||P[i][1]}function fmt(n){return Math.floor(n).toLocaleString()}function tile(i){const p=P[i],gx=p[3],gy=p[4];return{x:OX+(gx-gy)*TW/2,y:OY+(gx+gy)*TH/2}}function project(i){const t=tile(i);return{x:t.x*cam.z+cam.x,y:t.y*cam.z+cam.y}}function factionColor(o){return o==='you'?'#62afd2':o==='north'?'#b7655b':o==='south'?'#9271b7':'#738062'}
function poly(ctx,pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);pts.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fill();ctx.stroke()}
function diamond(ctx,x,y,w,h){return[[x,y-h/2],[x+w/2,y],[x,y+h/2],[x-w/2,y]]}
function drawWorld(){const old=document.querySelector('canvas');if(old)old.remove();const c=document.createElement('canvas');c.width=3000;c.height=2200;c.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;document.getElementById('map').appendChild(c);const ctx=c.getContext('2d');ctx.fillStyle='#4a7053';ctx.fillRect(0,0,c.width,c.height);ctx.globalAlpha=.28;for(let r=0;r<ROWS;r++)for(let q=0;q<COLS;q++){const n=Math.sin(q*2.3+r*.9)+Math.cos(r*1.7-q*.8);ctx.fillStyle=n>.8?'#86976c':n<-.8?'#637653':'#71855e';poly(ctx,diamond(ctx,OX+(q-r)*TW/2,OY+(q+r)*TH/2,TW-4,TH-4))}ctx.globalAlpha=1;drawWater(ctx);drawRivers(ctx);drawRoads(ctx);for(let i=0;i<P.length;i++)drawProvince(ctx,i);drawArmies(ctx)}
function drawWater(ctx){ctx.fillStyle='#3d687a';poly(ctx,[[0,0],[3000,0],[3000,240],[2700,190],[2450,270],[2100,180],[1750,250],[1400,170],[1050,240],[700,150],[380,225],[0,170]])}
function drawRivers(ctx){ctx.strokeStyle='#4b8ba3';ctx.lineWidth=16;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(420,0);ctx.bezierCurveTo(520,300,700,420,630,700);ctx.bezierCurveTo(540,980,760,1180,690,1640);ctx.stroke();ctx.beginPath();ctx.moveTo(1770,120);ctx.bezierCurveTo(1650,370,1780,540,1690,780);ctx.bezierCurveTo(1560,1050,1700,1320,1600,1800);ctx.stroke()}
function drawRoads(ctx){ctx.strokeStyle='#a38e66';ctx.lineWidth=18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(100,850);ctx.bezierCurveTo(480,760,730,880,1040,770);ctx.bezierCurveTo(1360,650,1620,760,1940,620);ctx.bezierCurveTo(2250,490,2510,560,2860,420);ctx.stroke();ctx.beginPath();ctx.moveTo(1150,80);ctx.bezierCurveTo(1050,360,1170,560,1080,830);ctx.bezierCurveTo(990,1110,1120,1440,1060,1980);ctx.stroke()}
function drawProvince(ctx,i){const p=P[i],t=tile(i),o=owner(i),x=t.x,y=t.y;const d=diamond(ctx,x,y,TW-4,TH-4);ctx.fillStyle=factionColor(o);ctx.globalAlpha=.18;poly(ctx,d);ctx.globalAlpha=1;ctx.strokeStyle=factionColor(o);ctx.lineWidth=3;poly(ctx,d);drawSettlement(ctx,i,x,y+4);ctx.fillStyle='#eff2e9';ctx.font='600 17px system-ui';ctx.fillText(p[0],x-65,y-42);ctx.fillStyle='#d4ded5';ctx.font='11px system-ui';ctx.fillText(p[2],x-65,y-25);if(selected===i){ctx.strokeStyle='#f0cc67';ctx.lineWidth=8;poly(ctx,diamond(ctx,x,y,TW+7,TH+7))}}
function block(ctx,x,y,w,d,h,topColor,sideColor){ctx.fillStyle=sideColor;poly(ctx,[[x,y-h],[x+w/2,y-h-d/2],[x+w/2,y-d/2],[x,y]]);ctx.fillStyle=topColor;poly(ctx,[[x,y-h],[x+w/2,y-h-d/2],[x,y-h-d],[x-w/2,y-h-d/2]])}
function drawSettlement(ctx,i,cx,cy){const p=P[i],type=p[5],o=owner(i);if(!type)return;const accent=o==='you'?'#9fd4e8':o==='north'?'#d59a86':o==='south'?'#c7ace0':'#b3b293';if(type==='forest'){ctx.fillStyle='#274c2e';for(let k=0;k<6;k++){const x=cx-40+k*16,y=cy-6-(k%2)*14;ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.fill()}return}if(type==='ruins'){block(ctx,cx,cy,58,22,20,'#8c897d','#5c5e59');block(ctx,cx-28,cy+11,30,14,14,'#78766d','#53544f');return}if(type==='port'){block(ctx,cx-8,cy+15,70,26,26,'#8d7955','#5c4a35');ctx.fillStyle='#6aa0b1';ctx.fillRect(cx-30,cy+28,80,10)}else if(type==='fort'){block(ctx,cx,cy+6,72,34,46,'#8b8f8a','#555b58');for(let k=-1;k<=1;k++)block(ctx,cx+k*28,cy-17,20,16,35,'#a2a39c','#60625e')}else{block(ctx,cx,cy+9,54,30,type==='capital'?58:35,accent,'#604b35');ctx.fillStyle='#873f36';poly(ctx,[[cx-34,cy-5],[cx,cy-30],[cx+34,cy-5],[cx,cy+7]]);if(type==='capital'){block(ctx,cx+36,cy-8,28,22,65,'#c5b48b','#6b5436');block(ctx,cx-43,cy+1,24,20,52,'#bcae8c','#6b5436')}}for(let k=0;k<4;k++){ctx.fillStyle=['#8d9d60','#9d754c','#757c80','#a58cc0'][k];ctx.fillRect(cx-39+k*23,cy+31,16,10)}}
function drawArmies(ctx){S.armies.forEach(a=>{const q=project(a.province);ctx.fillStyle=a.owner==='you'?'#a5ddf5':a.owner==='north'?'#e7978d':'#c8a5e8';ctx.beginPath();ctx.arc(q.x,q.y-44*cam.z,11/cam.z,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17201a';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(fmt(a.size),q.x,q.y-40*cam.z);ctx.textAlign='left'})}
function pick(clientX,clientY){const r=document.getElementById('map').getBoundingClientRect();const mx=(clientX-r.left-cam.x)/cam.z,my=(clientY-r.top-cam.y)/cam.z;let best=-1,bd=999;for(let i=0;i<P.length;i++){const t=tile(i),d=Math.hypot(t.x-mx,t.y-my);if(d<bd){bd=d;best=i}}if(best>=0&&bd<105) {selected=best;renderSide();drawWorld()}}
function home(){const t=tile(9),m=document.getElementById('map');cam.x=m.clientWidth/2-t.x*cam.z;cam.y=m.clientHeight/2-t.y*cam.z;document.getElementById('zoom').textContent=Math.round(cam.z*100)+'%';drawWorld()}
function zoomAt(f){const m=document.getElementById('map'),old=cam.z;cam.z=Math.min(1.35,Math.max(.48,cam.z*f));const r=m.getBoundingClientRect(),mx=innerWidth/2-r.left,my=innerHeight/2-r.top;cam.x=mx-(mx-cam.x)*(cam.z/old);cam.y=my-(my-cam.y)*(cam.z/old);document.getElementById('zoom').textContent=Math.round(cam.z*100)+'%';drawWorld()}
function renderSide(){const p=P[selected],o=owner(selected),a=S.armies.find(q=>q.province===selected);document.getElementById('selName').textContent=p[0];document.getElementById('selInfo').innerHTML=`<div>Owner: <b>${o==='you'?'You':o==='neutral'?'Neutral':o==='north'?'North':'South'}</b></div><div style="margin-top:5px">Resource: <b>${p[2]}</b></div><div style="margin-top:5px">Settlement: <b>${p[5]?p[5]:'none'}</b></div>${a?`<div style="margin-top:5px">Army: <b>${fmt(a.size)}</b></div>`:''}`;document.getElementById('selAction').innerHTML=o==='neutral'?`<button class="action" onclick="claim()">Claim province</button>`:'';const owned=P.filter((_,i)=>owner(i)==='you').length;document.getElementById('owned').textContent=owned;document.getElementById('settled').textContent=P.filter((p,i)=>p[5]||owner(i)==='you').length;document.getElementById('armies').textContent=S.armies.length;document.getElementById('claims').textContent=S.claims;document.getElementById('realm').innerHTML=`Provinces: <b>${owned}</b><br>Claims: <b>${S.claims}</b>`;document.getElementById('events').innerHTML=S.events.slice(0,7).map(e=>`<div class="event">${e}</div>`).join('');document.getElementById('selection').innerHTML=`<b>${p[0]}</b> <span class="pill">${p[2]}</span>`}
function claim(){if(owner(selected)!=='neutral')return;if(S.claims<1)return toast('No claims');S.world[selected]={owner:'you'};S.claims--;S.events.unshift(`Claimed ${P[selected][0]}.`);save();renderSide();drawWorld()}
function toast(s){const d=document.createElement('div');d.textContent=s;Object.assign(d.style,{position:'fixed',left:'50%',bottom:'18px',transform:'translateX(-50%)',padding:'8px 12px',background:'#111813',border:'1px solid #617063',borderRadius:'7px',zIndex:40});document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}
function debug(){const d=document.getElementById('debug');d.style.display=d.style.display==='block'?'none':'block';d.innerHTML=`<b>Debug</b><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px"><button onclick="S.mins+=10;S.tick++;save();clock()">+ Tick</button><button onclick="S.claims+=5;save();renderSide()">+5 Claims</button><button onclick="S.armies.push({province:9,size:100,owner:'you'});save();renderSide();drawWorld()">+ Army</button><button onclick="localStorage.removeItem('attrition-world-isometric');location.reload()">Reset</button></div>`}function toggleDebug(){debug()}
function clock(){const m=S.mins,day=Math.floor(m/1440)+1,h=String(Math.floor((m%1440)/60)).padStart(2,'0'),mm=String(m%60).padStart(2,'0');document.getElementById('clock').textContent=`Year 1 · Day ${day} · ${h}:${mm}`}
load();renderSide();clock();requestAnimationFrame(home);const mapEl=document.getElementById('map');mapEl.addEventListener('pointerdown',e=>{if(e.button!==0)return;cam.drag=true;cam.sx=e.clientX;cam.sy=e.clientY;cam.ox=cam.x;cam.oy=cam.y;mapEl.classList.add('dragging');mapEl.setPointerCapture(e.pointerId)});mapEl.addEventListener('pointermove',e=>{if(!cam.drag)return;cam.x=cam.ox+e.clientX-cam.sx;cam.y=cam.oy+e.clientY-cam.sy;drawWorld()});mapEl.addEventListener('pointerup',e=>{if(!cam.drag)return;const d=Math.hypot(e.clientX-cam.sx,e.clientY-cam.sy);cam.drag=false;mapEl.classList.remove('dragging');if(d<6)pick(e.clientX,e.clientY)});mapEl.addEventListener('wheel',e=>{e.preventDefault();const old=cam.z,r=mapEl.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;cam.z=Math.min(1.35,Math.max(.48,cam.z*(e.deltaY<0?1.1:.91)));cam.x=mx-(mx-cam.x)*(cam.z/old);cam.y=my-(my-cam.y)*(cam.z/old);document.getElementById('zoom').textContent=Math.round(cam.z*100)+'%';drawWorld()},{passive:false});window.addEventListener('resize',drawWorld);setInterval(()=>{S.tick++;S.mins+=10;save();clock()},600000);
</script></body></html>
