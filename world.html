<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attrition</title>
<style>
:root{--bg:#0a0f0d;--line:#344138;--text:#e8eee8;--muted:#99a69c;--you:#62afd2;--north:#b7655b;--south:#9271b7;--neutral:#72815d;--gold:#e3c56d}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
button{font:inherit;color:inherit;background:#1b251e;border:1px solid #415044;border-radius:7px;padding:8px 11px;cursor:pointer}button:hover{background:#26322a}
.top{height:54px;display:flex;align-items:center;gap:8px;padding:7px 10px;background:#0b110d;border-bottom:1px solid var(--line);position:relative;z-index:8}.brand{font-weight:900;letter-spacing:.12em;font-size:18px}.clock{margin-left:auto;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#141b16;font-size:12px}
.map{position:relative;width:100%;height:calc(100% - 54px);overflow:hidden;background:#45654d;cursor:grab}.map.dragging{cursor:grabbing}.map canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.tools{position:absolute;right:12px;top:12px;z-index:4;display:flex;gap:5px}.tools button{width:36px;padding:7px}.help{position:absolute;left:12px;bottom:12px;background:#111813dd;border:1px solid #536157;border-radius:8px;padding:6px 8px;font-size:11px;color:#dbe3da;z-index:4;pointer-events:none}
.selection{display:none;position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(420px,calc(100% - 24px));background:#111813f2;border:1px solid #566257;border-radius:10px;padding:11px 13px;z-index:6;box-shadow:0 15px 45px #0008}.selection.open{display:block}.selection .head{display:flex;justify-content:space-between;align-items:center;gap:10px}.selection .name{font-weight:800;font-size:15px}.selection .close{background:transparent;border:0;padding:2px 6px}.grid{display:grid;gap:7px}.stat{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #28322b}.action{width:100%;margin-top:9px}.debug{display:none;position:fixed;right:16px;bottom:16px;width:280px;background:#0d140f;border:1px solid #5d6c60;border-radius:9px;padding:11px;z-index:20;box-shadow:0 20px 50px #0009}.debug.open{display:block}.debug input{width:75px;background:#111913;color:inherit;border:1px solid var(--line);border-radius:5px;padding:5px}
@media(max-width:650px){.top{height:auto;min-height:54px;flex-wrap:wrap}.clock{margin-left:0}.map{height:calc(100vh - 54px)}.help{font-size:10px}}
</style>
</head>
<body>
<header class="top"><div class="brand">ATTRITION</div><div id="clock" class="clock"></div><button onclick="location.href='index.html'">Settlement</button><button onclick="toggleDebug()">Debug</button></header>
<main id="map" class="map"><div class="tools"><button onclick="zoomAt(.88)">−</button><button onclick="zoomAt(1.15)">+</button><button onclick="home()">⌂</button></div><div class="help">Drag to pan · scroll to zoom · click a territory</div><div id="selection" class="selection"></div></main>
<div id="debug" class="debug"></div>
<script>
const P=[
['Frostmarch','north','Iron',0,0,'town'],['White Pines','north','Wood',1,0,'town'],['Highvale','north','Food',2,0,'town'],['Stonewatch','north','Stone',3,0,'fort'],['Crown Pass','north','Iron',4,0,'fort'],['Red River','north','Food',5,0,'town'],['Ash Coast','neutral','Oil',6,0,'port'],['North Sea','neutral','Food',7,0,''],
['Green Fields','neutral','Food',0,1,'village'],['Kings Road','you','Gold',1,1,'capital'],['Silverwood','you','Wood',2,1,'town'],['Ashen Plains','you','Iron',3,1,'fort'],['Ember Coast','you','Oil',4,1,'port'],['Moonfall','south','Mana',5,1,'town'],['Duskmoor','south','Mana',6,1,'fort'],['Violet Reach','south','Food',7,1,'town'],
['Blackfen','south','Stone',0,2,'village'],['Starfall','south','Mana',1,2,'town'],['Sun Coast','neutral','Food',2,2,'port'],['Glass Desert','neutral','Oil',3,2,''],['Old Empire','neutral','Iron',4,2,'ruins'],['Crystal Vale','neutral','Mana',5,2,'town'],['Stormlands','neutral','Oil',6,2,'fort'],['Deepwild','neutral','Wood',7,2,'forest'],
['Westmarch','neutral','Stone',0,3,'village'],['Pine Ridge','neutral','Wood',1,3,'village'],['Long Meadow','neutral','Food',2,3,'town'],['Ironwood','neutral','Iron',3,3,'town'],['Salt Coast','neutral','Oil',4,3,'port'],['Arda Ruins','neutral','Gold',5,3,'ruins'],['Darkfen','south','Mana',6,3,'fort'],['High Road','south','Stone',7,3,'town']
];
const S={tick:0,mins:0,selected:null,claims:3,world:{},armies:[{province:9,size:330,owner:'you'},{province:12,size:80,owner:'you'},{province:3,size:2600,owner:'north'},{province:20,size:1200,owner:'neutral'},{province:14,size:2100,owner:'south'}],events:[]};
const TW=150,TH=78,OX=1220,OY=75;let cam={x:-560,y:-80,z:.70,drag:false,sx:0,sy:0,ox:0,oy:0};let lastTick=Date.now(),debugOpen=false;
function load(){try{const q=JSON.parse(localStorage.getItem('attrition-world-isometric'));if(q)Object.assign(S,q)}catch(e){}}function save(){localStorage.setItem('attrition-world-isometric',JSON.stringify(S))}function owner(i){return S.world[i]?.owner||P[i][1]}function fmt(n){return Math.floor(n).toLocaleString()}
function tile(i){const p=P[i];return{x:OX+(p[3]-p[4])*TW/2,y:OY+(p[3]+p[4])*TH/2}}
function factionColor(o){return o==='you'?'#62afd2':o==='north'?'#b7655b':o==='south'?'#9271b7':'#72815d'}
function poly(ctx,pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);pts.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fill();ctx.stroke()}
function diamond(x,y,w,h){return[[x,y-h/2],[x+w/2,y],[x,y+h/2],[x-w/2,y]]}
function block(ctx,x,y,w,d,h,top,side){ctx.fillStyle=side;poly(ctx,[[x,y-h],[x+w/2,y-h-d/2],[x+w/2,y-d/2],[x,y]]);ctx.fillStyle=top;poly(ctx,[[x,y-h],[x+w/2,y-h-d/2],[x,y-h-d],[x-w/2,y-h-d/2]])}
function drawWater(ctx){ctx.fillStyle='#3d687a';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(3000,0);ctx.lineTo(3000,240);ctx.lineTo(2720,205);ctx.bezierCurveTo(2450,285,2250,185,1980,240);ctx.bezierCurveTo(1700,295,1520,165,1260,225);ctx.bezierCurveTo(1000,285,770,165,520,235);ctx.bezierCurveTo(300,285,160,190,0,205);ctx.closePath();ctx.fill()}
function drawRivers(ctx){ctx.strokeStyle='#4c8ea7';ctx.lineWidth=16;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(430,0);ctx.bezierCurveTo(520,300,700,420,630,700);ctx.bezierCurveTo(540,980,760,1180,690,1640);ctx.stroke();ctx.beginPath();ctx.moveTo(1770,120);ctx.bezierCurveTo(1650,370,1780,540,1690,780);ctx.bezierCurveTo(1560,1050,1700,1320,1600,1800);ctx.stroke()}
function drawRoads(ctx){ctx.strokeStyle='#a38e66';ctx.lineWidth=18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(100,850);ctx.bezierCurveTo(480,760,730,880,1040,770);ctx.bezierCurveTo(1360,650,1620,760,1940,620);ctx.bezierCurveTo(2250,490,2510,560,2860,420);ctx.stroke();ctx.beginPath();ctx.moveTo(1150,80);ctx.bezierCurveTo(1050,360,1170,560,1080,830);ctx.bezierCurveTo(990,1110,1120,1440,1060,1980);ctx.stroke()}
function drawSettlement(ctx,i,x,y){const type=P[i][5],o=owner(i);if(!type)return;const accent=o==='you'?'#9fd4e8':o==='north'?'#d59a86':o==='south'?'#c7ace0':'#b3b293';if(type==='forest'){ctx.fillStyle='#274c2e';for(let k=0;k<7;k++){const px=x-45+k*15,py=y-5-(k%2)*14;ctx.beginPath();ctx.arc(px,py,18,0,Math.PI*2);ctx.fill()}return}if(type==='ruins'){block(ctx,x,y,58,22,20,'#8c897d','#5c5e59');block(ctx,x-28,y+11,30,14,14,'#78766d','#53544f');return}if(type==='port'){block(ctx,x-8,y+15,70,26,26,'#8d7955','#5c4a35');ctx.fillStyle='#6aa0b1';ctx.fillRect(x-32,y+28,84,10)}else if(type==='fort'){block(ctx,x,y+6,72,34,46,'#8b8f8a','#555b58');for(let k=-1;k<=1;k++)block(ctx,x+k*28,y-17,20,16,35,'#a2a39c','#60625e')}else{block(ctx,x,y+9,54,30,type==='capital'?58:35,accent,'#604b35');ctx.fillStyle='#873f36';poly(ctx,[[x-34,y-5],[x,y-30],[x+34,y-5],[x,y+7]]);if(type==='capital'){block(ctx,x+36,y-8,28,22,65,'#c5b48b','#6b5436');block(ctx,x-43,y+1,24,20,52,'#bcae8c','#6b5436')}}for(let k=0;k<4;k++){ctx.fillStyle=['#8d9d60','#9d754c','#757c80','#a58cc0'][k];ctx.fillRect(x-39+k*23,y+31,16,10)}}
function drawArmy(ctx,a){const t=tile(a.province),x=t.x+47,y=t.y-36;ctx.fillStyle=a.owner==='you'?'#a5ddf5':a.owner==='north'?'#e7978d':a.owner==='south'?'#c8a5e8':'#d5c27c';ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17201a';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(fmt(a.size),x,y+4);ctx.textAlign='left'}
function drawWorld(){const old=map.querySelector('canvas');if(old)old.remove();const c=document.createElement('canvas');c.width=3000;c.height=2200;c.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;map.appendChild(c);const ctx=c.getContext('2d');ctx.fillStyle='#4a7053';ctx.fillRect(0,0,c.width,c.height);ctx.globalAlpha=.28;for(let r=0;r<4;r++)for(let q=0;q<8;q++){const n=Math.sin(q*2.3+r*.9)+Math.cos(r*1.7-q*.8);ctx.fillStyle=n>.8?'#86976c':n<-.8?'#637653':'#71855e';poly(ctx,diamond(OX+(q-r)*TW/2,OY+(q+r)*TH/2,TW-4,TH-4))}ctx.globalAlpha=1;drawWater(ctx);drawRivers(ctx);drawRoads(ctx);for(let i=0;i<P.length;i++){const t=tile(i),o=owner(i);ctx.fillStyle=factionColor(o);ctx.globalAlpha=.16;poly(ctx,diamond(t.x,t.y,TW-4,TH-4));ctx.globalAlpha=1;ctx.strokeStyle=factionColor(o);ctx.lineWidth=2.5;poly(ctx,diamond(t.x,t.y,TW-4,TH-4));drawSettlement(ctx,i,t.x,t.y+4);if(S.selected===i){ctx.strokeStyle='#f0cc67';ctx.lineWidth=8;poly(ctx,diamond(t.x,t.y,TW+8,TH+8))}}S.armies.forEach(a=>drawArmy(ctx,a));
 c.onpointerdown=e=>{if(e.button!==0)return;cam.drag=true;cam.sx=e.clientX;cam.sy=e.clientY;cam.ox=cam.x;cam.oy=cam.y;map.classList.add('dragging');c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!cam.drag)return;cam.x=cam.ox+(e.clientX-cam.sx);cam.y=cam.oy+(e.clientY-cam.sy);c.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`};c.onpointerup=e=>{const moved=Math.abs(e.clientX-cam.sx)+Math.abs(e.clientY-cam.sy);cam.drag=false;map.classList.remove('dragging');if(moved<6){const rr=map.getBoundingClientRect(),wx=(e.clientX-rr.left-cam.x)/cam.z,wy=(e.clientY-rr.top-cam.y)/cam.z;let hit=null,best=99999;for(let i=0;i<P.length;i++){const t=tile(i),score=Math.abs(wx-t.x)/(TW/2)+Math.abs(wy-t.y)/(TH/2);if(score<1&&score<best){best=score;hit=i}}if(hit!==null)select(hit)}};c.onpointercancel=()=>{cam.drag=false;map.classList.remove('dragging')};map.onwheel=e=>{e.preventDefault();const oldz=cam.z;cam.z=Math.min(1.45,Math.max(.5,cam.z*(e.deltaY<0?1.1:.9)));const rr=map.getBoundingClientRect(),mx=e.clientX-rr.left,my=e.clientY-rr.top;cam.x=mx-(mx-cam.x)*(cam.z/oldz);cam.y=my-(my-cam.y)*(cam.z/oldz);drawWorld()};document.getElementById('selection').className='selection'+(S.selected!==null?' open':'') ;renderSelection();}
function select(i){S.selected=i;save();drawWorld()}
function closeSelection(){S.selected=null;save();drawWorld()}
function renderSelection(){const el=document.getElementById('selection');if(S.selected===null){el.className='selection';return}const p=P[S.selected],o=owner(S.selected),army=S.armies.find(a=>a.province===S.selected);el.className='selection open';el.innerHTML=`<div class="head"><div class="name">${p[0]}</div><button class="close" onclick="closeSelection()">✕</button></div><div class="grid" style="margin-top:8px"><div class="stat"><span>Owner</span><b>${o==='you'?'You':o==='neutral'?'Neutral':o==='north'?'North':'South'}</b></div><div class="stat"><span>Resource</span><b>${p[2]}</b></div><div class="stat"><span>Settlement</span><b>${p[5]?p[5][0].toUpperCase()+p[5].slice(1):'None'}</b></div><div class="stat"><span>Army</span><b>${army?fmt(army.size):'None'}</b></div></div>${o==='neutral'?`<button class="action" onclick="claim(${S.selected})">Claim</button>`:''}`}
function claim(i){if(owner(i)!=='neutral'||S.claims<=0)return;S.world[i]={owner:'you'};S.claims--;save();drawWorld()}
function home(){cam={x:-560,y:-80,z:.70,drag:false,sx:0,sy:0,ox:0,oy:0};drawWorld()}
function zoomAt(f){const rr=map.getBoundingClientRect(),mx=rr.width/2,my=rr.height/2,oldz=cam.z;cam.z=Math.min(1.45,Math.max(.5,cam.z*f));cam.x=mx-(mx-cam.x)*(cam.z/oldz);cam.y=my-(my-cam.y)*(cam.z/oldz);drawWorld()}
function tick(){S.tick++;S.mins+=10;lastTick=Date.now();save();updateClock()}
function updateClock(){const m=S.mins,d=Math.floor(m/1440)+1,r=m%1440,h=String(Math.floor(r/60)).padStart(2,'0'),mm=String(r%60).padStart(2,'0');document.getElementById('clock').textContent=`Day ${d} · ${h}:${mm}`}
function toggleDebug(){debugOpen=!debugOpen;const d=document.getElementById('debug');d.className='debug'+(debugOpen?' open':'');if(!debugOpen)return;d.innerHTML=`<b>Debug</b><div style="margin:8px 0;display:flex;gap:5px;flex-wrap:wrap"><input id="ticks" type="number" value="1" min="1"><button onclick="advance(Math.max(1,+ticks.value||1))">Ticks</button><button onclick="advance(6)">1h</button><button onclick="advance(48)">8h</button><button onclick="resetWorld()">Reset</button></div>`}
function advance(n){for(let i=0;i<n;i++)tick();drawWorld()}function resetWorld(){localStorage.removeItem('attrition-world-isometric');location.reload()}
load();updateClock();drawWorld();setInterval(tick,600000);setInterval(updateClock,1000);
</script>
</body>
</html>
