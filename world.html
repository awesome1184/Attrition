<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attrition — World Map</title><style>:root{--bg:#101713;--ink:#e8eee5;--muted:#9ba79d;--panel:#151d18;--line:#344138;--water:#355f70;--land:#7b8b62;--road:#9f8d63;--you:#72b6d7;--north:#b46b61;--south:#9b79bd;--gold:#e0c36b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif}button{font:inherit;color:inherit;background:#1b251f;border:1px solid #415045;border-radius:7px;padding:8px 11px;cursor:pointer}button:hover{background:#26332b}.top{height:58px;display:flex;align-items:center;gap:15px;padding:8px 14px;background:#0c110e;border-bottom:1px solid var(--line);position:relative;z-index:5}.brand{font-weight:900;letter-spacing:.12em;font-size:20px}.clock{margin-left:auto;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#141b16}.layout{height:calc(100% - 58px);display:grid;grid-template-columns:190px 1fr 310px}.side{background:#111813;overflow:auto;padding:12px}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:10px}.muted{color:var(--muted);font-size:12px}.nav button{width:100%;display:block;text-align:left;margin-bottom:6px}.active{background:#213c49;border-color:#73b8d9}.map{position:relative;overflow:hidden;background:#52735a;cursor:grab}.map.dragging{cursor:grabbing}.map canvas{position:absolute;left:0;top:0;transform-origin:0 0}.tools{position:absolute;right:14px;top:14px;display:flex;gap:6px;z-index:3}.tools button{width:38px;padding:7px}.help{position:absolute;left:14px;bottom:14px;background:#121914d9;border:1px solid #506055;border-radius:8px;padding:7px 9px;font-size:11px;color:#dbe3da;pointer-events:none}.selection{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);min-width:300px;max-width:430px;background:#111813ef;border:1px solid #526156;border-radius:10px;padding:10px 12px;z-index:4;box-shadow:0 15px 45px #0008}.selection .title{font-weight:800}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.legend{display:flex;flex-wrap:wrap;gap:7px}.legend span{font-size:11px;color:#bbc5bc;display:flex;align-items:center;gap:4px}.dot{width:10px;height:10px;border-radius:3px;display:inline-block}.mini{height:90px;background:#0c120f;border:1px solid var(--line);border-radius:7px;position:relative;overflow:hidden}.event{padding:7px 0;border-bottom:1px solid #28322b;font-size:12px}.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #28322b}.resource{margin-top:7px;color:#cbd3ca}.pill{font-size:10px;padding:3px 6px;border-radius:4px;background:#273229;color:#c7d1c7}@media(max-width:950px){.layout{grid-template-columns:170px 1fr}.right{display:none}}@media(max-width:650px){.layout{display:block}.left{display:none}.map{height:calc(100% - 0px)}.selection{min-width:230px}.brand{font-size:16px}.clock{font-size:11px}}</style></head><body><header class="top"><div><div class="brand">ATTRITION</div><div class="muted">World</div></div><div id="clock" class="clock"></div><button onclick="location.href='index.html'">Settlement</button><button onclick="toggleDebug()">Debug</button></header><div class="layout"><aside class="side left"><div class="nav"><button class="active">World Map</button><button onclick="location.href='index.html'">Settlement</button></div><div class="card"><b>Your Realm</b><div class="muted" id="realm" style="margin-top:7px"></div></div><div class="card"><b>Map</b><div class="legend" style="margin-top:8px"><span><i class="dot" style="background:var(--you)"></i>You</span><span><i class="dot" style="background:var(--north)"></i>North</span><span><i class="dot" style="background:var(--south)"></i>South</span><span><i class="dot" style="background:#74815d"></i>Neutral</span></div></div><div class="card"><b>View</b><div class="muted" style="margin-top:7px">Zoom <span id="zoomLabel">75%</span></div><button style="margin-top:8px;width:100%" onclick="centerMap()">Center on realm</button></div></aside><main id="map" class="map"><div class="tools"><button onclick="zoomAt(.88)">−</button><button onclick="zoomAt(1.15)">+</button><button onclick="centerMap()">⌂</button></div><div class="help">Drag to pan · wheel to zoom · click territory</div><div id="selection" class="selection"></div></main><aside class="side right"><div class="card"><b id="selName">World</b><div id="selInfo" class="muted" style="margin-top:7px">Select a province.</div><div id="selAction"></div></div><div class="card"><b>World Status</b><div class="stat"><span>Owned</span><b id="owned">0</b></div><div class="stat"><span>Settlements</span><b id="settlements">0</b></div><div class="stat"><span>Armies</span><b id="armies">0</b></div><div class="stat"><span>Claims</span><b id="claims">0</b></div></div><div class="card"><b>Recent Events</b><div id="events" style="margin-top:4px"></div></div></aside></div><div id="debug" style="display:none;position:fixed;right:20px;bottom:20px;width:300px;background:#0d130f;border:1px solid #607064;border-radius:9px;padding:12px;z-index:20;box-shadow:0 20px 50px #0009"></div><script>const cols=['#81936a','#77885f','#84976c','#70835b'];const terrain=['plains','forest','hills','farmland'];const R=[['Frostmarch','north','Iron',0,0,'settle'],['White Pines','north','Wood',1,0,'settle'],['Highvale','north','Food',2,0,'settle'],['Stonewatch','north','Stone',3,0,'fort'],['Crown Pass','north','Iron',4,0,'fort'],['Red River','north','Food',5,0,'settle'],['Ash Coast','neutral','Oil',6,0,'port'],['North Sea','neutral','Food',7,0,''],['Green Fields','neutral','Food',0,1,'village'],['Kings Road','you','Gold',1,1,'capital'],['Silverwood','you','Wood',2,1,'settle'],['Ashen Plains','you','Iron',3,1,'fort'],['Ember Coast','you','Oil',4,1,'port'],['Moonfall','south','Mana',5,1,'settle'],['Duskmoor','south','Mana',6,1,'fort'],['Violet Reach','south','Food',7,1,'settle'],['Blackfen','south','Stone',0,2,'village'],['Starfall','south','Mana',1,2,'settle'],['Sun Coast','neutral','Food',2,2,'port'],['Glass Desert','neutral','Oil',3,2,''],['Old Empire','neutral','Iron',4,2,'ruins'],['Crystal Vale','neutral','Mana',5,2,'settle'],['Stormlands','neutral','Oil',6,2,'fort'],['Deepwild','neutral','Wood',7,2,'forest'],['Westmarch','neutral','Stone',0,3,'village'],['Pine Ridge','neutral','Wood',1,3,'village'],['Long Meadow','neutral','Food',2,3,'settle'],['Ironwood','neutral','Iron',3,3,'settle'],['Salt Coast','neutral','Oil',4,3,'port'],['Arda Ruins','neutral','Gold',5,3,'ruins'],['Darkfen','south','Mana',6,3,'fort'],['High Road','south','Stone',7,3,'settle']];const W=2400,H=1800,T=300,ST={tick:0,mins:0,selected:9,claims:3,world:{},armies:[{province:9,size:330,owner:'you'},{province:12,size:80,owner:'you'},{province:3,size:2600,owner:'north'},{province:20,size:1200,owner:'neutral'},{province:14,size:2100,owner:'south'}],events:['World initialized.','Border survey completed.']};let cam={x:-360,y:-230,z:.75,drag:false,sx:0,sy:0,ox:0,oy:0};let selected=9;function load(){try{const d=JSON.parse(localStorage.getItem('attrition-world-v2'));if(d)Object.assign(ST,d)}catch(e){}}function save(){localStorage.setItem('attrition-world-v2',JSON.stringify(ST))}function owner(i){return ST.world[i]?.owner||R[i][1]}function settled(i){return R[i][5]||owner(i)==='you'}function nameOwner(o){return o==='you'?'You':o==='neutral'?'Neutral':o==='north'?'North':'South'}function fmt(n){return Math.floor(n).toLocaleString()}function point(i){return{x:R[i][3]*T+150,y:R[i][4]*T+150}}function screenPoint(wx,wy){return{x:wx*cam.z+cam.x,y:wy*cam.z+cam.y}}function draw(){const old=document.querySelector('canvas');if(old)old.remove();const c=document.createElement('canvas');c.width=W;c.height=H;c.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;document.getElementById('map').appendChild(c);const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.fillStyle='#466f52';x.fillRect(0,0,W,H);for(let r=0;r<H/T;r++)for(let col=0;col<W/T;col++){const n=Math.sin(col*2.1+r*.7)+Math.cos(col*.63-r*1.3)+Math.sin((col+r)*1.7);x.fillStyle=n>.8?cols[1]:n<-.8?cols[3]:cols[(col+r)%cols.length];x.fillRect(col*T,r*T,T,T)}drawCoast(x);drawRivers(x);drawRoads(x);R.forEach((p,i)=>drawRegion(x,p,i));drawArmies(x);}
function drawCoast(x){x.fillStyle='#355f72';x.beginPath();x.moveTo(0,0);x.lineTo(W,0);x.lineTo(W,105);x.bezierCurveTo(2050,120,1830,210,1600,135);x.bezierCurveTo(1350,80,1160,200,900,125);x.bezierCurveTo(620,60,400,170,0,125);x.closePath();x.fill();x.beginPath();x.moveTo(W,H);x.lineTo(W-210,H);x.bezierCurveTo(2100,1540,2200,1400,2140,1260);x.bezierCurveTo(2090,1130,2200,1020,W,970);x.lineTo(W,H);x.fill()}
function drawRivers(x){x.strokeStyle='#4d88a0';x.lineWidth=12;x.lineCap='round';[['M',[]]].forEach(()=>{});x.beginPath();x.moveTo(180,0);x.bezierCurveTo(250,280,420,380,360,620);x.bezierCurveTo(290,850,480,930,420,1220);x.bezierCurveTo(380,1410,500,1550,560,H);x.stroke();x.beginPath();x.moveTo(1280,0);x.bezierCurveTo(1200,220,1310,350,1240,560);x.bezierCurveTo(1180,760,1050,900,1110,1120);x.bezierCurveTo(1180,1320,1050,1500,1120,H);x.stroke()}
function drawRoads(x){x.strokeStyle='#a28f67';x.lineWidth=16;x.lineCap='round';x.beginPath();x.moveTo(80,720);x.bezierCurveTo(400,650,650,780,900,690);x.bezierCurveTo(1200,570,1460,690,1780,560);x.bezierCurveTo(2060,450,2200,520,2380,470);x.stroke();x.beginPath();x.moveTo(650,30);x.bezierCurveTo(700,300,620,500,700,720);x.bezierCurveTo(780,940,700,1210,760,1540);x.stroke()}
function drawRegion(x,p,i){const px=p[3]*T,py=p[4]*T,o=owner(i);const border=o==='you'?'#70b4d2':o==='north'?'#a85d55':o==='south'?'#8e69b0':'#65745a';x.strokeStyle=border;x.lineWidth=6;x.globalAlpha=.55;x.strokeRect(px+3,py+3,T-6,T-6);x.globalAlpha=1;if(i%2===0){x.fillStyle='rgba(255,255,255,.035)';x.fillRect(px+4,py+4,T-8,T-8)}drawSettlement(x,i,px+T/2,py+T/2+28);x.fillStyle='#f0f2e9';x.font='600 17px system-ui';x.fillText(p[0],px+14,py+29);x.fillStyle='#d8e0d4';x.font='12px system-ui';x.fillText(nameOwner(o),px+14,py+49);x.fillText(p[2],px+14,py+67);if(selected===i){x.strokeStyle='#f0cd68';x.lineWidth=8;x.strokeRect(px+8,py+8,T-16,T-16)}}
function drawSettlement(x,i,cx,cy){if(!settled(i))return;const o=owner(i);x.fillStyle='#4f3926';x.fillRect(cx-58,cy+45,116,15);x.fillStyle='#6e5438';x.fillRect(cx-52,cy+18,104,30);house(x,cx-42,cy-20,42,35,o);house(x,cx+3,cy-5,42,35,o);if(R[i][5]==='fort')tower(x,cx-66,cy+16,o);if(R[i][5]==='capital'){tower(x,cx+49,cy-2,o);tower(x,cx-68,cy-2,o);house(x,cx-22,cy-48,48,38,o)}for(let k=0;k<4;k++){x.fillStyle=['#8f9f63','#a77b4c','#6d7478','#a88fc0'][k%4];x.fillRect(cx-44+k*24,cy+54,17,17);}}
function house(x,a,b,w,h,o){x.fillStyle=o==='you'?'#d4c6a0':o==='north'?'#c69c86':o==='south'?'#b6a0ce':'#b1aa92';x.fillRect(a,b,w,h);x.fillStyle=o==='you'?'#6d4a3a':'#713c37';x.beginPath();x.moveTo(a-4,b);x.lineTo(a+w/2,b-19);x.lineTo(a+w+4,b);x.closePath();x.fill();x.fillStyle='#3f2d23';x.fillRect(a+w*.43,b+h*.52,8,h*.48)}
function tower(x,a,b,o){x.fillStyle=o==='you'?'#9fb9c5':'#8d8f88';x.fillRect(a,b,18,34);x.fillStyle='#8a463b';x.fillRect(a-2,b,22,6)}
function drawArmies(x){ST.armies.forEach(a=>{const p=point(a.province);x.fillStyle=a.owner==='you'?'#8ed2ef':a.owner==='north'?'#e58e84':'#c39ee7';x.beginPath();x.arc(p.x,p.y-70,16,0,Math.PI*2);x.fill();x.fillStyle='#18201b';x.font='bold 11px system-ui';x.textAlign='center';x.fillText(fmt(a.size),p.x,p.y-66);x.textAlign='left'})}
function selectAt(wx,wy){const col=Math.floor(wx/T),row=Math.floor(wy/T);const i=R.findIndex(p=>p[3]===col&&p[4]===row);if(i>=0){selected=i;renderSide();draw()}}
function fitPoint(i){const p=point(i),wrap=document.getElementById('map');cam.x=wrap.clientWidth/2-p.x*cam.z;cam.y=wrap.clientHeight/2-p.y*cam.z;draw()}
function centerMap(){cam={x:0,y:0,z:.75,drag:false,sx:0,sy:0,ox:0,oy:0};fitPoint(9);document.getElementById('zoomLabel').textContent=Math.round(cam.z*100)+'%'}
function zoomAt(f){const wrap=document.getElementById('map'),old=cam.z;cam.z=Math.min(1.45,Math.max(.45,cam.z*f));cam.x=wrap.clientWidth/2-(wrap.clientWidth/2-cam.x)*(cam.z/old);cam.y=wrap.clientHeight/2-(wrap.clientHeight/2-cam.y)*(cam.z/old);document.getElementById('zoomLabel').textContent=Math.round(cam.z*100)+'%';draw()}
function renderSide(){const p=R[selected],o=owner(selected),army=ST.armies.find(a=>a.province===selected);document.getElementById('selName').textContent=p[0];document.getElementById('selInfo').innerHTML=`<div>Owner: <b>${nameOwner(o)}</b></div><div class="resource">Resource: <b>${p[2]}</b></div><div class="resource">Settlement: <b>${settled(selected)?'Yes':'No'}</b></div>${army?`<div class="resource">Army: <b>${fmt(army.size)}</b></div>`:''}`;let act='';if(o==='neutral'){act=`<button style="margin-top:9px;width:100%" onclick="claim(${selected})">Claim territory</button>`}else if(o==='you'&&!settled(selected)){act=`<button style="margin-top:9px;width:100%" onclick="found(${selected})">Found settlement</button>`}document.getElementById('selAction').innerHTML=act;const owned=R.filter((p,i)=>owner(i)==='you').length;document.getElementById('owned').textContent=owned;document.getElementById('settlements').textContent=R.filter((p,i)=>settled(i)).length;document.getElementById('armies').textContent=ST.armies.length;document.getElementById('claims').textContent=ST.claims;document.getElementById('realm').innerHTML=`<div>Provinces: <b>${owned}</b></div><div>Claims: <b>${ST.claims}</b></div>`;document.getElementById('events').innerHTML=ST.events.slice(0,7).map(e=>`<div class="event">${e}</div>`).join('')}
function claim(i){if(owner(i)!=='neutral')return;if(ST.claims<1)return toast('No claims.');ST.world[i]={owner:'you'};ST.claims--;ST.events.unshift(`Claimed ${R[i][0]}.`);save();renderSide();draw()}
function found(i){if(owner(i)!=='you'||settled(i))return;ST.world[i]={...(ST.world[i]||{}),owner:'you',settled:true};ST.events.unshift(`Settlement founded in ${R[i][0]}.`);save();renderSide();draw()}
function toast(s){const d=document.createElement('div');d.textContent=s;Object.assign(d.style,{position:'fixed',left:'50%',bottom:'20px',transform:'translateX(-50%)',padding:'8px 12px',background:'#101711',border:'1px solid #607063',borderRadius:'7px',zIndex:40});document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
function updateClock(){const m=ST.mins,day=Math.floor(m/1440)+1,h=String(Math.floor((m%1440)/60)).padStart(2,'0'),mm=String(m%60).padStart(2,'0');document.getElementById('clock').textContent=`Year 1 · Day ${day} · ${h}:${mm}`}
function debugRender(){const d=document.getElementById('debug');d.innerHTML=`<b>Debug</b><div style="margin-top:8px;display:flex;gap:5px;flex-wrap:wrap"><button onclick="ST.mins+=10;ST.tick++;save();updateClock()">+ Tick</button><button onclick="ST.mins+=60;ST.tick+=6;save();updateClock()">+ Hour</button><button onclick="ST.claims+=5;save();renderSide()">+5 Claims</button><button onclick="ST.armies.push({province:9,size:100,owner:'you'});save();renderSide();draw()">+ Army</button></div>`}
function toggleDebug(){const d=document.getElementById('debug');d.style.display=d.style.display==='none'?'block':'none';debugRender()}
load();document.getElementById('map').addEventListener('pointerdown',e=>{if(e.button!==0)return;cam.drag=true;cam.sx=e.clientX;cam.sy=e.clientY;cam.ox=cam.x;cam.oy=cam.y;document.getElementById('map').classList.add('dragging')});window.addEventListener('pointermove',e=>{if(!cam.drag)return;cam.x=cam.ox+e.clientX-cam.sx;cam.y=cam.oy+e.clientY-cam.sy;draw()});window.addEventListener('pointerup',e=>{if(!cam.drag)return;const dx=e.clientX-cam.sx,dy=e.clientY-cam.sy;cam.drag=false;document.getElementById('map').classList.remove('dragging');if(Math.hypot(dx,dy)<6){const r=document.getElementById('map').getBoundingClientRect(),wx=(e.clientX-r.left-cam.x)/cam.z,wy=(e.clientY-r.top-cam.y)/cam.z;selectAt(wx,wy)}});document.getElementById('map').addEventListener('wheel',e=>{e.preventDefault();const r=document.getElementById('map').getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,old=cam.z;cam.z=Math.min(1.45,Math.max(.45,cam.z*(e.deltaY<0?1.1:.91)));cam.x=mx-(mx-cam.x)*(cam.z/old);cam.y=my-(my-cam.y)*(cam.z/old);document.getElementById('zoomLabel').textContent=Math.round(cam.z*100)+'%';draw()},{passive:false});window.addEventListener('resize',draw);setInterval(()=>{ST.tick++;ST.mins+=10;save();updateClock()},600000);updateClock();renderSide();requestAnimationFrame(()=>{centerMap()});</script></body></html>
